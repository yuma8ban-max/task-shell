<body>
  <div class="bar">

  <h2>件名だけ追加</h2>
  <div class="row">

      type="text"

      placeholder="件名を入力"

  <div class="bar">

  <h2>今日やること</h2>
  <div class="sub">
    左の丸＝完了／右の ≡ をつまんで動かす＝時間帯・並び順の変更<br>
    時間帯は目安です。行の中央はスクロール、0.6秒の長押しでも移動できます。

      <div class="row">

        <button id="purge" type="button">この端末のデータを消す</button>

  <script>
    var VER = 'v3.0';
    var KU = 'gasUrl_v1';
    var KT = 'gasTok_v1';
    var KB = 'lastBase_v1';
    var DB = 'taskapp';
    var ST = 'outbox';
    var useIdb = true;

    var results = [];
    var sending = false;
    var fails = 0;
    var nextTry = 0;
    var adding = false;
    var localSaving = false;
    var lastCreatedAt = 0;

    var base = null;
    var current = [];
    var revision = 0;
    var loading = false;
    var reloadRequested = false;
    var cachedDisplay = false;

    var L = document.getElementById('list');
    var drag = null;
    var candidate = null;
    var holdTimer = null;
    var pointerId = null;
    var startX = 0;
    var startY = 0;
    var pointerX = 0;
    var pointerY = 0;
    var autoTimer = null;
    var autoDirection = 0;
    var ignoreClickUntil = 0;

    function $(id) {
      return document.getElementById(id);
    }

    function uuid() {
      if (window.crypto && window.crypto.randomUUID) {
        return window.crypto.randomUUID();
      }

      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (character) {
        var number = Math.random() * 16 | 0;
        return (character === 'x' ? number : number & 3 | 8).toString(16);
      });
    }

    function hourValue(value) {
      return typeof value === 'number' &&
        Number.isInteger(value) &&
        value >= 8 &&
        value <= 22
          ? value
          : null;
    }

    function compareJobs(a, b) {
      return Number(a.createdAt || 0) - Number(b.createdAt || 0) ||
        String(a.id).localeCompare(String(b.id));
    }

    function warn(message) {
      $('lwarn').replaceChildren();

      if (message) {
        var box = document.createElement('div');
        box.className = 'warn';
        box.textContent = message;
        $('lwarn').appendChild(box);
      }
    }

    /* ---------- 端末保存 ---------- */

    function openDb() {
      return new Promise(function (resolve, reject) {
        if (!window.indexedDB) {
          reject(new Error('端末保存を利用できません。'));
          return;
        }

        var request = indexedDB.open(DB, 1);

        request.onupgradeneeded = function () {
          var database = request.result;

          if (!database.objectStoreNames.contains(ST)) {
            database.createObjectStore(ST, {
              keyPath: 'id'
            });
          }
        };

        request.onsuccess = function () {
          resolve(request.result);
        };

        request.onerror = function () {
          reject(request.error);
        };
      });
    }

    function dbAction(mode, action) {
      return openDb().then(function (database) {
        return new Promise(function (resolve, reject) {
          var transaction;
          var request;

          try {
            transaction = database.transaction(ST, mode);
            request = action(transaction.objectStore(ST));
          } catch (error) {
            database.close();
            reject(error);
            return;
          }

          transaction.oncomplete = function () {
            database.close();
            resolve(request ? request.result : true);
          };

          transaction.onerror = transaction.onabort = function () {
            database.close();
            reject(transaction.error || new Error('端末保存に失敗しました。'));
          };
        });
      });
    }

    function lsAll() {
      var value = JSON.parse(localStorage.getItem('outbox_v1') || '[]');

      if (!Array.isArray(value)) {
        throw new Error('未送信の保存内容を読み取れません。');
      }

      return value;
    }

    function lsSave(list) {
      localStorage.setItem('outbox_v1', JSON.stringify(list));
    }

    function mergeStored(first, second) {
      var map = new Map();

      first.concat(second).forEach(function (item) {
        var previous = map.get(item.id);

        if (
          !previous ||
          Number(item.updatedAt || item.createdAt || 0) >=
          Number(previous.updatedAt || previous.createdAt || 0)
        ) {
          map.set(item.id, item);
        }
      });

      return Array.from(map.values());
    }

    async function putItem(item) {
      var saved = Object.assign({}, item, {
        updatedAt: Date.now()
      });

      if (useIdb) {
        try {
          await dbAction('readwrite', function (store) {
            return store.put(saved);
          });

          var leftovers = lsAll();

          if (leftovers.some(function (entry) {
            return entry.id === saved.id;
          })) {
            lsSave(leftovers.filter(function (entry) {
              return entry.id !== saved.id;
            }));
          }

          return;
        } catch (error) {
          useIdb = false;
        }
      }

      var list = lsAll().filter(function (entry) {
        return entry.id !== saved.id;
      });

      list.push(saved);
      lsSave(list);
    }

    async function allItems() {
      var fallback = lsAll();

      if (!useIdb) {
        return fallback;
      }

      try {
        var stored = await dbAction('readonly', function (store) {
          return store.getAll();
        });

        return mergeStored(stored || [], fallback);
      } catch (error) {
        useIdb = false;
        return fallback;
      }
    }

    async function delItem(id) {
      if (useIdb) {
        await dbAction('readwrite', function (store) {
          return store.delete(id);
        });
      }

      var fallback = lsAll();

      if (fallback.some(function (item) {
        return item.id === id;
      })) {
        lsSave(fallback.filter(function (item) {
          return item.id !== id;
        }));
      }
    }

    function cacheKey(date) {
      return 'cache_v3_' + date;
    }

    function saveCache() {
      if (!base) {
        return;
      }

      try {
        localStorage.setItem(KB, base);
        localStorage.setItem(cacheKey(base), JSON.stringify(current));
      } catch (error) {
        warn('画面の控えを端末に保存できませんでした。未送信の件数を確認してください。');
      }
    }

    function normalizeTasks(list) {
      if (!Array.isArray(list)) {
        return [];
      }

      return list.filter(function (task) {
        return task && task.taskId;
      }).map(function (task) {
        return {
          taskId: String(task.taskId),
          title: String(task.title || ''),
          hour: hourValue(task.hour)
        };
      });
    }

    function sortedByHour(list) {
      return list.map(function (task, index) {
        return {
          task: task,
          index: index
        };
      }).sort(function (a, b) {
        var first = a.task.hour === null ? 7 : a.task.hour;
        var second = b.task.hour === null ? 7 : b.task.hour;
        return first - second || a.index - b.index;
      }).map(function (item) {
        return item.task;
      });
    }

    function applyOrder(list, job) {
      var changesHours = Array.isArray(job.items);

      var items = changesHours
        ? job.items
        : (job.ids || []).map(function (id) {
          return {
            id: String(id)
          };
        });

      var byId = new Map();
      var used = new Set();
      var output = [];

      list.forEach(function (task) {
        byId.set(task.taskId, task);
      });

      items.forEach(function (item) {
        var id = String(item.id);
        var task = byId.get(id);

        if (!task || used.has(id)) {
          return;
        }

        used.add(id);

        output.push({
          taskId: task.taskId,
          title: task.title,
          hour: changesHours ? hourValue(item.hour) : task.hour
        });
      });

      list.forEach(function (task) {
        if (!used.has(task.taskId)) {
          output.push(task);
        }
      });

      return sortedByHour(output);
    }

    function applyPending(list, jobs, date) {
      var output = normalizeTasks(list);

      jobs.slice().sort(compareJobs).forEach(function (job) {
        if (job.kind === 'done') {
          output = output.filter(function (task) {
            return task.taskId !== String(job.taskId);
          });
        }

        if (
          job.kind === 'order' &&
          (!job.baseDate || job.baseDate === date)
        ) {
          output = applyOrder(output, job);
        }
      });

      return sortedByHour(output);
    }

    async function restoreCache() {
      try {
        base = localStorage.getItem(KB);

        if (!base) {
          render();
          return;
        }

        var text = localStorage.getItem(cacheKey(base));

        if (!text) {
          text = localStorage.getItem('cache_v2_' + base);
        }

        current = normalizeTasks(JSON.parse(text || '[]'));

        var pending = await allItems();
        current = applyPending(current, pending, base);
        cachedDisplay = true;
        updateBase();
        render();
      } catch (error) {
        warn('前回の表示を読み取れませんでした。端末のデータは消さず、「最新を取得」を押してください。');
        render();
      }
    }

    /* ---------- 通信 ---------- */

    function conf() {
      return {
        u: localStorage.getItem(KU) || '',
        t: localStorage.getItem(KT) || ''
      };
    }

    async function post(body, milliseconds) {
      var settings = conf();

      if (!settings.u) {
        throw {
          kind: 'noconf'
        };
      }

      var controller = window.AbortController
        ? new AbortController()
        : null;

      var timer = setTimeout(function () {
        if (controller) {
          controller.abort();
        }
      }, milliseconds || 30000);

      try {
        var response = await fetch(settings.u, {
          method: 'POST',
          body: JSON.stringify(Object.assign({
            token: settings.t
          }, body)),
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          redirect: 'follow',
          signal: controller ? controller.signal : undefined
        });

        var text = await response.text();

        if (/^\s*</.test(text)) {
          throw {
            kind: /Sign in|ログイン|accounts\.google/i.test(text)
              ? 'login'
              : 'servererror'
          };
        }

        try {
          return JSON.parse(text);
        } catch (error) {
          throw {
            kind: 'unreadable'
          };
        }
      } catch (error) {
        throw error && error.kind
          ? error
          : {
            kind: 'network',
            message: String((error && error.message) || error)
          };
      } finally {
        clearTimeout(timer);
      }
    }

    /* ---------- 送信箱 ---------- */

    function stateLabel(state) {
      if (state === 'saved') {
        return {
          text: '送信待ち',
          className: 'p-wait'
        };
      }

      if (state === 'unknown') {
        return {
          text: '確認中',
          className: 'p-send'
        };
      }

      if (state === 'blocked') {
        return {
          text: 'PCで要確認',
          className: 'p-ng'
        };
      }

      return {
        text: state || '送信待ち',
        className: 'p-wait'
      };
    }

    function addOutboxRow(title, state, note, removableId) {
      var row = document.createElement('li');
      var label = document.createElement('span');

      label.className = 'pill ' + state.className;
      label.textContent = state.text;
      row.appendChild(label);

      var text = document.createElement('span');
      text.textContent = title;
      row.appendChild(text);

      if (removableId) {
        var button = document.createElement('button');
        button.type = 'button';
        button.textContent = '破棄';

        button.addEventListener('click', async function () {
          button.disabled = true;

          try {
            await delItem(removableId);
            revision++;
            await renderOutbox();
            loadToday();
          } catch (error) {
            button.disabled = false;
            alert('端末の記録を変更できませんでした。データは消さずに、もう一度開いてください。');
          }
        });

        row.appendChild(button);
      }

      if (note) {
        var detail = document.createElement('div');
        detail.className = 'sub';
        detail.textContent = note;
        row.appendChild(detail);
      }

      $('outbox').appendChild(row);
    }

    async function renderOutbox() {
      try {
        var list = await allItems();
        list.sort(compareJobs);
        $('pcount').textContent = '未送信 ' + list.length + ' 件';
        $('outbox').replaceChildren();

        list.forEach(function (item) {
          lastCreatedAt = Math.max(lastCreatedAt, Number(item.createdAt || 0));

          addOutboxRow(
            item.title || (item.kind === 'order' ? '時間帯・並び順の更新' : '完了の反映'),
            stateLabel(item.state),
            item.note || '',
            item.state === 'saved' || item.state === 'blocked' ? item.id : null
          );
        });

        results.slice(-5).reverse().forEach(function (result) {
          addOutboxRow(
            result.title,
            {
              text: '完了',
              className: 'p-ok'
            },
            result.note,
            null
          );
        });
      } catch (error) {
        $('pcount').textContent = '未送信：読み取り不可';
        warn('未送信の記録を読み取れません。端末のデータは消さずに、アプリを開き直してください。');
      }
    }

    function makeJob(data) {
      lastCreatedAt = Math.max(Date.now(), lastCreatedAt + 1);

      return Object.assign({}, data, {
        id: uuid(),
        createdAt: lastCreatedAt,
        state: 'saved',
        note: ''
      });
    }

    async function addTask() {
      if (adding) {
        return;
      }

      var text = $('title').value;

      if (!text.trim()) {
        return;
      }

      if (text.length > 200) {
        alert('件名は200文字以内で入力してください。');
        return;
      }

      adding = true;
      $('add').disabled = true;

      var job = makeJob({
        kind: 'add',
        title: text
      });

      try {
        await putItem(job);
        revision++;

        if ($('title').value === text) {
          $('title').value = '';
        }

        await renderOutbox();
        trySend(true);
      } catch (error) {
        alert('この端末に保存できませんでした。入力はそのまま残します。');
      } finally {
        adding = false;
        $('add').disabled = false;
      }
    }

    function retryLater() {
      fails++;

      nextTry = Date.now() + Math.min(
        300000,
        5000 * Math.pow(3, Math.min(fails, 4))
      );
    }

    function networkMessage(error) {
      if (error.kind === 'login') {
        return 'PC側の公開設定を確認してください。';
      }

      if (error.kind === 'noconf') {
        return '接続先が未設定です。';
      }

      if (error.kind === 'servererror') {
        return 'PC側で処理が中断しました。未登録とは限りません。';
      }

      return '通信できませんでした。未登録とは限りません。後で同じ受付番号で再送します。';
    }

    async function trySend(force) {
      if (
        sending ||
        !navigator.onLine ||
        !conf().u ||
        (!force && Date.now() < nextTry)
      ) {
        return;
      }

      sending = true;
      var updated = false;

      try {
        while (navigator.onLine) {
          var list = await allItems();

          var next = list.filter(function (item) {
            return item.state === 'saved' || item.state === 'unknown';
          }).sort(compareJobs)[0];

          if (!next) {
            fails = 0;
            nextTry = 0;
            break;
          }

          await putItem(Object.assign({}, next, {
            state: 'unknown'
          }));

          await renderOutbox();

          try {
            var body;

            if (next.kind === 'order') {
              body = Array.isArray(next.items)
                ? {
                  mode: 'order',
                  items: next.items
                }
                : {
                  mode: 'order',
                  ids: next.ids || []
                };
            } else if (next.kind === 'done') {
              body = {
                mode: 'done',
                taskId: next.taskId
              };
            } else {
              body = {
                mode: 'add',
                requestId: next.id,
                title: next.title
              };
            }

            var result = await post(body);

            var accepted = result && result.ok && [
              'committed',
              'duplicate',
              'recovered',
              'saved',
              'done',
              'already'
            ].indexOf(result.status) >= 0;

            if (accepted) {
              revision++;
              await delItem(next.id);
              updated = true;
              fails = 0;
              nextTry = 0;

              if (!next.kind || next.kind === 'add') {
                results.push({
                  title: next.title,
                  note: result.status === 'committed'
                    ? '新規登録'
                    : '再送でも1件のまま'
                });
              }

              continue;
            }

            if (result && (
              result.status === 'indeterminate' ||
              result.status === 'invalid'
            )) {
              await putItem(Object.assign({}, next, {
                state: 'blocked',
                note: result.message ||
                  '登録されたか判定できません。PCで確認してください。'
              }));

              continue;
            }

            var setupProblem = result && [
              'denied',
              'nosetup',
              'needs_setup'
            ].indexOf(result.status) >= 0;

            await putItem(Object.assign({}, next, {
              state: setupProblem ? 'saved' : 'unknown',
              note: (result && result.message) ||
                '混雑・エラーのため後で再試行します。'
            }));

            retryLater();
            break;
          } catch (error) {
            retryLater();

            await putItem(Object.assign({}, next, {
              state: 'unknown',
              note: networkMessage(error)
            }));

            break;
          }
        }
      } catch (error) {
        warn('未送信の記録を読み書きできませんでした。端末のデータは消さずに開き直してください。');
      } finally {
        sending = false;
        await renderOutbox();

        if (updated) {
          loadToday();
        }
      }
    }

    /* ---------- 今日の一覧 ---------- */

    function updateBase() {
      $('base').textContent = base
        ? '基準日：' + base + (cachedDisplay ? '（前回取得時点）' : '')
        : '基準日：—';
    }

    async function loadToday() {
      if (drag || localSaving) {
        reloadRequested = true;
        return;
      }

      if (loading) {
        reloadRequested = true;
        return;
      }

      if (!conf().u) {
        $('lnote').textContent = '設定から接続先と合い言葉を保存してください。';
        return;
      }

      loading = true;
      reloadRequested = false;
      var startedAtRevision = revision;

      try {
        var result = await post({
          mode: 'list'
        });

        if (!result || !result.ok) {
          throw {
            kind: 'message',
            message: (result && result.message) || '一覧を取得できませんでした。'
          };
        }

        if (result.app !== VER) {
          throw {
            kind: 'message',
            message: 'PC側の公開中の版がv3.0ではありません。差し替え手順の「公開中の内容を更新する」を確認してください。'
          };
        }

        var pending = await allItems();

        if (
          startedAtRevision !== revision ||
          drag ||
          localSaving
        ) {
          reloadRequested = true;
          return;
        }

        base = result.baseDate;
        current = applyPending(result.tasks, pending, base);
        cachedDisplay = false;
        updateBase();
        warn('');
        saveCache();
        render();

        $('lnote').textContent = current.length
          ? '時間帯・並び順・完了はパソコンと共有されます。'
          : '今日の実行日が入った未完了タスクはありません。';
      } catch (error) {
        warn(
          error.kind === 'message'
            ? error.message
            : '最新を取得できませんでした。端末に保存してある内容を表示しています。'
        );
      } finally {
        loading = false;

        if (reloadRequested && !drag && !localSaving) {
          reloadRequested = false;
          setTimeout(loadToday, 100);
        }
      }
    }

    function render() {
      if (drag) {
        return;
      }

      L.replaceChildren();

      var hours = [null];

      for (var hour = 8; hour <= 22; hour++) {
        hours.push(hour);
      }

      hours.forEach(function (hour) {
        var section = document.createElement('section');
        section.className = 'slot';
        section.dataset.hour = hour === null ? '' : String(hour);

        var label = document.createElement('div');
        label.className = 'slot-label';
        label.textContent = hour === null ? '時間未定' : hour + '時';

        var list = document.createElement('ul');
        list.className = 'slot-list';

        current.filter(function (task) {
          return task.hour === hour;
        }).forEach(function (task) {
          var row = document.createElement('li');
          row.className = 'task';
          row.dataset.id = task.taskId;

          var hit = document.createElement('button');
          hit.type = 'button';
          hit.className = 'hit';
          hit.dataset.act = 'done';
          hit.setAttribute('aria-label', task.title + 'を完了');

          var circle = document.createElement('span');
          circle.className = 'check';
          circle.setAttribute('aria-hidden', 'true');
          hit.appendChild(circle);

          var title = document.createElement('span');
          title.className = 'ttl';
          title.textContent = task.title;

          var grip = document.createElement('button');
          grip.type = 'button';
          grip.className = 'grip';
          grip.dataset.act = 'grip';
          grip.textContent = '≡';
          grip.setAttribute('aria-label', task.title + 'を移動');

          row.append(hit, title, grip);
          list.appendChild(row);
        });

        section.append(label, list);
        L.appendChild(section);
      });

      var end = document.createElement('div');
      end.className = 'timeline-end';

      var endLabel = document.createElement('span');
      endLabel.textContent = '23:00';
      end.appendChild(endLabel);
      L.appendChild(end);

      var line = document.createElement('div');
      line.id = 'now';
      line.className = 'now-line';
      line.hidden = true;
      line.appendChild(document.createElement('span'));
      L.appendChild(line);

      updateNow();
    }

    function currentItems() {
      return Array.from(L.querySelectorAll('.task[data-id]')).map(function (row) {
        var hour = row.closest('.slot').dataset.hour;

        return {
          id: row.dataset.id,
          hour: hour === '' ? null : Number(hour)
        };
      });
    }

    async function saveOrder() {
      if (!base || localSaving) {
        render();
        return;
      }

      var before = current;
      var items = currentItems();

      var job = makeJob({
        kind: 'order',
        title: '時間帯・並び順の更新',
        baseDate: base,
        items: items
      });

      localSaving = true;
      revision++;
      current = applyOrder(current, job);

      try {
        await putItem(job);
        saveCache();
        await renderOutbox();
        trySend(true);
      } catch (error) {
        current = before;
        revision++;
        render();

        alert(
          'この端末に保存できなかったため、移動前に戻しました。' +
          '端末のデータは消さずに、もう一度試してください。'
        );
      } finally {
        localSaving = false;

        if (reloadRequested) {
          loadToday();
        }
      }
    }

    async function completeTask(row, id) {
      if (localSaving) {
        return;
      }

      var before = current;

      var job = makeJob({
        kind: 'done',
        title: '完了の反映',
        taskId: id,
        baseDate: base
      });

      localSaving = true;
      revision++;
      row.classList.add('done');

      current = current.filter(function (task) {
        return task.taskId !== id;
      });

      try {
        await putItem(job);
        saveCache();
        render();
        await renderOutbox();
        trySend(true);
      } catch (error) {
        current = before;
        revision++;
        render();
        alert('この端末に保存できなかったため、完了前に戻しました。');
      } finally {
        localSaving = false;

        if (reloadRequested) {
          loadToday();
        }
      }
    }

    /* ---------- つまみ・長押しで移動 ---------- */

    function clearHold() {
      if (holdTimer) {
        clearTimeout(holdTimer);
      }

      holdTimer = null;
      candidate = null;
    }

    function startDrag(row, id) {
      if (drag || localSaving || !base || !L.contains(row)) {
        return;
      }

      clearHold();
      revision++;
      drag = row;
      pointerId = id;
      row.classList.add('dragging');

      try {
        L.setPointerCapture(id);
      } catch (error) {
        // 画面全体の終了イベントでも移動を終了する。
      }

      if (navigator.vibrate) {
        navigator.vibrate(15);
      }
    }

    function stopAuto() {
      if (autoTimer) {
        clearInterval(autoTimer);
      }

      autoTimer = null;
      autoDirection = 0;
    }

    function targetSlot(y) {
      var slots = Array.from(L.querySelectorAll('.slot'));

      for (var i = 0; i < slots.length; i++) {
        var rect = slots[i].getBoundingClientRect();

        if (y >= rect.top && y < rect.bottom) {
          return slots[i];
        }
      }

      return null;
    }

    function placeDrag(x, y) {
      if (!drag) {
        return;
      }

      var bounds = L.getBoundingClientRect();

      if (x < bounds.left || x > bounds.right) {
        return;
      }

      var slot = targetSlot(y);

      if (!slot) {
        return;
      }

      var list = slot.querySelector('.slot-list');
      var others = Array.from(list.querySelectorAll('.task')).filter(function (row) {
        return row !== drag;
      });

      var before = null;

      for (var i = 0; i < others.length; i++) {
        var rect = others[i].getBoundingClientRect();

        if (y < rect.top + rect.height / 2) {
          before = others[i];
          break;
        }
      }

      if (
        drag.parentNode !== list ||
        (before && drag.nextElementSibling !== before) ||
        (!before && drag.nextElementSibling)
      ) {
        list.insertBefore(drag, before);
        updateNow();
      }
    }

    function autoScroll(y) {
      autoDirection = y < 80
        ? -10
        : y > window.innerHeight - 80
          ? 10
          : 0;

      if (!autoDirection) {
        stopAuto();
        return;
      }

      if (!autoTimer) {
        autoTimer = setInterval(function () {
          window.scrollBy(0, autoDirection);
          placeDrag(pointerX, pointerY);
        }, 16);
      }
    }

    function finishDrag(cancelled) {
      clearHold();

      if (!drag) {
        pointerId = null;
        return;
      }

      var captured = pointerId;
      drag.classList.remove('dragging');
      drag = null;
      pointerId = null;
      stopAuto();
      ignoreClickUntil = Date.now() + 500;

      try {
        if (L.hasPointerCapture(captured)) {
          L.releasePointerCapture(captured);
        }
      } catch (error) {
        // 既に指が離れている場合は、そのまま終了する。
      }

      if (cancelled) {
        render();

        if (reloadRequested) {
          loadToday();
        }
      } else {
        saveOrder();
      }

      updateNow();
    }

    L.addEventListener('pointerdown', function (event) {
      if (
        drag ||
        localSaving ||
        !base ||
        event.isPrimary === false ||
        (event.pointerType === 'mouse' && event.button !== 0)
      ) {
        return;
      }

      var row = event.target.closest('.task[data-id]');

      if (!row) {
        return;
      }

      var action = event.target.closest('[data-act]');
      var kind = action ? action.dataset.act : '';

      if (kind === 'done') {
        return;
      }

      clearHold();
      startX = event.clientX;
      startY = event.clientY;
      pointerX = event.clientX;
      pointerY = event.clientY;
      pointerId = event.pointerId;

      if (kind === 'grip') {
        event.preventDefault();
        startDrag(row, event.pointerId);
        return;
      }

      candidate = row;
      var heldId = event.pointerId;

      holdTimer = setTimeout(function () {
        if (candidate === row) {
          startDrag(row, heldId);
        }
      }, 600);
    });

    document.addEventListener('pointermove', function (event) {
      if (pointerId !== null && event.pointerId !== pointerId) {
        return;
      }

      if (!drag) {
        if (
          holdTimer &&
          (
            Math.abs(event.clientY - startY) > 8 ||
            Math.abs(event.clientX - startX) > 8
          )
        ) {
          clearHold();
        }

        return;
      }

      if (event.cancelable) {
        event.preventDefault();
      }

      pointerX = event.clientX;
      pointerY = event.clientY;
      placeDrag(pointerX, pointerY);
      autoScroll(pointerY);
    }, {
      passive: false
    });

    document.addEventListener('touchmove', function (event) {
      if (drag && event.cancelable) {
        event.preventDefault();
      }
    }, {
      passive: false
    });

    document.addEventListener('pointerup', function (event) {
      if (pointerId === null || event.pointerId === pointerId) {
        finishDrag(false);
      }
    });

    document.addEventListener('pointercancel', function (event) {
      if (pointerId === null || event.pointerId === pointerId) {
        finishDrag(true);
      }
    });

    L.addEventListener('click', function (event) {
      var action = event.target.closest('[data-act]');

      if (
        !action ||
        action.dataset.act !== 'done' ||
        localSaving ||
        drag ||
        Date.now() < ignoreClickUntil
      ) {
        return;
      }

      var row = action.closest('.task[data-id]');
      var task = row && current.find(function (item) {
        return item.taskId === row.dataset.id;
      });

      if (!task) {
        return;
      }

      if (confirm('「' + task.title + '」を完了にしますか。')) {
        completeTask(row, task.taskId);
      }
    });

    /* ---------- 現在時刻の線 ---------- */

    function japanNow() {
      var date = new Date(Date.now() + 9 * 60 * 60 * 1000);

      return {
        ymd: date.getUTCFullYear() + '-' +
          String(date.getUTCMonth() + 1).padStart(2, '0') + '-' +
          String(date.getUTCDate()).padStart(2, '0'),
        hour: date.getUTCHours(),
        minute: date.getUTCMinutes()
      };
    }

    function updateNow() {
      var line = $('now');

      if (!line) {
        return;
      }

      var now = japanNow();
      var slot = L.querySelector('.slot[data-hour="' + now.hour + '"]');

      if (
        base !== now.ymd ||
        now.hour < 8 ||
        now.hour >= 23 ||
        !slot
      ) {
        line.hidden = true;
        return;
      }

      line.style.top =
        (slot.offsetTop + slot.offsetHeight * now.minute / 60) + 'px';

      line.firstElementChild.textContent =
        String(now.hour).padStart(2, '0') + ':' +
        String(now.minute).padStart(2, '0');

      line.hidden = false;
    }

    /* ---------- 状態・設定 ---------- */

    function net() {
      $('net').textContent = '通信' + (navigator.onLine ? 'あり' : 'なし');
    }

    function workerVersion() {
      return new Promise(function (resolve) {
        if (
          !('serviceWorker' in navigator) ||
          !navigator.serviceWorker.controller ||
          !window.MessageChannel
        ) {
          resolve('確認できません');
          return;
        }

        var channel = new MessageChannel();

        var timer = setTimeout(function () {
          channel.port1.close();
          resolve('確認できません');
        }, 2000);

        channel.port1.onmessage = function (event) {
          clearTimeout(timer);
          channel.port1.close();

          resolve(
            event.data && event.data.cacheName
              ? event.data.cacheName
              : '確認できません'
          );
        };

        navigator.serviceWorker.controller.postMessage({
          type: 'TASK_VERSION'
        }, [channel.port2]);
      });
    }

    $('url').value = localStorage.getItem(KU) || '';
    $('tok').value = localStorage.getItem(KT) || '';

    $('save').addEventListener('click', function () {
      try {
        localStorage.setItem(KU, $('url').value.trim());
        localStorage.setItem(KT, $('tok').value.trim());
        revision++;
        nextTry = 0;
        alert('保存しました。');
        loadToday();
        trySend(true);
      } catch (error) {
        alert('設定を端末に保存できませんでした。');
      }
    });

    $('add').addEventListener('click', addTask);

    $('title').addEventListener('keydown', function (event) {
      if (event.key === 'Enter' && !event.isComposing) {
        addTask();
      }
    });

    $('send').addEventListener('click', function () {
      nextTry = 0;
      trySend(true);
    });

    $('reload').addEventListener('click', function () {
      nextTry = 0;
      loadToday();
      trySend(true);
    });

    $('copy').addEventListener('click', async function () {
      try {
        var list = await allItems();
        var worker = await workerVersion();

        var text = [
          '画面：' + VER,
          'オフライン保存：' + worker,
          '基準日：' + (base || '未取得'),
          '通信：' + (navigator.onLine ? 'あり' : 'なし'),
          '保存方式：' + (useIdb ? '端末内' : '簡易'),
          '未送信：' + list.length + ' 件',
          '表示中：' + current.length + ' 件',
          '送信中：' + (sending ? 'はい' : 'いいえ'),
          '送信待ち：' + list.filter(function (item) {
            return item.state === 'saved';
          }).length + ' 件',
          '確認中：' + list.filter(function (item) {
            return item.state === 'unknown';
          }).length + ' 件',
          'PCで要確認：' + list.filter(function (item) {
            return item.state === 'blocked';
          }).length + ' 件'
        ].join('\n');

        if (navigator.clipboard && navigator.clipboard.writeText) {
          try {
            await navigator.clipboard.writeText(text);
            alert('コピーしました。');
            return;
          } catch (error) {
            // コピーできない場合は、文字を表示して手動でコピーする。
          }
        }

        prompt('この内容をコピーしてください。', text);
      } catch (error) {
        alert('状態を読み取れませんでした。端末のデータは消さないでください。');
      }
    });

    $('purge').addEventListener('click', async function () {
      if (sending || adding || localSaving || drag) {
        alert('処理中です。終わってから操作してください。');
        return;
      }

      if (!confirm(
        'この端末に保存した内容（未送信・前回の表示・接続先・合い言葉）を消します。よろしいですか。'
      )) {
        return;
      }

      try {
        if (window.indexedDB) {
          await new Promise(function (resolve, reject) {
            var request = indexedDB.deleteDatabase(DB);

            request.onsuccess = resolve;

            request.onerror = function () {
              reject(request.error);
            };

            request.onblocked = function () {
              reject(new Error('別のタスク画面を閉じてから試してください。'));
            };
          });
        }

        Object.keys(localStorage).forEach(function (key) {
          if (
            key.indexOf('order_v1_') === 0 ||
            key.indexOf('cache_v1_') === 0 ||
            key.indexOf('cache_v2_') === 0 ||
            key.indexOf('cache_v3_') === 0 ||
            key === 'outbox_v1' ||
            key === KU ||
            key === KT ||
            key === KB
          ) {
            localStorage.removeItem(key);
          }
        });

        alert('消しました。ブラウザー全体のデータは消していません。');
        location.reload();
      } catch (error) {
        alert(String(error.message || error));
      }
    });

    window.addEventListener('online', function () {
      net();
      nextTry = 0;
      trySend(true);
      loadToday();
    });

    window.addEventListener('offline', net);
    window.addEventListener('resize', updateNow);

    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        finishDrag(true);
        return;
      }

      net();
      updateNow();
      nextTry = 0;
      trySend(true);
      loadToday();
    });

    window.addEventListener('blur', function () {
      if (drag || holdTimer) {
        finishDrag(true);
      }
    });

    setInterval(function () {
      trySend(false);
    }, 20000);

    setInterval(updateNow, 60000);

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js', {
        updateViaCache: 'none'
      }).then(function (registration) {
        return registration.update();
      }).catch(function () {
        warn('オフライン用の画面を更新できませんでした。通信できる場所でもう一度開いてください。');
      });
    }

    async function start() {
      net();
      $('ver').textContent = VER;
      render();
      await restoreCache();
      await renderOutbox();
      loadToday();
      trySend(true);
    }

    start();
  </script>
</body>
</html>
