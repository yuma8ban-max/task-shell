          if (!navigator.onLine) {
            throw new Error(
              '通信が戻ってから保存してください。入力は残しています。'
            );
          }

          const title = String(form.get('title') || '').trim();
          const due = String(form.get('due') || '');
          const date = String(form.get('date') || '');

          const problem = TaskCore.titleProblem(title, '件名');

          if (problem) {
            throw new Error(problem);
          }

          if (
            title === captured.title &&
            due === captured.due &&
            date === captured.date
          ) {
            notify('変更はありません');
            return;
          }

          await client.enqueue(Object.assign({}, payload, {
            title: title,
            due: due,
            date: date
          }), '編集：' + title, context);

          notify('端末に保存しました');
        });

        field('title', '件名＊', 'textarea', captured.title, true).focus();
        field('due', '期限', 'date', captured.due, false);
        field('date', '実行日', 'date', captured.date, false);
      }

      $('editor-form').addEventListener('compositionstart', function () {
        editorComposing = true;
      });

      $('editor-form').addEventListener('compositionend', function () {
        editorComposing = false;
        editorImeUntil = performance.now() + 100;
      });

      $('editor-form').addEventListener('keydown', function (event) {
        if (event.isComposing || event.keyCode === 229) {
          editorImeUntil = performance.now() + 100;
        }

        if (event.key === 'Enter' && event.repeat) {
          event.preventDefault();
          return;
        }

        // 件名（複数行）は Enter で保存、Shift+Enter で改行（スマホは Enter で改行）
        if (
          event.target.tagName === 'TEXTAREA' &&
          TaskCore.titleEnterSaves(event)
        ) {
          event.preventDefault();
          $('editor-form').requestSubmit();
        }
      });

      $('editor-form').addEventListener('submit', async function (event) {
        event.preventDefault();

        if (
          !editorHandler ||
          editorSaving ||
          editorComposing ||
          performance.now() < editorImeUntil
        ) {
          return;
        }

        const handler = editorHandler;
        const form = new FormData($('editor-form'));

        editorSaving = true;
        $('editor-submit').disabled = true;
        $('editor-cancel').disabled = true;
        $('editor-note').hidden = true;

        try {
          await handler(form);
          $('editor').close();
        } catch (error) {
          $('editor-note').textContent = String(error.message || error);
          $('editor-note').hidden = false;
        } finally {
          editorSaving = false;
          $('editor-submit').disabled = false;
          $('editor-cancel').disabled = false;
        }
      });

      $('editor-cancel').addEventListener('click', function () {
        $('editor').close();
      });

      $('editor').addEventListener('cancel', function (event) {
        if (editorSaving) {
          event.preventDefault();
        }
      });

      $('editor').addEventListener('close', function () {
        const position = editorPosition;
        editorHandler = null;
        editorPosition = null;
        editorComposing = false;
        restorePosition(position);

        requestAnimationFrame(function () {
          restorePosition(position);
        });
      });

      /* ---------- したいこと ---------- */

      function loadWishes(background) {
        if (wishReadPromise) {
          return wishReadPromise;
        }

        if (!wishes.ready) {
          wishLoading = true;
          render();
          return Promise.resolve(null);
        }

        if (!navigator.onLine || !client.configured()) {
          wishLoading = false;
          wishError = !navigator.onLine
            ? '通信がありません。端末に保存した内容を表示しています。'
            : '接続先と合い言葉を設定してください。';

          render();
          return Promise.resolve(null);
        }

        wishLoading = true;
        wishError = '';
        render();

        wishReadPromise = wishes.read(!!background).catch(function (error) {
          if (!client.paused) {
            wishError = String(error.message || error);
          }

          return null;
        }).finally(function () {
          wishLoading = false;
          wishReadPromise = null;
          nextAutoRead = Date.now() + (wishError ? 60000 : 20000);
          render();
        });

        return wishReadPromise;
      }

      function renderWishes(content) {
        content.appendChild(make('h2', 'したいこと'));

        if (wishLoading || !wishes.ready) {
          const loading = make('p', '更新中…', 'loading');
          loading.setAttribute('role', 'status');
          content.appendChild(loading);
        }

        if (wishError) {
          const box = make('div', null, 'notice error');

          box.appendChild(make(
            'p',
            navigator.onLine ? '一覧を更新できませんでした' : '通信なし'
          ));

          const retry = button('再試行', function () {
            loadWishes(false);
          });

          retry.disabled = !navigator.onLine || wishLoading;
          box.appendChild(retry);

          const details = make('details');
          details.append(
            make('summary', '詳細'),
            make('div', wishError, 'detail-text')
          );

          box.appendChild(details);
          content.appendChild(box);
        }

        const items = wishes.effectiveItems();

        const active = items.filter(function (item) {
          return !item.done;
        }).sort(function (a, b) {
          return a.row - b.row;
        });

        const completed = items.filter(function (item) {
          return item.done;
        }).sort(function (a, b) {
          return b.doneAt - a.doneAt || b.row - a.row;
        });

        const list = make('div', null, 'cards wish-list');

        active.forEach(function (item) {
          list.appendChild(wishCard(item));
        });

        content.appendChild(list);

        if (!active.length && !wishLoading && wishes.state.snapshot) {
          content.appendChild(make('p', 'まだありません', 'sub'));
        }

        const achieved = make('details', null, 'wish-completed');
        achieved.id = 'wish-achieved';
        achieved.open = achievedOpen;
        achieved.appendChild(
          make('summary', '達成済み ' + completed.length + '件')
        );

        const doneList = make('div', null, 'cards');

        completed.forEach(function (item) {
          doneList.appendChild(wishCard(item));
        });

        achieved.appendChild(doneList);

        achieved.addEventListener('toggle', function () {
          if (document.contains(achieved)) {
            achievedOpen = achieved.open;
          }
        });

        content.appendChild(achieved);
      }

      function wishUnavailable(item) {
        return !wishes.ready ||
          !!client.legacyCount ||
          !!item.localOnly ||
          !!item.pendingAdd ||
          !!item.needsCheck;
      }

      function wishCard(item) {
        const row = make(
          'div',
          null,
          'card' +
            (item.done ? ' wish-achieved' : '') +
            (item.pending ? ' pending-add' : '')
        );

        const main = make('div', null, 'card-main');
        main.appendChild(make('div', item.title, 'card-title'));

        if (item.pending) {
          const job = wishes.state.jobs.find(function (entry) {
            return entry.id === item.jobId;
          });

          main.appendChild(make(
            'div',
            job ? jobStateLabel(job) : '送信待ち',
            'pending-label'
          ));
        }

        const actions = make('div', null, 'card-actions');

        const edit = button('編集', function () {
          openWishEditor(item.wishId);
        });

        edit.disabled = wishUnavailable(item);
        edit.setAttribute('aria-label', item.title + 'を編集');
        actions.appendChild(edit);

        if (item.done) {
          const restore = button('戻す', function () {
            changeWish(item, false);
          });

          restore.disabled = wishUnavailable(item);
          actions.appendChild(restore);
          row.append(main, actions);
        } else {
          const done = button('', function () {
            changeWish(item, true);
          }, 'hit');

          done.setAttribute('aria-label', item.title + 'を達成済みにする');
          done.disabled = wishUnavailable(item);
          done.appendChild(make('span', null, 'circle'));
          row.append(done, main, actions);
        }

        return row;
      }

      async function changeWish(item, done) {
        if (wishUnavailable(item)) {
          return;
        }

        if (!confirm(
          '「' + item.title + '」を' +
          (done ? '達成済みにしますか。' : 'したいことに戻しますか。')
        )) {
          return;
        }

        try {
          await wishes.setDone(item, done);
          notify('端末に保存しました');
        } catch (error) {
          failed('保存できませんでした', error);
        }
      }

      function openWishAdd() {
        showEditor(
          'したいことを追加',
          async function (form) {

      /* ---------- 定期タスク ---------- */

      function automaticJobs() {
        return state.jobs.filter(function (job) {
          return job.payload.action === 'automatic';
        }).sort(function (a, b) {
          return a.sequence - b.sequence;
        });
      }

      function automaticControl(periodic, supported) {
        const wrapper = make('div', null, 'automatic-control');
        const label = make('span', '毎日の自動追加', 'automatic-label');
        label.id = 'automatic-label';

        const pending = automaticJobs();
        const latest = pending.length ? pending[pending.length - 1] : null;

        const control = button('', toggleAutomatic, 'auto-switch');
        control.setAttribute('role', 'switch');
        control.setAttribute('aria-checked', String(periodic.automatic));
        control.setAttribute('aria-labelledby', 'automatic-label');
        control.setAttribute('aria-describedby', 'automatic-status');

        control.disabled =
          !navigator.onLine ||
          !supported ||
          !!client.legacyCount ||
          pending.length > 0;

        control.setAttribute(
          'aria-busy',
          String(pending.some(function (job) {
            return job.state === 'saved' || job.state === 'sending';
          }))
        );

        const track = make('span', null, 'auto-switch-track');
        track.setAttribute('aria-hidden', 'true');
        track.appendChild(make('span', null, 'auto-switch-thumb'));
        control.appendChild(track);

        const current = make(
          'span',
          periodic.automatic ? 'ON' : 'OFF',
          'automatic-state'
        );

        current.setAttribute('aria-hidden', 'true');

        const status = make('span', '', 'automatic-status');
        status.id = 'automatic-status';
        status.setAttribute('aria-live', 'polite');

        if (latest) {
          const destination = latest.payload.enabled ? 'ON' : 'OFF';

          const attention = pending.some(function (job) {
            return job.state === 'blocked' || job.state === 'unknown';
          });

          status.textContent = attention
            ? destination + 'への変更結果を確認しています'
            : destination + 'へ変更中';

          status.classList.toggle('has-error', attention);
        }

        status.hidden = !latest;
        wrapper.append(label, control, current, status);
        return wrapper;
      }

      function addDueFields(value) {
        const rule = value || {
          type: 'none'
        };

        const type = selectField(
          'dueType',
          '期限',
          [
            ['none', 'なし'],
            ['offset', '基準日から○日後'],
            ['weekly', '毎週○曜日'],
            ['monthly', '毎月○日'],
            ['monthEnd', '毎月末']
          ],
          rule.type
        );

        const days = field(
          'dueDays',
          '何日後＊',
          'number',
          rule.days == null ? 0 : rule.days,
          false
        );

        days.min = '0';
        days.max = '3650';
        days.step = '1';

        const weekday = selectField(
          'dueWeekday',
          '曜日＊',
          [
            [1, '月曜日'],
            [2, '火曜日'],
            [3, '水曜日'],
            [4, '木曜日'],
            [5, '金曜日'],
            [6, '土曜日'],
            [0, '日曜日']
          ],
          rule.weekday == null ? 5 : rule.weekday
        );

        const day = field(
          'dueDay',
          '日＊',
          'number',
          rule.day == null ? 15 : rule.day,
          false
        );

        day.min = '1';
        day.max = '31';
        day.step = '1';

        function update() {
          [
            [days, 'offset'],
            [weekday, 'weekly'],
            [day, 'monthly']
          ].forEach(function (entry) {
            const active = type.value === entry[1];
            entry[0].closest('.field').hidden = !active;
            entry[0].disabled = !active;
            entry[0].required = active;
          });
        }

        type.addEventListener('change', update);
        update();
      }

      function dueRuleFromForm(form) {
        const type = String(form.get('dueType') || 'none');

        function integer(name, minimum, maximum) {
          const raw = String(
            form.get(name) == null ? '' : form.get(name)
          ).trim();

          const value = Number(raw);

          if (
            !raw ||
            !Number.isInteger(value) ||
            value < minimum ||
            value > maximum
          ) {
            throw new Error(
              '期限は' + minimum + '～' + maximum +
                'の整数で指定してください。'
            );
          }

          return value;
        }

        switch (type) {
          case 'none':
            return {
              type: 'none'
            };
          case 'offset':
            return {
              type: 'offset',
              days: integer('dueDays', 0, 3650)
            };
          case 'weekly':
            return {
              type: 'weekly',
              weekday: integer('dueWeekday', 0, 6)
            };
          case 'monthly':
            return {
              type: 'monthly',
              day: integer('dueDay', 1, 31)
            };
          case 'monthEnd':
            return {
              type: 'monthEnd'
            };
          default:
            throw new Error('期限を選び直してください。');
        }
      }

      /* ---------- 完了済み ---------- */

      function scheduleHistoryRefresh() {
        if (page !== 'history') {
          return;
        }

        if (historyLoading) {
          historyAgain = true;
          return;
        }

        if (historyRefreshTimer) {
          clearTimeout(historyRefreshTimer);
        }

        historyRefreshTimer = setTimeout(function () {
          historyRefreshTimer = null;

          if (page === 'history') {
            loadHistory(false);
          }
        }, 200);
      }

      function loadHistory(more, background) {
        if (historyPromise) {
          return historyPromise;
        }

        if (!client.ready) {
          historyLoading = true;
          render();
          return Promise.resolve(null);
        }

        if (!navigator.onLine || !client.configured()) {
          historyLoading = false;
          historyError = navigator.onLine
            ? '接続先と合い言葉を設定してください。'
            : '通信がありません。通信が戻ると更新します。';

          historyFailedMore = !!more;
          render();
          return Promise.resolve(null);
        }

        const offset = more ? historyData.items.length : 0;
        historyLoading = true;
        historyError = '';
        historyFailedMore = !!more;
        render();

        historyPromise = client.read({
          action: 'history',
          offset: offset
        }, {
          background: !!background
        }).then(function (result) {
          if (!result) {
            return null;
          }

          historyData = {
            total: result.history.total,
            items: more
              ? historyData.items.concat(result.history.items)
              : result.history.items,
            loaded: true
          };

          historyError = '';
          return result;
        }).catch(function (error) {
          if (!client.paused) {
            historyError = String(error.message || error);
          }

          return null;
        }).finally(function () {
          historyLoading = false;
          historyPromise = null;
          nextAutoRead = Date.now() + (historyError ? 60000 : 20000);
          render();

          if (historyAgain) {
            historyAgain = false;

            if (page === 'history' && navigator.onLine) {
              scheduleHistoryRefresh();
            }
          }
        });

        return historyPromise;
      }

      function renderHistory(content) {
        content.appendChild(make('h2', '完了済み'));

        const tools = make('div', null, 'toolbar');
        const undo = button('直前の完了を戻す', undoDone);

        const count = state.snapshot && state.snapshot.undo
          ? state.snapshot.undo.count

        const reload = button(
          historyLoading ? '更新中' : '更新',

            loadHistory(false);
          }
        );

        reload.disabled =
          !navigator.onLine ||
          !client.ready ||
          historyLoading;

        tools.append(undo, reload);
        content.appendChild(tools);

        if (historyLoading) {
          const loading = make(
            'p',
            retryingRead('history') ? '一覧を取り直しています…' : '更新中…',
            'loading'
          );

          loading.id = 'history-loading-label';
          loading.setAttribute('role', 'status');
          content.appendChild(loading);
        }

        const pending = state.jobs.filter(function (job) {
          return job.payload.action === 'done' ||
            job.payload.action === 'undo';
        }).length;

        if (pending) {
          content.appendChild(make(
            'p',
            '完了・取り消しの反映待ち ' + pending + '件',
            'status'
          ));
        }

        if (historyError) {
          const box = make('div', null, 'notice error');
          box.appendChild(make('p', '完了済みを更新できませんでした'));

          const retry = button('再試行', function () {
            loadHistory(historyFailedMore);
          });

          retry.disabled = !navigator.onLine || historyLoading;
          box.appendChild(retry);

          const details = make('details');
          details.append(
            make('summary', '詳細'),
            make('div', historyError, 'detail-text')
          );

          box.appendChild(details);
          content.appendChild(box);
        }

        if (
          historyData.loaded &&
          !historyData.items.length &&
          !historyLoading &&
          !historyError
        ) {
          content.appendChild(make('p', '完了済みなし', 'sub'));
        }

        const cards = make('div', null, 'cards');

        historyData.items.forEach(function (item) {

          const mark = make('span', null, 'history-mark');
          mark.appendChild(icon('check'));

          const main = make('div', null, 'card-main');
          main.appendChild(make('div', item.title, 'card-title'));

          if (item.doneAt) {
            main.appendChild(make('div', '完了 ' + item.doneAt, 'sub'));
          }

          if (item.progress) {
            main.appendChild(make('div', item.progress, 'run-progress-text'));
          }

          card.append(mark, main);
          cards.appendChild(card);
        });

        content.appendChild(cards);

        if (historyData.items.length < historyData.total) {
          const more = button('さらに表示', function () {
            loadHistory(true);
          });

          more.disabled = !navigator.onLine || historyLoading;
          content.appendChild(more);
        }
      }

      async function undoDone() {
        if (!onlineRequired()) {
          return;
        }

        if (state.jobs.some(function (job) {
          return job.payload.action === 'done' ||
            job.payload.action === 'undo';
        })) {
          notify('直前の完了を確認中です。保存結果が分かってから戻せます');
          return;
        }

        const undo = state.snapshot && state.snapshot.undo;

        if (!undo || !undo.count) {
          notify('戻せる完了はありません');
          return;
        }

        if (
          !Array.isArray(undo.targets) ||
          !undo.targets.every(function (id) {
            return typeof id === 'string' && !!id;
          })
        ) {
          notify(
            '保存先を更新し、「設定」の「動作確認」を実行してください',
            true
          );
          return;
        }

        if (!confirm(
          undo.count + '件を戻しますか。\n\n' + undo.titles.join('\n')
        )) {
          return;
        }

        try {
          await client.enqueue({
            action: 'undo',
            expectedUndo: undo.version,
            undoTargets: undo.targets.slice()
          }, '直前の完了を戻す');
        } catch (error) {
          failed('保存できませんでした', error);
        }
      }

      function workerVersion() {
        return new Promise(function (resolve) {
          if (
            !navigator.serviceWorker ||
            !navigator.serviceWorker.controller ||
            !window.MessageChannel
          ) {
            resolve('確認できません');
            return;
          }

          const channel = new MessageChannel();

          const timer = setTimeout(function () {
            channel.port1.close();
            resolve('確認できません');
          }, 2000);

          channel.port1.onmessage = function (event) {
            clearTimeout(timer);
            channel.port1.close();
            resolve(event.data.cacheName || '確認できません');
          };

          navigator.serviceWorker.controller.postMessage({
            type: 'TASK_VERSION'
          }, [channel.port2]);
        });
      }

      async function openSettings() {
        if (anyOrderDragging()) {
          return;
        }

        const config = client.config();
        $('url').value = config.url;
        $('token').value = config.token;
        renderSettingsState();
        $('settings-dialog').showModal();
        cacheVersion = await workerVersion();
        renderSettingsState();
      }

      $('settings-save').onclick = async function () {
        const previous = client.config();
        const url = $('url').value.trim();
        const token = $('token').value.trim();

        if (allPendingCount() && previous.url && previous.url !== url) {
          alert('未送信があるため、接続先は変更できません。');
          return;
        }

        if (
          (url !== previous.url || token !== previous.token) &&
          (
            client.pumpPromise ||
            wishes.pumpPromise ||
            refreshPromise ||
            historyPromise ||
            wishReadPromise ||
            checking
          )
        ) {
          alert('通信が終わってから保存してください。');
          return;
        }

        try {
          localStorage.setItem(TaskCore.URL_KEY, url);
          localStorage.setItem(TaskCore.TOKEN_KEY, token);
          client.resetConnection();

          if (url !== previous.url) {
            historyData = {
              items: [],
              total: 0,
              loaded: false
            };

            await client.mutate(function (saved) {
              saved.snapshot = null;
              saved.transitions = [];
              saved.lastNetworkAt = 0;
            });

            if (wishes.ready) {
              await wishes.mutate(function (saved) {
                saved.snapshot = null;
                saved.transitions = [];
                saved.lastNetworkAt = 0;
              });
            }
          }

          $('settings-dialog').close();
          notify('設定を保存しました');

          await refresh();
          await client.pump(true);

          if (wishes.ready) {
            await wishes.reloadLocal();
            await wishes.pump(true);
          }

          if (page === 'wishes') {
            await loadWishes(false);
          }
        } catch (error) {
          failed('設定を保存できませんでした', error);
        }
      };

      $('settings-close').onclick = function () {
        $('settings-dialog').close();
      };

      $('check').onclick = async function () {
        if (!onlineRequired() || checking) {
          return;
        }

        checking = true;
        $('check').disabled = true;
        $('check').textContent = '動作確認中';

        try {
          const result = await client.read({
            action: 'check'
          }, {
            forceFull: true
          });

          if (result) {
            alert(
              '改修版：' + (result.build || '未取得') +
              '\n\n' + result.checks.join('\n')
            );
          }
        } catch (error) {
          alert(String(error.message || error));
        } finally {
          checking = false;
          $('check').disabled = false;
          $('check').textContent = '動作確認';
        }
      };

      $('copy').onclick = async function () {
        cacheVersion = await workerVersion();
        renderSettingsState();

        const text = stateRows().map(function (row) {
          return row[0] + '：' + row[1];
        }).join('\n') +
          '\n\n【通信の点検記録】\n' +
          client.readDiagnosticText();

        try {
          await navigator.clipboard.writeText(text);
          alert('コピーしました。');
        } catch (error) {
          prompt('この内容をコピーしてください。', text);
        }
      };

      /* ---------- 更新・復帰・起動 ---------- */

      function refresh(background) {
        if (refreshPromise) {
          return refreshPromise;
        }

        if (
          !client.ready ||
          client.legacyCount ||
          !client.configured() ||
          !navigator.onLine ||
          client.paused ||
          anyOrderDragging()
        ) {
          return Promise.resolve(false);
        }

        refreshPromise = client.read({
          action: 'load'
        }, {
          background: !!background,
          forceFull: !client.received
        }).then(function (result) {
          if (result && messageKind === 'read') {
            notify('');
          }

          return !!result;
        }).catch(function (error) {
          if (client.paused) {
            return false;
          }

          const details = [
            String(error.message || error),
            state.snapshot
              ? '前回の一覧を表示しています。'
              : '一覧はまだ取得できていません。'
          ];

          if (allPendingCount()) {
            details.push('送信待ちの操作は端末に残しています。');
          }

          details.push(
            '「設定」→「診断情報をコピー」で通信の記録を確認できます。'
          );

          notify(
            '一覧を更新できませんでした',
            true,
            details.join('\n'),
            'read'
          );

          return false;
        }).finally(function () {
          refreshPromise = null;
          nextAutoRead = Date.now() +
            (client.lastReadError ? 60000 : 20000);
          renderStatus();
        });

        renderStatus();
        return refreshPromise;
      }

      async function automaticRead() {
        if (
          autoBusy ||
          document.hidden ||
          !client.ready ||
          !wishes.ready ||
          client.paused ||
          client.legacyCount ||
          !client.configured() ||
          !navigator.onLine ||
          anyOrderDragging() ||
          anyDialogOpen() ||
          refreshPromise ||
          historyPromise ||
          wishReadPromise ||
          manualReloading ||
          periodicAdding ||
          resumePromise ||
          allPendingCount() ||
          Date.now() < nextAutoRead
        ) {
          return;
        }

        const active = document.activeElement;

        if (
          active &&
          $('content').contains(active) &&
          ['INPUT', 'SELECT', 'TEXTAREA'].indexOf(active.tagName) >= 0
        ) {
          return;
        }

        autoBusy = true;

        try {
          if (page === 'history') {
            await loadHistory(false, true);
          } else if (page === 'wishes') {
            await loadWishes(true);
          } else {
            await refresh(true);
          }
        } finally {
          autoBusy = false;
        }
      }

      function resumeScreen() {
        if (
          resumePromise ||
          document.hidden ||
          !client.ready ||
          !wishes.ready
        ) {
          return resumePromise || Promise.resolve();
        }

        resumePromise = (async function () {
          const oldRefresh = refreshPromise;
          const oldHistory = historyPromise;
          const replaced = await client.resumeReads();

          if (replaced) {
            await Promise.all([
              oldRefresh || Promise.resolve(),
              oldHistory || Promise.resolve()
            ]);
          }

          await client.reloadLocal();
          await wishes.reloadLocal();
          await client.pump(false);
          await wishes.pump(false);

          if (
            document.hidden ||
            client.paused ||
            anyDialogOpen() ||
            !navigator.onLine
          ) {
            return;
          }

          if (page === 'history') {
            await loadHistory(false);
          } else if (page === 'wishes') {
            await loadWishes(false);
          } else {
            await refresh();
          }
        })().catch(function (error) {
          failed('端末の記録を読み取れません', error);
        }).finally(function () {
          resumePromise = null;
        });

        return resumePromise;
      }

      document.querySelectorAll('nav [data-page]')
        .forEach(function (control) {
          control.addEventListener('click', async function () {
            if (anyOrderDragging()) {
              return;
            }

            if (control.dataset.page !== page && (await confirmOrderLeave()) === 'stay') {
              return;
            }

            rememberPoolScroll();
            savePoolPreferences(true);
            page = control.dataset.page;

            if (page === 'history') {
              loadHistory(false);
            } else if (page === 'wishes') {
              loadWishes(false);
            } else {
              render();
            }
          });
        });

      $('add').onclick = function () {
        if (page === 'wishes') {
          openWishAdd();
        } else {
          openAdd();
        }
      };

      $('settings').onclick = openSettings;

      $('message-close').onclick = function () {
        notify('');
        renderStatus();
      };

      $('reload').onclick = async function () {
        if (manualReloading || !onlineRequired()) {
          return;
        }

        manualReloading = true;
        renderStatus();

        try {
          await client.read({
            action: 'load'
          }, {
            forceFull: !client.received
          });

          await client.pump(true);
          await wishes.reloadLocal();
          await wishes.pump(true);

          if (page === 'history') {
            await loadHistory(false);
          } else if (page === 'wishes') {
            await loadWishes(false);
          }

          if (messageKind === 'read' && !client.lastReadError) {
            notify('');
          }
        } catch (error) {
          failed('更新できませんでした', error);
        } finally {
          manualReloading = false;
          render();
        }
      };

      window.addEventListener('online', function () {
        resumeScreen();
      });

      window.addEventListener('offline', render);

      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          rememberPoolScroll();
          savePoolPreferences(true);
          return;
        }

        resumeScreen();
      });

      // 送信待ち・送信中・確認が必要な保存が残っているときだけ、閉じる前に警告する
      window.addEventListener('beforeunload', function (event) {
        if (allPendingCount() > 0 || anyOrderDirty()) {
          event.preventDefault();
          event.returnValue = '';
        }
      });

      window.addEventListener('pagehide', function () {
        rememberPoolScroll();
        savePoolPreferences(true);
      });

      window.addEventListener('pageshow', function (event) {
        if (event.persisted) {
          setTimeout(resumeScreen, 0);
        }
      });

      window.addEventListener('resize', function () {
        positionTaskFilter();
        updatePoolHeight();
        restorePoolScroll();
      });

      window.addEventListener('scroll', function () {
        if (scrollFrame) {
          return;
        }

        scrollFrame = requestAnimationFrame(function () {
          scrollFrame = null;
          positionTaskFilter();
          updatePoolHeight();
        });
      }, {
        passive: true
      });

      setInterval(automaticRead, 5000);

      setInterval(function () {
        const today = japanDate();

        if (today !== lastDateSeen) {
          lastDateSeen = today;

          if (!anyOrderDragging() && !anyDialogOpen()) {
            render();
          }
        }
      }, 60000);

      if (window.SidePanel) {
        SidePanel.mount({
          id: 'nav',
          root: document.documentElement,
          panel: document.querySelector('.app-nav'),
          host: document.querySelector('.app-nav'),
          mode: 'rail',
          minWidth: 701,
          storageKey: TaskCore.SCOPE + 'task.panel.nav',
          labels: { open: 'メニューを開く', close: 'メニューをたたむ' }
        });
      }

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js', {
          updateViaCache: 'none'
        }).then(function (registration) {
          return registration.update();
        }).catch(function (error) {
          failed('画面の更新を確認できません', error);
        });

        navigator.serviceWorker.addEventListener(
          'controllerchange',
          function () {
            workerVersion().then(function (version) {
              cacheVersion = version;

              if ($('settings-dialog').open) {
                renderSettingsState();
              }
            });
          }
        );
      }

      (async function () {
        try {
          await client.start();
          render();

          if (
            client.configured() &&
            !client.legacyCount &&
            navigator.onLine
          ) {
            await refresh();
          }

          await wishes.start();
          render();
          await client.pump(false);

          if (page === 'history') {
            await loadHistory(false);
          } else if (page === 'wishes') {
            await loadWishes(false);
          }
        } catch (error) {
          failed('端末への保存を準備できません', error);
        }
      })();
    })();
  </script>
</body>
</html>
