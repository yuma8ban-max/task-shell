  <script>
    (function () {
      'use strict';

      const VERSION = 'v4.18.0';
      const REQUIRED_CORE_BUILD = 'v4.12.1';
      const UI_KIT_VERSION = '1.0.0';
      const EDIT_PROTOCOL = 'task-edit-fields-v1';
      const PLAN_PROTOCOL = window.TaskCore ? TaskCore.PLAN_PROTOCOL : '';
      const POOL_PREF_KEY = (window.TaskCore ? TaskCore.SCOPE : '') + 'task-plan-backlog-ui-v1';

      const FILTER_GROUPS = [
        {
          label: '全体',
          items: [
            ['all', 'すべて'],
            ['noboth', '期限・実行日なし']
          ]
        },
        {
          label: '期限',
          items: [
            ['hasdue', '期限あり（近い順）'],
            ['overdue', '期限切れ'],
            ['nodue', '期限なし']
          ]
        },
        {
          label: '実行日',
          items: [
            ['today', '今日'],
            ['week', '今週'],
            ['date', '日付を指定'],
            ['runoverdue', '昨日以前'],
            ['nodate', '実行日なし']
          ]
        }
      ];

      function $(id) {
        return document.getElementById(id);
      }

      if (
        !window.TaskCore ||
        TaskCore.VERSION !== 'v4.8' ||
        TaskCore.BUILD !== REQUIRED_CORE_BUILD ||
        !window.WishClient ||
        WishClient.VERSION !== 'v4.10'
      ) {
        $('status').textContent =
          '対応する共通処理を読み込めません。' +
          'task-core.js（v4.12.1）とwish-client.js（v4.10）を確認してください。' +
          '端末の記録は消さないでください。';
        return;
      }

      const clone = TaskCore.clone;
      const compareTasks = TaskCore.compareTasks;
      const taskById = TaskCore.taskById;
      const dayVersion = TaskCore.dayVersion;
      const poolPreferences = readPoolPreferences();

      let state = TaskCore.emptyState();
      let client = null;
      let wishes = null;
      let page = 'plan';

      let selectedDate = japanDate();
      let taskView = 'list';
      let taskFilter = 'all';
      let filterDate = selectedDate;
      let filterFocusDate = false;
      let calendarMonth = selectedDate.slice(0, 7);
      let calendarDate = selectedDate;
      let calendarUndated = false;
      let calDrag = null;
      let keySelectedId = '';

      let refreshPromise = null;
      let manualReloading = false;
      let checking = false;
      let autoBusy = false;
      let nextAutoRead = 0;
      let lastDateSeen = japanDate();
      let resumePromise = null;

      let historyData = {
        items: [],
        total: 0,
        loaded: false
      };

      let historyPromise = null;
      let historyLoading = false;
      let historyError = '';
      let historyFailedMore = false;
      let historyAgain = false;
      let historyRefreshTimer = null;

      let wishLoading = false;
      let wishError = '';
      let wishReadPromise = null;
      let achievedOpen = false;

      let editorHandler = null;
      let editorPosition = null;
      let editorComposing = false;
      let editorImeUntil = 0;
      let editorSaving = false;
      let periodicAdding = false;

      let messageTimer = null;
      let messageKind = '';
      let cacheVersion = '未確認';

      let backlogCollapsed = poolPreferences.collapsed;
      let backlogScroll = poolPreferences.scrollTop;
      let poolSaveTimer = null;
      let backlogDialogScroll = 0;
      let backlogDialogDate = selectedDate;
      let backlogAdding = false;
      let highlightId = '';
      let highlightTimer = null;

      const shownAttention = new Set();

      let suppressClickUntil = 0;
      let renderDeferred = false;
      let scrollFrame = null;
      let planList = null;
      let runList = null;

      function anyOrderDragging() {
        return !!(
          (planList && planList.isDragging()) ||
          (runList && runList.isDragging())
        );
      }

      function anyOrderDirty() {
        return !!(
          (planList && planList.isDirty()) ||
          (runList && runList.isDirty())
        );
      }

      // いま画面に出ている並べ替え（なければ null）
      function activeOrderList() {
        return page === 'plan' ? planList : page === 'running' ? runList : null;
      }

      // 並べ替えの下書きがあるとき、離れる前に「保存して移る／捨てて移る／続ける」を聞く。'stay' なら離れない
      async function confirmOrderLeave() {
        const list = activeOrderList();

        if (!list || !list.isDirty()) {
          return 'ok';
        }

        return list.confirmLeave({
          save: '保存して移る',
          discard: '捨てて移る',
          stay: '続ける'
        });
      }

      function readPoolPreferences() {
        try {
          const value = JSON.parse(localStorage.getItem(POOL_PREF_KEY) || 'null');

          return {
            collapsed: !!(value && value.collapsed === true),
            scrollTop: value && Number.isFinite(value.scrollTop)
              ? Math.max(0, value.scrollTop)
              : 0
          };
        } catch (error) {
          return {
            collapsed: false,
            scrollTop: 0
          };
        }
      }

      function savePoolPreferences(immediate) {
        if (poolSaveTimer) {
          clearTimeout(poolSaveTimer);
          poolSaveTimer = null;
        }

        function save() {
          poolSaveTimer = null;

          try {
            localStorage.setItem(POOL_PREF_KEY, JSON.stringify({
              collapsed: backlogCollapsed,
              scrollTop: Math.max(0, Math.round(backlogScroll))
            }));
          } catch (error) {
            // 表示設定を保存できなくても、タスクの操作は止めない。
          }
        }

        if (immediate) {
          save();
        } else {
          poolSaveTimer = setTimeout(save, 200);
        }
      }

      function rememberPoolScroll() {
        const list = $('backlog-list');

        if (
          !backlogCollapsed &&
          list &&
          !list.hidden &&
          list.getClientRects().length
        ) {
          backlogScroll = list.scrollTop;
        }
      }

      function restorePoolScroll() {
        const list = $('backlog-list');

        if (
          !backlogCollapsed &&
          list &&
          !list.hidden &&
          list.getClientRects().length
        ) {
          list.scrollTop = backlogScroll;
        }
      }

      function toggleBacklog() {
        if (
          anyOrderDragging() ||
          anyDialogOpen() ||
          Date.now() < suppressClickUntil
        ) {
          return;
        }

        rememberPoolScroll();
        backlogCollapsed = !backlogCollapsed;
        savePoolPreferences(true);
        render();

        const control = $('backlog-toggle');

        if (control) {
          control.focus({
            preventScroll: true
          });
        }
      }

      function make(tag, text, className) {
        const element = document.createElement(tag);

        if (text !== undefined && text !== null) {
          element.textContent = text;
        }

        if (className) {
          element.className = className;
        }

        return element;
      }

      function icon(name) {
        const namespace = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(namespace, 'svg');
        const use = document.createElementNS(namespace, 'use');

        svg.setAttribute('class', 'ui-icon');
        svg.setAttribute('viewBox', '0 0 24 24');
        svg.setAttribute('aria-hidden', 'true');
        svg.setAttribute('focusable', 'false');
        use.setAttribute('href', '#icon-' + name);
        svg.appendChild(use);

        return svg;
      }

      function button(text, handler, className) {
        const control = make(
          'button',
          text,
          'btn' + (className ? ' ' + className : '')
        );

        control.type = 'button';
        control.addEventListener('click', handler);
        return control;
      }

      function notify(text, error, detail, kind) {
        if (
          text &&
          !error &&
          messageKind === 'read' &&
          !$('message').hidden &&
          client &&
          client.lastReadError
        ) {
          return;
        }

        if (messageTimer) {
          clearTimeout(messageTimer);
          messageTimer = null;
        }

        messageKind = kind || '';
        $('message-text').textContent = text || '';
        $('message').className = 'notice' + (error ? ' error' : '');
        $('message').hidden = !text;
        $('message-detail-body').textContent = detail || '';
        $('message-details').hidden = !detail;
        $('message-details').open = false;

        if (text && !error) {
          messageTimer = setTimeout(function () {
            $('message').hidden = true;
            messageKind = '';
          }, 3500);
        }
      }

      function japanDate() {
        return new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10);
      }

      function dateShift(value, days) {
        const date = new Date(value + 'T12:00:00Z');
        date.setUTCDate(date.getUTCDate() + days);
        return date.toISOString().slice(0, 10);
      }

      function monthShift(value, months) {
        const date = new Date(value + '-01T12:00:00Z');
        date.setUTCMonth(date.getUTCMonth() + months);
        return date.toISOString().slice(0, 7);
      }

      function dateLabel(value) {
        return Number(value.slice(0, 4)) + '年' +
          Number(value.slice(5, 7)) + '月' +
          Number(value.slice(8, 10)) + '日';
      }

      function shortDate(value) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) {
          return value;
        }

        const year = value.slice(0, 4);
        const date = Number(value.slice(5, 7)) + '/' +
          Number(value.slice(8, 10));

        return year === japanDate().slice(0, 4)
          ? date
          : Number(year) + '/' + date;
      }

      function timeLabel(value) {
        const time = Date.parse(value || '');

        return Number.isFinite(time)
          ? new Date(time + 9 * 3600000)
            .toISOString()
            .slice(0, 19)
            .replace('T', ' ')
          : '未取得';
      }

      function hourLabel(hour) {
        return hour == null ? '時間未定' : hour + '時';
      }

      function dueRuleLabel(value) {
        const rule = value || {
          type: 'none'
        };

        switch (rule.type) {
          case 'offset':
            return rule.days === 0
              ? '基準日当日'
              : '基準日から' + rule.days + '日後';
          case 'weekly':
            return '毎週' + '日月火水木金土'.charAt(rule.weekday) + '曜日';
          case 'monthly':
            return '毎月' + rule.day + '日';
          case 'monthEnd':
            return '毎月末';
          default:
            return '期限なし';
        }
      }

      function features() {
        return state.snapshot && state.snapshot.features || {};
      }

      function periodicSupported() {
        return features().periodicDue === true;
      }

      function editingSupported() {
        return client.latestSupported() &&
          features().taskEditFields === true &&
          features().taskEditProtocol === EDIT_PROTOCOL;
      }

      function planningSupported() {
        return client.latestSupported() &&
          features().planMove === true &&
          features().planMoveProtocol === PLAN_PROTOCOL;
      }

      function onlineRequired() {
        if (!navigator.onLine) {
          notify('通信が必要です', true);
          return false;
        }

        return true;
      }

      function anyDialogOpen() {
        return $('editor').open ||
          $('settings-dialog').open ||
          $('keys-dialog').open ||
          $('task-filter-dialog').open ||
          $('backlog-dialog').open;
      }

      function failed(text, error) {
        notify(text, true, String(error.message || error));
      }

      function wishJobs() {
        return wishes ? wishes.state.jobs : [];
      }

      function allPendingCount() {
        return state.jobs.length + wishJobs().length;
      }

      function retryingRead(action) {
        return client.readStatus.phase === 'retrying' &&
          (!action || client.readStatus.action === action);
      }

      function updateReadLabels() {
        const historyLabel = $('history-loading-label');

        if (historyLabel) {
          historyLabel.textContent = retryingRead('history')
            ? '一覧を取り直しています…'
            : '更新中…';
        }

        const periodicButton = $('periodic-today');

        if (periodicButton && periodicAdding) {
          periodicButton.textContent = retryingRead('preview')
            ? '再確認中'
            : '追加内容を確認中';
        }

        if (checking) {
          $('check').textContent = retryingRead('check')
            ? '再確認中'
            : '動作確認中';
        }
      }

      client = TaskCore.create({
        onChange: function (meta) {
          state = client.state;

          if (
            meta.kind === 'status' ||
            meta.kind === 'read-state' ||
            meta.kind === 'diagnostic'
          ) {
            renderStatus();
            updateReadLabels();

            if (
              meta.kind === 'read-state' &&
              client.readStatus.phase === 'success' &&
              messageKind === 'read'
            ) {
              notify('');
            }
          } else {
            render();
          }

          if (
            meta.kind === 'committed' &&
            ['done', 'undo', 'edit'].indexOf(meta.action) >= 0
          ) {
            scheduleHistoryRefresh();
          }
        },
        onIssue: function (text, detail) {
          notify(text, true, detail);
        },
        onSaved: function (job, result) {
          if (client.lastReadError) {
            return;
          }

          const outcome = result.result && result.result.latestOutcome;

          if (outcome === 'superseded') {
            notify('より新しい操作を反映しました');
          } else if (outcome === 'baseline') {
            notify('旧記録を保存先の内容に合わせました');
          } else if (outcome === 'completed') {
            notify('完了済みのため配置は変更しませんでした');
          } else if (outcome === 'expired') {
            notify('日付が変わった追加要求は実行していません');
          } else if (outcome === 'merged') {
            notify('他の新しい変更と合わせて反映しました');
          } else if (
            result.result &&
            result.result.editLocation === 'completed'
          ) {
            notify('完了済みの内容を更新しました');
          } else if (job.payload.action === 'planMove') {
            notify(
              job.payload.date
                ? shortDate(job.payload.date) + 'の計画に反映しました'
                : '実行日なしへ戻しました'
            );
          } else {
            notify('保存しました');
          }
        }
      });

      initOrderLists();

      wishes = WishClient.create({
        transport: client,
        onChange: function () {
          if (page === 'wishes') {
            render();
          } else {
            renderOutbox();
            renderStatus();
          }
        },
        onIssue: function (text, detail) {
          notify(text, true, detail);
        }
      });

      function renderStatus() {
        const parts = [];

        if (!client.ready) {
          parts.push('準備中');
        } else if (client.legacyCount) {
          parts.push('旧画面の未送信があります');
        } else {
          if (!navigator.onLine) {
            parts.push('通信なし');
          }

          if (!client.configured()) {
            parts.push('接続先未設定');
          }

          if (retryingRead('load')) {
            parts.push('一覧を取り直しています');
          }

          if (
            page !== 'wishes' &&
            state.snapshot &&
            (
              client.lastReadError ||
              !navigator.onLine ||
              !client.received
            )
          ) {
            parts.push('前回の一覧を表示');
          }

          if (state.jobs.some(function (job) {
            return job.state === 'sending' && job.shortRetry;
          })) {
            parts.push('保存結果を再確認中・端末に保存済み');
          }
        }

        $('status').textContent = parts.join('／');
        $('status').hidden = !parts.length;

        $('add-label').textContent = page === 'wishes'
          ? 'したいことを追加'
          : 'タスクを追加';

        $('add').disabled =
          !client.ready ||
          !!client.legacyCount ||
          (page === 'wishes' && (!wishes || !wishes.ready)) ||
          anyOrderDragging();

        const loading = page === 'history'
          ? historyLoading
          : page === 'wishes'
            ? wishLoading
            : !!refreshPromise;

        const busy = manualReloading || loading;

        $('reload').disabled =
          !client.ready ||
          !!client.legacyCount ||
          busy ||
          anyOrderDragging();

        $('reload').setAttribute('aria-busy', String(!!busy));

        document.querySelectorAll('[data-act="done"]').forEach(function (control) {
          control.disabled = control.dataset.locked === '1' || !!busy;
        });
        $('reload-label').textContent = busy ? '更新中' : '更新';
        $('reload-icon').hidden = !!busy;
        $('reload-spinner').hidden = !busy;
        $('settings').disabled = anyOrderDragging();

        if ($('settings-dialog').open) {
          renderSettingsState();
        }
      }

      function jobStateLabel(job) {
        if (job.state === 'conflict') {
          return '自動反映の準備待ち';
        }

        if (
          job.state === 'blocked' ||
          ['settings', 'authentication'].indexOf(job.errorStatus) >= 0
        ) {
          return '確認が必要';
        }

        if (job.state === 'sending') {
          return job.shortRetry
            ? '再確認中'
            : job.serverReceipt
              ? '処理後の一覧を確認中'
              : '保存結果を確認中';
        }

        return job.state === 'unknown' ? '再確認待ち' : '送信待ち';
      }

      async function retrySending(source) {
        if (!onlineRequired()) {
          return;
        }

        try {
          await client.read({
            action: 'load'
          }, {
            forceFull: true
          });

          if (source === 'wishes') {
            await wishes.reloadLocal();
            await wishes.pump(true);
          } else {
            await client.pump(true);
          }
        } catch (error) {
          failed('送信を再開できませんでした', error);
        }
      }

      function renderOutbox() {
        const container = $('outbox-items');

        const openDetails = new Set(
          Array.from(container.querySelectorAll('details[data-job]'))
            .filter(function (element) {
              return element.open;
            })
            .map(function (element) {
              return element.dataset.job;
            })
        );

        container.replaceChildren();

        const entries = state.jobs.map(function (job) {
          return {
            source: 'tasks',
            job: job
          };
        }).concat(wishJobs().map(function (job) {
          return {
            source: 'wishes',
            job: job
          };
        }));

        const attention = entries.filter(function (entry) {
          return entry.job.state === 'blocked' ||
            entry.job.state === 'unknown' ||
            ['settings', 'authentication'].indexOf(entry.job.errorStatus) >= 0;
        });

        const active = new Set(entries.map(function (entry) {
          return entry.source + ':' + entry.job.id;
        }));

        Array.from(shownAttention).forEach(function (key) {
          if (!active.has(key.split('|')[0])) {
            shownAttention.delete(key);
          }
        });

        let newAttention = false;

        attention.forEach(function (entry) {
          const key = entry.source + ':' + entry.job.id +
            '|' + entry.job.state +
            '|' + (entry.job.errorStatus || '');

          if (!shownAttention.has(key)) {
            shownAttention.add(key);
            newAttention = true;
          }
        });

        $('outbox').hidden = !entries.length;
        $('outbox').classList.toggle('has-attention', attention.length > 0);
        $('outbox-summary').textContent =
          '送信待ち ' + entries.length + '件' +
          (attention.length ? '・確認が必要 ' + attention.length + '件' : '');

        entries.forEach(function (entry) {
          const job = entry.job;
          const row = make('div', null, 'job');
          const heading = make('div', null, 'job-heading');
          const needsCheck = attention.indexOf(entry) >= 0;

          heading.append(
            make('div', job.label || '未送信の操作', 'job-title'),
            make(
              'span',
              jobStateLabel(job),
              'badge job-state' + (needsCheck ? ' needs-check' : '')
            )
          );

          row.appendChild(heading);

          if (
            ['settings', 'authentication'].indexOf(job.errorStatus) >= 0
          ) {
            row.appendChild(button('設定を確認', openSettings));
          } else if (
            job.state !== 'blocked' &&
            job.state !== 'sending'
          ) {
            const send = button('今すぐ送信', function () {
              retrySending(entry.source);
            });

            send.disabled = !navigator.onLine;
            row.appendChild(send);
          }

          if (job.note && job.state !== 'conflict') {
            const details = make('details');
            const key = entry.source + ':' + job.id;
            details.dataset.job = key;
            details.open = openDetails.has(key);

            details.append(
              make('summary', '詳細'),
              make('div', job.note, 'detail-text')
            );

            row.appendChild(details);
          }

          container.appendChild(row);
        });

        if (newAttention) {
          $('outbox').open = true;
        }
      }

      function capturePosition() {
        return page === 'plan'
          ? { date: selectedDate, x: window.scrollX, y: window.scrollY }
          : null;
      }

      function restorePosition(position) {
        if (!position || page !== 'plan' || selectedDate !== position.date) {
          return;
        }

        window.scrollTo(position.x, position.y);
      }

      function render() {
        const position = capturePosition();
        const oldAchieved = $('wish-achieved');

        if (oldAchieved) {
          achievedOpen = oldAchieved.open;
        }

        rememberPoolScroll();
        renderStatus();
        renderOutbox();

        if (
          anyOrderDragging() ||
          calDrag ||
          $('task-filter-dialog').open ||
          $('backlog-dialog').open
        ) {
          renderDeferred = true;
          return;
        }

        renderDeferred = false;
        $('main').classList.toggle('plan-wide', page === 'plan');

        document.querySelectorAll('nav [data-page]').forEach(function (element) {
          const active = element.dataset.page === page;
          element.classList.toggle('active', active);

          if (active) {
            element.setAttribute('aria-current', 'page');
          } else {
            element.removeAttribute('aria-current');
          }
        });

        const content = $('content');
        content.replaceChildren();

        if (page === 'history') {
          renderHistory(content);
          return;
        }

        if (page === 'wishes') {
          renderWishes(content);
          return;
        }

        const pendingAdds = state.jobs.some(function (job) {
          return job.payload.action === 'add';
        });

        if (
          !state.snapshot &&
          (!pendingAdds || page === 'periodic')
        ) {
          content.appendChild(make(
            'p',
            client.configured()
              ? refreshPromise ? '更新中…' : '一覧未取得'
              : '接続先を設定してください'
          ));
          return;
        }

        if (!state.snapshot) {
          content.appendChild(make('p', 'この端末の送信待ち', 'status'));
        }

        if (page === 'plan') {
          renderPlan(content);
        } else if (page === 'running') {
          renderRunning(content);
        } else if (page === 'tasks') {
          renderTasks(content);
        } else {
          renderPeriodic(content);
        }

        restorePosition(position);
        updatePoolHeight();
        restorePoolScroll();
        applyKeySelection();
      }

      function completeButton(task, finalProgress) {
        const locked = runLocked(task.taskId);

        const control = button('', function () {
          if (
            task.localOnly ||
            task.blocked ||
            locked ||
            anyOrderDirty() ||
            anyOrderDragging() ||
            Date.now() < suppressClickUntil ||
            !confirm('「' + task.title + '」を完了にしますか。')
          ) {
            return;
          }

          const original = taskById(state.snapshot, task.taskId);

          if (!original) {
            notify('一覧が更新されています。更新してから操作してください');
            return;
          }

          const payload = {
            action: 'done',
            taskId: task.taskId,
            expectedTask: original.version
          };

          // 実行中の画面で書いた最後の進捗を、完了といっしょに残す
          if (finalProgress) {
            const progress = finalProgress();
            const problem = TaskCore.progressProblem(progress);

            if (problem) {
              notify(problem, true);
              return;
            }

            payload.progress = progress;
          }

          client.enqueue(payload, '完了：' + task.title).catch(function (error) {
            failed('保存できませんでした', error);
          });
        }, 'hit');

        control.dataset.act = 'done';

        // 押せない理由（更新中以外）を覚えておき、更新が終わったら元に戻す
        control.dataset.locked = (
          !client.ready ||
          !!client.legacyCount ||
          !!task.localOnly ||
          !!task.blocked ||
          locked ||
          anyOrderDirty()
        ) ? '1' : '0';

        control.disabled = control.dataset.locked === '1' || !!refreshPromise;

        control.setAttribute(
          'aria-label',
          task.title + (locked ? 'を完了（' + RUN_LOCK_LABEL + '）' : 'を完了')
        );
        control.appendChild(make('span', null, 'circle'));
        return control;
      }

      /* ---------- 実行中 ---------- */

      const RUN_LOCK_LABEL = '1位の完了後';
      const progressDrafts = {};
      let progressFocus = null;

      function runningSupported() {
        return !!(state.snapshot && TaskCore.runningItems(state.snapshot));
      }

      function runInfo(taskId) {
        return TaskCore.runningInfo(state.snapshot, taskId);
      }

      // 実行中の2位以下か（進捗の記入と完了ができない）
      function runLocked(taskId) {
        const info = runInfo(taskId);
        return !!info && info.rank > 1;
      }

      function runPending() {
        return state.jobs.some(function (job) {
          return job.payload.action.indexOf('run') === 0;
        });
      }

      function runSend(payload, label) {
        client.enqueue(payload, label).catch(function (error) {
          failed('保存できませんでした', error);
        });
      }

      function runToggleButton(task) {
        const info = runInfo(task.taskId);
        const on = !!info;

        const control = button(on ? '実行中を解除' : '実行中にする', function () {
          if (anyOrderDragging() || Date.now() < suppressClickUntil) {
            return;
          }

          runSend({
            action: on ? 'runStop' : 'runStart',
            taskId: task.taskId
          }, (on ? '実行中の解除：' : '実行中：') + task.title);
        }, 'run-toggle' + (on ? ' is-running' : ''));

        control.dataset.act = 'run';
        control.disabled =
          !client.ready ||
          !!client.legacyCount ||
          !navigator.onLine ||
          !runningSupported() ||
          !dayOrderSupported() ||
          !!task.localOnly ||
          !!task.blocked ||
          runPending() ||
          anyOrderDirty();

        return control;
      }

      /* ---------- 並べ替え（実行中・今日の順番で共有） ---------- */

      function dayOrderSupported() {
        return client.latestSupported() &&
          features().dayOrder === TaskCore.DAY_ORDER_PROTOCOL;
      }

      function orderEditable() {
        return client.ready &&
          !client.legacyCount &&
          navigator.onLine &&
          dayOrderSupported() &&
          !runPending();
      }

      // 日の順番を保存先へ送る（ids はその日の一部でもよい）
      async function saveDayOrder(date, ids) {
        const snapshot = clone(state.snapshot);

        const payload = {
          action: 'order',
          date: date,
          expectedDay: dayVersion(snapshot, date),
          ids: ids
        };

        const context = client.context({
          action: 'order',
          date: date
        }, snapshot);

        try {
          await client.enqueue(payload, date + ' の順番', context);
          client.pump(true);
        } catch (error) {
          failed('順番を端末に保存できませんでした', error);
          throw error;
        }
      }

      function savePlanOrder(ids) {
        return saveDayOrder(selectedDate, ids.filter(function (id) {
          return id.indexOf('local:') !== 0;
        }));
      }

      // 実行中タブは、実行日ごとに分けて送る（同じ実行日のタスクの間だけ動かせる）
      async function saveRunOrder(ids) {
        const byId = new Map(client.effectiveTasks().map(function (task) {
          return [task.taskId, task];
        }));

        const groups = new Map();

        ids.forEach(function (id) {
          const task = byId.get(id);

          if (task && task.date) {
            groups.set(task.date, (groups.get(task.date) || []).concat([id]));
          }
        });

        for (const entry of groups) {
          if (entry[1].length > 1) {
            await saveDayOrder(entry[0], entry[1]);
          }
        }
      }

      function initOrderLists() {
        planList = OrderList.create({
          renderRow: planRowContent,
          onSave: savePlanOrder,
          canEdit: function () {
            return orderEditable() && planningSupported();
          },
          empty: 'タスクなし',
          onDragEnd: afterOrderDrag
        });

        runList = OrderList.create({
          renderRow: runRowContent,
          onSave: saveRunOrder,
          canEdit: orderEditable,
          empty: '実行中なし',
          onDragEnd: afterOrderDrag
        });
      }

      function afterOrderDrag() {
        if (renderDeferred) {
          render();
        }
      }

      function runRowContent(item) {
        const task = item.task;
        const dirty = runList.isDirty();
        const online = client.ready && !client.legacyCount && navigator.onLine;
        const card = make('div', null, 'run-row');
        const main = make('div', null, 'card-main');

        card.dataset.id = task.taskId;
        card.dataset.local = task.localOnly ? 'true' : 'false';
        main.appendChild(make('div', task.title, 'card-title'));
        appendTaskDates(main, task, false);

        let area = null;

        if (item.top) {
          area = make('textarea', null, 'form-control run-progress');
          area.rows = 3;
          area.placeholder = '進捗を書く';
          area.setAttribute('aria-label', task.title + 'の進捗');

          area.value = Object.prototype.hasOwnProperty.call(progressDrafts, task.taskId)
            ? progressDrafts[task.taskId]
            : item.progress;

          const remember = function () {
            progressDrafts[task.taskId] = area.value;

            progressFocus = {
              id: task.taskId,
              start: area.selectionStart,
              end: area.selectionEnd
            };
          };

          area.addEventListener('input', remember);
          area.addEventListener('keyup', remember);
          area.addEventListener('focus', remember);

          area.addEventListener('blur', function () {
            if (area.isConnected && progressFocus && progressFocus.id === task.taskId) {
              progressFocus = null;
            }
          });

          main.appendChild(area);

          if (progressFocus && progressFocus.id === task.taskId) {
            const focus = progressFocus;

            requestAnimationFrame(function () {
              if (area.isConnected) {
                area.focus();
                area.setSelectionRange(focus.start, focus.end);
              }
            });
          }
        } else if (item.progress) {
          main.appendChild(make('div', item.progress, 'run-progress-text'));
        }

        const actions = make('div', null, 'run-actions');

        if (item.top) {
          const save = button(dirty ? '保存後' : '進捗を保存', function () {
            const problem = TaskCore.progressProblem(area.value);

            if (problem) {
              notify(problem, true);
              return;
            }

            const text = area.value;
            delete progressDrafts[task.taskId];

            runSend({
              action: 'runProgress',
              taskId: task.taskId,
              progress: text
            }, '進捗：' + task.title);
          }, 'btn-primary');

          save.disabled = !online || runPending() || dirty;
          actions.appendChild(save);
        } else {
          const wait = button(RUN_LOCK_LABEL, function () {}, 'run-wait');
          wait.disabled = true;
          actions.appendChild(wait);
        }

        actions.appendChild(runToggleButton(task));
        main.appendChild(actions);

        card.append(
          item.top
            ? completeButton(task, function () {
              return area.value;
            })
            : make('span'),
          main
        );

        return card;
      }

      function renderRunning(content) {
        content.appendChild(make('h2', '実行中'));

        if (!runningSupported() || !dayOrderSupported()) {
          content.appendChild(make('p', '保存先の更新が必要です。', 'form-error'));
          return;
        }

        if (runPending()) {
          content.appendChild(make('p', '実行中の変更を反映しています…', 'status'));
        }

        const byId = new Map(client.effectiveTasks().map(function (task) {
          return [task.taskId, task];
        }));

        const items = TaskCore.runningItems(state.snapshot).filter(function (item) {
          return byId.has(item.taskId);
        }).map(function (item) {
          const task = byId.get(item.taskId);

          return {
            id: item.taskId,
            group: task.date || '',
            fixed: !task.date,
            task: task,
            top: item.rank === 1,
            progress: item.progress
          };
        });

        const host = make('div', null, 'run-board');
        content.appendChild(host);
        runList.mount(host);
        runList.setItems(items);
      }

      function editButton(task, className) {
        const control = button('編集', function () {
          if (
            task.localOnly ||
            task.blocked ||
            anyOrderDragging() ||
            Date.now() < suppressClickUntil
          ) {
            return;
          }

          if ($('backlog-dialog').open) {
            $('backlog-dialog').close();

            setTimeout(function () {
              openTaskEditor(task.taskId);
            }, 0);
          } else {
            openTaskEditor(task.taskId);
          }
        }, className || '');

        control.dataset.act = 'edit';
        control.disabled =
          !client.ready ||
          !!client.legacyCount ||
          !navigator.onLine ||
          !!task.localOnly ||
          !!task.blocked;

        control.setAttribute('aria-label', task.title + 'を編集');
        return control;
      }

      /* ---------- 日付表示 ---------- */

      function dateMark(kind, value, hour) {
        const valid = /^\d{4}-\d{2}-\d{2}$/.test(value);
        const overdue = valid && value < japanDate();
        const due = kind === 'due';

        const item = make(
          'div',
          null,
          'task-date-item date-' + kind +
            (overdue ? ' is-overdue' : '')
        );

        const term = make('dt', due ? '期限' : '実行', 'date-label');
        const detail = make('dd', null, 'date-value');
        const date = make('time', shortDate(value));

        if (valid) {
          date.dateTime = value;
          date.setAttribute('aria-label', dateLabel(value));
          date.title = dateLabel(value);
        }

        detail.appendChild(date);

        if (!due && hour != null) {
          detail.appendChild(make('span', hourLabel(hour), 'date-hour'));
        }

        if (overdue) {
          detail.appendChild(make(
            'span',
            due ? '期限切れ' : '実行日超過',
            'date-state'
          ));
        }

        item.append(term, detail);
        return item;
      }

      function appendTaskDates(target, task, planOnly) {
        const dates = make('dl', null, 'task-dates');

        if (task.due) {
          dates.appendChild(dateMark('due', task.due, null));
        }

        if (!planOnly && task.date) {
          dates.appendChild(dateMark('run', task.date, task.hour));
        }

        if (dates.children.length) {
          target.appendChild(dates);
        }

        if (!planOnly && !task.date && task.hour != null) {
          target.appendChild(make(
            'div',
            '時間帯：' + hourLabel(task.hour),
            'task-time-only'
          ));
        }
      }

      /* ---------- 計画と候補 ---------- */

      function undatedTasks() {
        return client.effectiveTasks().filter(function (task) {
          return !task.date;
        }).sort(function (a, b) {
          if (a.due && !b.due) {
            return -1;
          }

          if (!a.due && b.due) {
            return 1;
          }

          return (a.due || '').localeCompare(b.due || '') ||
            a.row - b.row;
        });
      }

      // 今日の順番の1行の中身（並べ替えの部品が、持ち手・番号・上へ／下へを付ける）
      function planRowContent(item) {
        const task = item.task;

        const row = make(
          'div',
          null,
          'plan-row' +
            (task.localOnly ? ' pending-add' : '') +
            (task.taskId === highlightId ? ' fresh-placement' : '')
        );

        row.dataset.id = task.taskId;
        row.dataset.local = task.localOnly ? 'true' : 'false';

        const text = make('div', null, 'ttl');
        text.appendChild(make('div', task.title));
        appendTaskDates(text, task, true);

        if (task.localOnly || task.pendingPlanning) {
          text.appendChild(make(
            'div',
            task.pendingText || '送信待ち',
            'pending-label'
          ));
        }

        const back = button('実行日なしへ戻す', function () {
          returnToPool(task);
        }, 'plan-back');

        back.disabled =
          !planningSupported() ||
          !!task.localOnly ||
          !!task.blocked ||
          anyOrderDirty() ||
          !client.ready ||
          !!client.legacyCount ||
          !navigator.onLine;

        row.append(
          completeButton(task),
          text,
          runToggleButton(task),
          editButton(task, 'plan-edit'),
          back
        );

        return row;
      }

      async function returnToPool(task) {
        if (!planningSupported() || !state.snapshot) {
          return;
        }

        const snapshot = clone(state.snapshot);

        try {
          const payload = planMovePayload(task, snapshot, '', []);
          const context = client.context(payload, snapshot);
          await client.enqueue(payload, '実行日なしへ戻す：' + task.title, context);
        } catch (error) {
          failed('移動を端末に保存できませんでした', error);
        }
      }

      function renderBacklog(container, dialogMode) {
        container.replaceChildren();
        const tasks = undatedTasks();

        if (!tasks.length) {
          container.appendChild(make(
            'p',
            '実行日なしのタスクはありません',
            'empty-backlog'
          ));
          return;
        }

        const cards = make('div', null, 'cards');

        tasks.forEach(function (task) {
          const card = make(
            'div',
            null,
            'card backlog-task' + (task.localOnly ? ' pending-add' : '')
          );

          card.dataset.id = task.taskId;
          card.dataset.local = task.localOnly ? 'true' : 'false';

          const head = make('div', null, 'backlog-card-head');
          const main = make('div', null, 'card-main backlog-main');

          main.appendChild(make('div', task.title, 'card-title'));
          appendTaskDates(main, task, false);

          if (task.localOnly || task.pendingPlanning) {
            main.appendChild(make(
              'div',
              task.pendingText || '送信待ち',
              'pending-label'
            ));
          }

          head.appendChild(main);

          const actions = make('div', null, 'backlog-actions');
          const destinationDate = dialogMode
            ? backlogDialogDate
            : selectedDate;

          const assign = button('追加', function () {
            addFromBacklog(task.taskId, destinationDate);
          }, 'backlog-assign');

          assign.dataset.act = 'assign';
          assign.setAttribute(
            'aria-label',
            task.title + 'を' + dateLabel(destinationDate) + 'の順番に追加'
          );

          assign.disabled =
            !planningSupported() ||
            anyOrderDirty() ||
            task.localOnly ||
            task.blocked ||
            backlogAdding;

          actions.append(
            completeButton(task),
            runToggleButton(task),
            editButton(task),
            assign
          );

          card.append(head, actions);
          cards.appendChild(card);
        });

        container.appendChild(cards);
      }

      // 日付を替える前に、並べ替えの下書きがあれば聞く
      async function changeDate(next) {
        if (anyOrderDragging() || !next || next === selectedDate) {
          render();
          return;
        }

        if ((await confirmOrderLeave()) === 'stay') {
          render();
          return;
        }

        selectedDate = next;
        render();
      }

      function renderPlan(content) {
        const board = make(
          'div',
          null,
          'plan-board' + (backlogCollapsed ? ' is-backlog-collapsed' : '')
        );

        const main = make('section', null, 'plan-main');
        main.id = 'plan-main';

        const heading = make('div', null, 'plan-heading');
        heading.appendChild(make('h2', '今日の順番'));

        const poolCount = undatedTasks().length;
        const poolButton = button('', openBacklog, 'pool-open');

        poolButton.append(
          icon('inbox'),
          make('span', '実行日なし ' + poolCount + '件')
        );

        heading.appendChild(poolButton);
        main.appendChild(heading);

        const tools = make('div', null, 'toolbar plan-tools');
        const date = make('input', null, 'form-control plan-date');
        date.type = 'date';
        date.value = selectedDate;
        date.setAttribute('aria-label', '順番の日付');

        date.addEventListener('change', function () {
          changeDate(date.value);
        });

        tools.append(
          button('前日', function () {
            changeDate(dateShift(selectedDate, -1));
          }),
          date,
          button('今日', function () {
            changeDate(japanDate());
          }),
          button('翌日', function () {
            changeDate(dateShift(selectedDate, 1));
          })
        );

        main.appendChild(tools);

        if (state.snapshot && (!planningSupported() || !dayOrderSupported())) {
          main.appendChild(make('p', '保存先の更新が必要です。', 'form-error'));
        }

        const tasks = client.effectiveTasks().filter(function (task) {
          return task.date === selectedDate;
        }).sort(compareTasks);

        const host = make('div', null, 'plan-list');
        main.appendChild(host);
        planList.mount(host);

        planList.setItems(tasks.map(function (task) {
          return {
            id: task.taskId,
            group: task.localOnly ? 'local' : '',
            fixed: !!task.localOnly,
            time: task.hour == null ? '' : hourLabel(task.hour),
            task: task
          };
        }));

        const pool = make(
          'aside',
          null,
          'plan-backlog' + (backlogCollapsed ? ' is-collapsed' : '')
        );

        pool.id = 'plan-backlog';

        const toggle = button(
          '',
          toggleBacklog,
          backlogCollapsed ? 'backlog-reopen' : 'backlog-toggle'
        );

        toggle.id = 'backlog-toggle';
        toggle.setAttribute('aria-controls', 'backlog-list');
        toggle.setAttribute('aria-expanded', String(!backlogCollapsed));

        const list = make('div', null, 'backlog-list');
        list.id = 'backlog-list';
        list.hidden = backlogCollapsed;

        if (backlogCollapsed) {
          toggle.setAttribute(
            'aria-label',
            '実行日なし ' + poolCount + '件を展開'
          );

          toggle.append(
            icon('inbox'),
            make('span', String(poolCount), 'backlog-count')
          );

          pool.append(toggle, list);
        } else {
          toggle.setAttribute('aria-label', '実行日なしを折りたたむ');
          toggle.appendChild(icon('chevron-right'));

          const poolHeading = make('div', null, 'backlog-heading');

          poolHeading.append(
            make('h3', '実行日なし'),
            make('span', String(poolCount), 'backlog-count'),
            toggle
          );

          renderBacklog(list, false);

          list.addEventListener('scroll', function () {
            if (
              document.contains(list) &&
              !backlogCollapsed &&
              !list.hidden &&
              list.getClientRects().length
            ) {
              backlogScroll = list.scrollTop;
              savePoolPreferences(false);
            }
          }, {
            passive: true
          });

          pool.append(poolHeading, list);
        }

        board.append(main, pool);
        content.appendChild(board);
        updatePoolHeight();
        restorePoolScroll();
      }

      function updatePoolHeight() {
        const pool = $('plan-backlog');

        if (!pool || !pool.getClientRects().length) {
          return;
        }

        if (backlogCollapsed) {
          pool.style.removeProperty('max-height');
          return;
        }

        const top = pool.getBoundingClientRect().top;
        const height = Math.max(
          180,
          window.innerHeight - Math.max(12, top) - 12
        );

        const value = height + 'px';

        if (pool.style.maxHeight !== value) {
          pool.style.maxHeight = value;
        }
      }

      function openBacklog() {
        if (anyOrderDragging() || anyDialogOpen()) {
          return;
        }

        backlogDialogDate = selectedDate;
        $('backlog-target-date').textContent = dateLabel(backlogDialogDate);

        renderBacklog($('backlog-dialog-list'), true);
        document.body.classList.add('sheet-open');
        $('backlog-dialog').showModal();
        $('backlog-dialog-list').scrollTop = backlogDialogScroll;
      }

      $('backlog-close').addEventListener('click', function () {
        $('backlog-dialog').close();
      });

      $('backlog-dialog').addEventListener('close', function () {
        backlogDialogScroll = $('backlog-dialog-list').scrollTop;
        document.body.classList.remove('sheet-open');
        render();
      });

      function planMovePayload(task, snapshot, date, ids) {
        const original = taskById(snapshot, task.taskId);

        if (!original) {
          throw new Error(
            '対象のタスクを確認できません。更新してから操作してください。'
          );
        }

        return {
          action: 'planMove',
          planProtocol: PLAN_PROTOCOL,
          taskId: task.taskId,
          expectedTask: original.version,
          expectedPlacement: {
            date: task.date || ''
          },
          fromDate: task.date || '',
          date: date,
          expectedFromDay: task.date ? dayVersion(snapshot, task.date) : '',
          expectedDay: date ? dayVersion(snapshot, date) : '',
          ids: ids
        };
      }

      function highlightTask(id, scroll) {
        highlightId = id;

        if (highlightTimer) {
          clearTimeout(highlightTimer);
        }

        render();

        requestAnimationFrame(function () {
          const row = Array.from(
            document.querySelectorAll('.ol-row[data-id]')
          ).find(function (element) {
            return element.dataset.id === id;
          });

          if (row && scroll) {
            row.scrollIntoView({
              block: 'nearest'
            });
          }

          updatePoolHeight();
        });

        highlightTimer = setTimeout(function () {
          highlightId = '';

          document.querySelectorAll('.fresh-placement')
            .forEach(function (row) {
              row.classList.remove('fresh-placement');
            });
        }, 1600);
      }

      async function addFromBacklog(id, date) {
        if (backlogAdding || !planningSupported()) {
          return;
        }

        const tasks = client.effectiveTasks();
        const task = tasks.find(function (entry) {
          return entry.taskId === id;
        });

        if (!task || task.localOnly || task.blocked || task.date) {
          notify('一覧が更新されています。表示を更新してください');
          return;
        }

        const target = tasks.filter(function (entry) {
          return entry.date === date && !entry.localOnly;
        }).sort(compareTasks).map(function (entry) {
          return entry.taskId;
        });

        target.push(task.taskId);

        const snapshot = clone(state.snapshot);
        const payload = planMovePayload(task, snapshot, date, target);

        const captured = client.context(payload, snapshot);
        backlogAdding = true;

        $('backlog-dialog-list').querySelectorAll('button')
          .forEach(function (control) {
            control.disabled = true;
          });

        try {
          await client.enqueue(
            payload,
            '今日の順番へ：' + task.title + ' ／ ' + date,
            captured
          );

          if ($('backlog-dialog').open) {
            $('backlog-dialog').close();
          }

          selectedDate = date;
          highlightTask(id, true);
        } catch (error) {
          failed('移動を端末に保存できませんでした', error);
        } finally {
          backlogAdding = false;

          if ($('backlog-dialog').open) {
            renderBacklog($('backlog-dialog-list'), true);
          } else {
            render();
          }
        }
      }

      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && calDrag) {
          event.preventDefault();
          endCalDrag(true);
          return;
        }

        handleKeyCommand(event);
      });

      /* ---------- カレンダーへのドラッグ（実行日を振る） ---------- */

      const CAL_DRAG_MEDIA = '(min-width: 1101px) and (pointer: fine)';

      $('content').addEventListener('pointerdown', function (event) {
        if (
          page !== 'tasks' ||
          taskView !== 'calendar' ||
          calDrag ||
          anyDialogOpen() ||
          event.isPrimary === false ||
          (event.pointerType === 'mouse' && event.button !== 0) ||
          !window.matchMedia(CAL_DRAG_MEDIA).matches
        ) {
          return;
        }

        const card = event.target.closest('.calendar-details .card[data-id]');

        if (
          !card ||
          card.dataset.local === 'true' ||
          event.target.closest('button, input, textarea, select, a')
        ) {
          return;
        }

        calDrag = {
          id: card.dataset.id,
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          started: false,
          ghost: null,
          overDate: ''
        };
      });

      function startCalDrag() {
        const task = client.effectiveTasks().find(function (entry) {
          return entry.taskId === calDrag.id;
        });

        if (!task || task.localOnly || task.blocked) {
          calDrag = null;
          return false;
        }

        const ghost = make('div', null, 'drag-ghost');
        ghost.appendChild(make('div', task.title, 'card-title'));
        ghost.style.width = '240px';
        document.body.appendChild(ghost);
        document.body.classList.add('is-planning-drag');

        calDrag.started = true;
        calDrag.ghost = ghost;
        calDrag.due = task.due || '';

        const origin = document.querySelector(
          '.calendar-details .card[data-id="' + calDrag.id + '"]'
        );

        if (origin) {
          origin.classList.add('cal-drag-origin');
        }

        // 動かしている間だけ、このタスクの期限の日を赤くする（期限なしは何もしない）
        if (calDrag.due) {
          document.querySelectorAll('.calendar-day[data-date="' + calDrag.due + '"]')
            .forEach(function (cell) {
              cell.classList.add('is-due-mark');
            });
        }

        const selection = window.getSelection && window.getSelection();

        if (selection) {
          selection.removeAllRanges();
        }

        $('drag-announcement').textContent =
          '移動中。カレンダーの日付へ置くと実行日になります。Escで取り消します。';

        return true;
      }

      function moveCalDrag(event) {
        const ghost = calDrag.ghost;

        ghost.style.left = Math.max(8, Math.min(
          event.clientX + 14,
          window.innerWidth - ghost.offsetWidth - 8
        )) + 'px';

        ghost.style.top = Math.max(8, Math.min(
          event.clientY + 14,
          window.innerHeight - 90
        )) + 'px';

        document.querySelectorAll('.calendar-day.is-drop-target')
          .forEach(function (cell) {
            cell.classList.remove('is-drop-target');
          });

        const over = document.elementFromPoint(event.clientX, event.clientY);
        const cell = over && over.closest('.calendar-day[data-date]');

        calDrag.overDate = cell ? cell.dataset.date : '';

        if (cell) {
          cell.classList.add('is-drop-target');
        }
      }

      async function endCalDrag(cancelled) {
        const current = calDrag;

        if (!current) {
          return;
        }

        calDrag = null;

        if (current.ghost) {
          current.ghost.remove();
        }

        document.body.classList.remove('is-planning-drag');

        document.querySelectorAll(
          '.cal-drag-origin, .is-due-mark, .calendar-day.is-drop-target'
        ).forEach(function (element) {
          element.classList.remove(
            'cal-drag-origin',
            'is-due-mark',
            'is-drop-target'
          );
        });

        if (!current.started) {
          return;
        }

        suppressClickUntil = Date.now() + 500;

        const date = cancelled ? '' : current.overDate;
        const task = date && client.effectiveTasks().find(function (entry) {
          return entry.taskId === current.id;
        });

        if (!task || task.date === date) {
          $('drag-announcement').textContent = '移動を終了しました。';

          if (renderDeferred) {
            render();
          }

          return;
        }

        const base = editBase(current.id);

        if (!base) {
          if (renderDeferred) {
            render();
          }

          return;
        }

        try {
          await client.enqueue(Object.assign({}, base.payload, {
            title: base.captured.title,
            due: base.captured.due,
            date: date
          }), '実行日：' + base.captured.title + ' ／ ' + date, base.context);

          $('drag-announcement').textContent = '実行日を端末に保存しました。';
          notify('端末に保存しました');
        } catch (error) {
          failed('実行日を端末に保存できませんでした', error);
        }

        if (renderDeferred) {
          render();
        }
      }

      document.addEventListener('pointermove', function (event) {
        if (!calDrag || event.pointerId !== calDrag.pointerId) {
          return;
        }

        if (!calDrag.started) {
          if (
            Math.abs(event.clientX - calDrag.startX) <= 6 &&
            Math.abs(event.clientY - calDrag.startY) <= 6
          ) {
            return;
          }

          if (!startCalDrag()) {
            return;
          }
        }

        moveCalDrag(event);
      });

      document.addEventListener('pointerup', function (event) {
        if (calDrag && event.pointerId === calDrag.pointerId) {
          if (calDrag.started) {
            moveCalDrag(event);
          }

          endCalDrag(false);
        }
      });

      document.addEventListener('pointercancel', function (event) {
        if (calDrag && event.pointerId === calDrag.pointerId) {
          endCalDrag(true);
        }
      });

      window.addEventListener('blur', function () {
        endCalDrag(true);
      });

      document.addEventListener('selectstart', function (event) {
        if (calDrag && calDrag.started) {
          event.preventDefault();
        }
      });

      /* ---------- 画面内のキー操作 ---------- */

      function keyRows() {
        if (page === 'plan' || page === 'running') {
          return [];
        }

        return Array.from(document.querySelectorAll('#content .cards .card[data-id][data-local="false"]'))
          .filter(function (row) {
            return row.dataset.placeholder !== 'true' &&
              row.getClientRects().length > 0;
          });
      }

      function applyKeySelection() {
        document.querySelectorAll('.is-key-selected')
          .forEach(function (row) {
            row.classList.remove('is-key-selected');
          });

        if (!keySelectedId) {
          return;
        }

        const row = keyRows().find(function (entry) {
          return entry.dataset.id === keySelectedId;
        });

        if (row) {
          row.classList.add('is-key-selected');
        }
      }

      function selectByKey(step) {
        const rows = keyRows();

        if (!rows.length) {
          return false;
        }

        const index = rows.findIndex(function (row) {
          return row.dataset.id === keySelectedId;
        });

        const next = index < 0
          ? (step > 0 ? 0 : rows.length - 1)
          : Math.max(0, Math.min(rows.length - 1, index + step));

        keySelectedId = rows[next].dataset.id;
        applyKeySelection();
        rows[next].scrollIntoView({ block: 'nearest' });

        $('drag-announcement').textContent =
          (rows[next].querySelector('.ttl > div, .card-title') || rows[next])
            .textContent.slice(0, 60) + ' を選択';

        return true;
      }

      function openKeys() {
        const list = $('keys-list');

        if (!list.children.length) {
          TaskCore.KEY_COMMANDS.forEach(function (command) {
            list.append(
              make('dt', command.show),
              make('dd', command.text)
            );
          });
        }

        $('keys-dialog').showModal();
      }

      function handleKeyCommand(event) {
        if (
          anyOrderDragging() ||
          calDrag ||
          anyDialogOpen() ||
          event.defaultPrevented
        ) {
          return;
        }

        const list = activeOrderList();

        if (list && list.handleKey(event)) {
          return;
        }

        const command = TaskCore.keyCommand(event);

        if (!command) {
          return;
        }

        if (event.repeat && command !== 'next' && command !== 'prev') {
          return;
        }

        if (command === 'next' || command === 'prev') {
          if (selectByKey(command === 'next' ? 1 : -1)) {
            event.preventDefault();
          }
        } else if (command === 'add') {
          if (!$('add').disabled) {
            event.preventDefault();
            $('add').click();
          }
        } else if (command === 'help') {
          event.preventDefault();
          openKeys();
        }
      }

      $('keys').addEventListener('click', openKeys);

      $('keys-close').addEventListener('click', function () {
        $('keys-dialog').close();
      });

      /* ---------- 絞り込み ---------- */

      function filterLabel() {
        const labels = {
          today: '実行日：今日',
          week: '実行日：今週',
          runoverdue: '実行日：昨日以前',
          hasdue: '期限あり',
          overdue: '期限切れ',
          nodue: '期限なし',
          nodate: '実行日なし',
          noboth: '期限・実行日なし'
        };

        if (taskFilter === 'date') {
          return '実行日：' +
            (filterDate ? shortDate(filterDate) : '日付を指定');
        }

        return labels[taskFilter] || 'すべて';
      }

      function positionTaskFilter() {
        const dialog = $('task-filter-dialog');

        if (!dialog.open) {
          return;
        }

        if (window.matchMedia('(max-width: 700px)').matches) {
          dialog.style.removeProperty('left');
          dialog.style.removeProperty('top');
          dialog.style.removeProperty('max-height');
          return;
        }

        const trigger = $('task-filter-trigger');

        if (!trigger) {
          return;
        }

        const rect = trigger.getBoundingClientRect();
        const margin = 12;
        const viewportHeight = window.innerHeight;

        dialog.style.maxHeight =
          Math.max(120, viewportHeight - 24) + 'px';

        const size = dialog.getBoundingClientRect();
        const below = viewportHeight - rect.bottom - 8 - margin;
        let top;
        let available;

        if (below >= 220 || below >= rect.top - 8 - margin) {
          top = Math.max(margin, rect.bottom + 8);
          available = viewportHeight - top - margin;
        } else {
          available = Math.max(120, rect.top - 8 - margin);
          top = Math.max(
            margin,
            rect.top - 8 - Math.min(size.height, available)
          );
        }

        dialog.style.left = Math.max(
          margin,
          Math.min(rect.left, window.innerWidth - size.width - margin)
        ) + 'px';

        dialog.style.top = top + 'px';
        dialog.style.maxHeight = Math.max(120, available) + 'px';
      }

      function openTaskFilter() {
        if (anyDialogOpen()) {
          return;
        }

        const options = $('task-filter-options');
        options.replaceChildren();
        filterFocusDate = false;

        FILTER_GROUPS.forEach(function (group, index) {
          const section = make('div', null, 'filter-group');
          const heading = make('h3', group.label, 'filter-group-title');
          heading.id = 'task-filter-group-' + index;

          section.setAttribute('role', 'group');
          section.setAttribute('aria-labelledby', heading.id);
          section.appendChild(heading);

          group.items.forEach(function (entry) {
            const selected = taskFilter === entry[0];
            const option = make('button', null, 'filter-option');

            option.classList.toggle('is-selected', selected);
            option.type = 'button';
            option.dataset.filter = entry[0];
            option.setAttribute('role', 'menuitemradio');
            option.setAttribute('aria-checked', String(selected));
            option.tabIndex = selected ? 0 : -1;

            const check = make('span', null, 'filter-option-check');

            if (selected) {
              check.appendChild(icon('check'));
            }

            option.append(
              make('span', entry[1], 'filter-option-label'),
              check
            );

            option.addEventListener('click', function () {
              taskFilter = entry[0];
              filterFocusDate = taskFilter === 'date';
              $('task-filter-dialog').close();
            });

            section.appendChild(option);
          });

          options.appendChild(section);
        });

        $('task-filter-trigger').setAttribute('aria-expanded', 'true');
        document.body.classList.add('filter-open');
        $('task-filter-dialog').showModal();
        positionTaskFilter();

        const selected = options.querySelector('[aria-checked="true"]');

        if (selected) {
          selected.focus({
            preventScroll: true
          });

          selected.scrollIntoView({
            block: 'nearest'
          });
        }
      }

      $('task-filter-close').addEventListener('click', function () {
        $('task-filter-dialog').close();
      });

      $('task-filter-dialog').addEventListener('click', function (event) {
        const dialog = $('task-filter-dialog');

        if (event.target !== dialog) {
          return;
        }

        const rect = dialog.getBoundingClientRect();

        if (
          event.clientX < rect.left ||
          event.clientX > rect.right ||
          event.clientY < rect.top ||
          event.clientY > rect.bottom
        ) {
          dialog.close();
        }
      });

      $('task-filter-dialog').addEventListener('close', function () {
        document.body.classList.remove('filter-open');
        render();

        const target = filterFocusDate
          ? $('task-filter-date')
          : $('task-filter-trigger');

        filterFocusDate = false;

        if (target) {
          target.focus({
            preventScroll: true
          });
        }
      });

      $('task-filter-options').addEventListener('keydown', function (event) {
        if (
          ['ArrowDown', 'ArrowUp', 'Home', 'End'].indexOf(event.key) < 0
        ) {
          return;
        }

        const options = Array.from(
          $('task-filter-options').querySelectorAll('[role="menuitemradio"]')
        );

        if (!options.length) {
          return;
        }

        event.preventDefault();
        const current = options.indexOf(document.activeElement);
        let next;

        if (event.key === 'Home') {
          next = 0;
        } else if (event.key === 'End') {
          next = options.length - 1;
        } else {
          next = (
            current +
            (event.key === 'ArrowDown' ? 1 : -1) +
            options.length
          ) % options.length;
        }

        options.forEach(function (option, index) {
          option.tabIndex = index === next ? 0 : -1;
        });

        options[next].focus();
      });

      /* ---------- タスク一覧・カレンダー ---------- */

      function filterTask(task) {
        const today = japanDate();
        const date = new Date(today + 'T12:00:00Z');
        const weekEnd = dateShift(today, (7 - date.getUTCDay()) % 7);

        switch (taskFilter) {
          case 'today':
            return task.date === today;
          case 'date':
            return !!filterDate && task.date === filterDate;
          case 'week':
            return !!task.date && task.date >= today && task.date <= weekEnd;
          case 'runoverdue':
            return !!task.date && task.date < today;
          case 'hasdue':
            return !!task.due;
          case 'overdue':
            return !!task.due && task.due < today;
          case 'nodue':
            return !task.due;
          case 'nodate':
            return !task.date;
          case 'noboth':
            return !task.date && !task.due;
          default:
            return true;
        }
      }

      function renderTaskCards(content, tasks) {
        if (!tasks.length) {
          content.appendChild(make('p', 'タスクなし', 'sub'));
          return;
        }

        const cards = make('div', null, 'cards');

        tasks.forEach(function (task) {
          const card = make(
            'div',
            null,
            'card' + (task.localOnly ? ' pending-add' : '')
          );

          const main = make('div', null, 'card-main');
          main.appendChild(make('div', task.title, 'card-title'));
          appendTaskDates(main, task, false);

          if (task.localOnly || task.pendingPlanning) {
            main.appendChild(make(
              'div',
              task.pendingText || '送信待ち',
              'pending-label'
            ));
          }

          card.dataset.id = task.taskId;
          card.dataset.local = task.localOnly ? 'true' : 'false';

          card.append(
            completeButton(task),
            main,
            runToggleButton(task),
            editButton(task)
          );
          cards.appendChild(card);
        });

        content.appendChild(cards);
      }

      function renderTasks(content) {
        content.appendChild(make('h2', 'タスク一覧'));

        const switcher = make('div', null, 'view-switch');
        switcher.setAttribute('role', 'group');
        switcher.setAttribute('aria-label', '一覧の表示方法');

        [
          ['list', '一覧'],
          ['calendar', 'カレンダー']
        ].forEach(function (entry) {
          const control = button(entry[1], function () {
            taskView = entry[0];
            render();
          }, taskView === entry[0] ? 'active' : '');

          control.setAttribute(
            'aria-pressed',
            String(taskView === entry[0])
          );

          switcher.appendChild(control);
        });

        content.appendChild(switcher);

        if (taskView === 'calendar') {
          renderCalendar(content);
        } else {
          renderTaskList(content);
        }
      }

      function renderTaskList(content) {
        const tools = make('div', null, 'toolbar task-filters');
        const field = make('div', null, 'filter-field');
        const label = make('span', '絞り込み');
        label.id = 'task-filter-caption';

        const trigger = button(
          '',
          openTaskFilter,
          'filter-trigger' + (taskFilter !== 'all' ? ' is-filtered' : '')
        );

        trigger.id = 'task-filter-trigger';
        trigger.setAttribute('aria-haspopup', 'dialog');
        trigger.setAttribute('aria-expanded', 'false');
        trigger.setAttribute('aria-controls', 'task-filter-dialog');

        const value = make('span', filterLabel(), 'filter-trigger-value');
        value.id = 'task-filter-value';

        trigger.setAttribute(
          'aria-labelledby',
          'task-filter-caption task-filter-value'
        );

        const arrow = make('span', null, 'filter-trigger-arrow');
        arrow.appendChild(icon('chevron-down'));

        trigger.append(value, arrow);
        field.append(label, trigger);
        tools.appendChild(field);

        if (taskFilter === 'date') {
          const dateField = make('label', null, 'filter-field');
          const input = make('input', null, 'form-control');

          input.id = 'task-filter-date';
          input.type = 'date';
          input.value = filterDate;

          input.addEventListener('change', function () {
            filterDate = input.value;
            render();
          });

          dateField.append(make('span', '実行日'), input);
          tools.appendChild(dateField);
        }

        content.appendChild(tools);

        const tasks = client.effectiveTasks().filter(filterTask);

        if (taskFilter === 'hasdue') {
          tasks.sort(function (a, b) {
            return a.due.localeCompare(b.due) || a.row - b.row;
          });
        } else if (taskFilter === 'runoverdue') {
          tasks.sort(function (a, b) {
            return a.date.localeCompare(b.date) || compareTasks(a, b);
          });
        }

        renderTaskCards(content, tasks);
      }

      function moveCalendarMonth(amount) {
        calendarMonth = monthShift(calendarMonth, amount);
        calendarDate = calendarMonth + '-01';
        calendarUndated = false;
        render();
      }

      function renderCalendar(content) {
        const tasks = client.effectiveTasks();
        const counts = new Map();
        let undatedCount = 0;

        tasks.forEach(function (task) {
          if (task.date) {
            counts.set(task.date, (counts.get(task.date) || 0) + 1);
          } else {
            undatedCount++;
          }
        });

        const calendar = make('section', null, 'calendar');
        const tools = make('div', null, 'toolbar calendar-tools');

        const monthText = Number(calendarMonth.slice(0, 4)) + '年' +
          Number(calendarMonth.slice(5, 7)) + '月';

        tools.append(
          button('前月', function () {
            moveCalendarMonth(-1);
          }),
          make('h3', monthText, 'calendar-month'),
          button('今月', function () {
            calendarDate = japanDate();
            calendarMonth = calendarDate.slice(0, 7);
            calendarUndated = false;
            render();
          }),
          button('翌月', function () {
            moveCalendarMonth(1);
          })
        );

        calendar.appendChild(tools);

        const grid = make('div', null, 'calendar-grid');
        grid.setAttribute('role', 'group');
        grid.setAttribute('aria-label', monthText + 'のタスク数');

        ['日', '月', '火', '水', '木', '金', '土']
          .forEach(function (weekday) {
            grid.appendChild(make('div', weekday, 'calendar-weekday'));
          });

        const first = new Date(calendarMonth + '-01T12:00:00Z');
        const firstWeekday = first.getUTCDay();
        const last = new Date(first);

        last.setUTCMonth(last.getUTCMonth() + 1);
        last.setUTCDate(0);

        const daysInMonth = last.getUTCDate();
        const today = japanDate();

        for (let index = 0; index < firstWeekday; index++) {
          grid.appendChild(make('div'));
        }

        for (let day = 1; day <= daysInMonth; day++) {
          const date = calendarMonth + '-' + String(day).padStart(2, '0');
          const count = counts.get(date) || 0;
          const selected = !calendarUndated && calendarDate === date;

          const cell = button('', function () {
            calendarDate = date;
            calendarUndated = false;
            render();
          }, 'calendar-day');

          cell.dataset.date = date;
          cell.classList.toggle('is-selected', selected);
          cell.classList.toggle('is-today', date === today);
          cell.setAttribute('aria-pressed', String(selected));
          cell.setAttribute(
            'aria-label',
            dateLabel(date) + '、' + (count ? count + '件' : 'タスクなし')
          );

          if (date === today) {
            cell.setAttribute('aria-current', 'date');
          }

          cell.append(
            make('span', String(day), 'calendar-day-number'),
            make('span', count ? count + '件' : '', 'calendar-count')
          );

          grid.appendChild(cell);
        }

        const trailing = (7 - (firstWeekday + daysInMonth) % 7) % 7;

        for (let index = 0; index < trailing; index++) {
          grid.appendChild(make('div'));
        }

        calendar.appendChild(grid);

        const undated = button(
          '実行日なし ' + undatedCount + '件',
          function () {
            calendarUndated = true;
            render();
          },
          'calendar-undated' + (calendarUndated ? ' is-selected' : '')
        );

        undated.setAttribute('aria-pressed', String(calendarUndated));
        calendar.appendChild(undated);

        // PC幅では、左にタスク・右にカレンダー（並びはCSSで決める）
        const board = make('div', null, 'calendar-board');
        board.appendChild(calendar);
        content.appendChild(board);

        const details = make('section', null, 'calendar-details');

        details.appendChild(make(
          'h3',
          calendarUndated ? '実行日なし' : dateLabel(calendarDate)
        ));

        const shown = tasks.filter(function (task) {
          return calendarUndated ? !task.date : task.date === calendarDate;
        });

        if (!calendarUndated) {
          shown.sort(compareTasks);
        }

        renderTaskCards(details, shown);
        board.appendChild(details);
      }

      /* ---------- 追加・編集 ---------- */

      function field(name, label, type, value, required) {
        const wrapper = make('label', null, 'field');
        wrapper.appendChild(make('span', label, 'form-label'));

        // 件名は複数行で入力する（textarea）。それ以外は1行
        const input = type === 'textarea'
          ? make('textarea', null, 'form-control')
          : make('input', null, 'form-control');
        input.name = name;

        if (type === 'textarea') {
          input.rows = 2;
        } else {
          input.type = type;
        }

        input.value = value == null ? '' : String(value);
        input.required = !!required;

        wrapper.appendChild(input);
        $('editor-fields').appendChild(wrapper);
        return input;
      }

      function selectField(name, label, options, value) {
        const wrapper = make('label', null, 'field');
        wrapper.appendChild(make('span', label, 'form-label'));
        const select = make('select', null, 'form-select');
        select.name = name;

        options.forEach(function (entry) {
          const option = make('option', entry[1]);
          option.value = String(entry[0]);
          select.appendChild(option);
        });

        select.value = String(value);
        wrapper.appendChild(select);
        $('editor-fields').appendChild(wrapper);
        return select;
      }

      function showEditor(title, handler, submitLabel) {
        editorPosition = capturePosition();
        editorHandler = handler;
        editorSaving = false;
        $('editor-title').textContent = title;
        $('editor-fields').replaceChildren();
        $('editor-note').textContent = '';
        $('editor-note').hidden = true;
        $('editor-submit').textContent = submitLabel || '保存';
        $('editor-submit').disabled = false;
        $('editor-cancel').disabled = false;
        $('editor').showModal();
      }

      function openAdd() {
        showEditor(
          'タスクを追加',
          async function (form) {
            const title = String(form.get('title') || '').trim();
            const due = String(form.get('due') || '');
            const date = String(form.get('date') || '');

            const problem = TaskCore.titleProblem(title, '件名');

            if (problem) {
              throw new Error(problem);
            }

            await client.enqueue({
              action: 'add',
              title: title,
              due: due,
              date: date
            }, '追加：' + title +
              ' ／ ' + (date ? '実行日：' + date : '実行日なし') +
              (due ? ' ／ 期限：' + due : '')
            );

            notify('端末に保存しました');
          },
          '追加'
        );

        field('title', '件名＊', 'textarea', '', true).focus();
        field('due', '期限', 'date', '', false);
        field('date', '実行日', 'date', '', false);
      }

      // 編集の土台（編集画面とカレンダーへのドラッグが共有）。確認できなければ通知して null
      function editBase(id) {
        if (!onlineRequired()) {
          return null;
        }

        if (!editingSupported()) {
          notify(
            '保存先の更新が必要です',
            true,
            'コード.gsと変更順.gsのv4.12.1を反映し、一覧を更新してください。'
          );
          return null;
        }

        const original = taskById(state.snapshot, id);
        const visible = client.effectiveTasks().find(function (task) {
          return task.taskId === id && !task.localOnly;
        });

        if (!original || !visible || visible.blocked) {
          notify('タスクの状態を確認してください', true);
          return null;
        }

        const captured = clone(visible);

        const payload = {
          action: 'edit',
          taskId: id,
          expectedTask: original.version,
          editProtocol: EDIT_PROTOCOL,
          editBase: TaskCore.editValues(captured)
        };

        return {
          captured: captured,
          payload: payload,
          context: client.context(payload)
        };
      }

      function openTaskEditor(id) {
        const base = editBase(id);

        if (!base) {
          return;
        }

        const captured = base.captured;
        const payload = base.payload;
        const context = base.context;

        showEditor('タスクを編集', async function (form) {
