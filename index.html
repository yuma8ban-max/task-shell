<body>
  <div class="app">
    <nav aria-label="画面の切り替え">
      <button type="button" data-page="plan" class="active">1日の計画</button>
      <button type="button" data-page="tasks">タスク一覧</button>
      <button type="button" data-page="periodic">定期タスク</button>
      <button type="button" data-page="history">完了済み</button>
    </nav>

    <main>
      <header>
        <h1>タスク</h1>
        <span class="version">v4.1</span>
        <span class="spacer"></span>
        <button id="add" class="primary" type="button">タスクを追加</button>
        <button id="reload" type="button">最新を取得</button>
        <button id="settings" type="button">設定</button>
      </header>

      <div id="status" class="status" aria-live="polite">準備中…</div>
      <div id="message" class="notice" hidden aria-live="polite"></div>

      <details id="outbox" hidden>
        <summary id="outbox-summary">未送信</summary>
        <div id="outbox-items"></div>
      </details>

      <section id="content" class="panel"></section>
    </main>
  </div>

  <dialog id="editor">
    <h2 id="editor-title"></h2>
    <form id="editor-form">
      <div id="editor-fields"></div>
      <div id="editor-note" class="sub"></div>
      <div class="dialog-actions">
        <button type="button" id="editor-cancel">取り消す</button>
        <button type="submit" class="primary" id="editor-submit">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="settings-dialog">
    <h2>設定</h2>

    <label class="field">
      接続先
      <input id="url" type="text" autocapitalize="off" autocorrect="off" spellcheck="false">
    </label>

    <label class="field">
      合い言葉
      <input id="token" type="password" autocomplete="off" autocapitalize="off">
    </label>

    <p class="sub">
      この端末の中だけに保存します。以前から使っている端末では、設定を引き継ぎます。
    </p>

    <div class="toolbar">
      <button id="check" type="button">動作の点検</button>
      <button id="copy" type="button">状態をコピー</button>
    </div>

    <div class="dialog-actions">
      <button id="settings-close" type="button">閉じる</button>
      <button id="settings-save" class="primary" type="button">保存</button>
    </div>
  </dialog>

  <dialog id="conflict-dialog">
    <h2>変更が重なっています</h2>
    <p id="conflict-note" class="sub"></p>
    <div class="comparison">
      <section>
        <h3>保存済み</h3>
        <div id="conflict-server"></div>
      </section>
      <section>
        <h3>この端末の変更</h3>
        <div id="conflict-local"></div>
      </section>
    </div>
    <div class="dialog-actions">
      <button id="conflict-close" type="button">後で確認</button>
      <button id="conflict-remote" type="button">保存済みを使う</button>
      <button id="conflict-apply" class="primary" type="button">端末の変更を反映</button>
    </div>
  </dialog>

  <script>
    'use strict';

    const VERSION = 'v4.1';
    const SERVER_VERSION = 'v4.0';
    const DB_NAME = 'taskapp-unified';
    const URL_KEY = 'gasUrl_v1';
    const TOKEN_KEY = 'gasTok_v1';
    const TAB_ID = uuid();

    let db = null;
    let state = emptyState();
    let page = 'plan';
    let selectedDate = japanDate();
    let taskFilter = 'all';
    let filterDate = selectedDate;
    let historyData = {
      items: [],
      total: 0
    };

    let storageReady = false;
    let legacyBlocked = false;
    let refreshing = false;
    let pumping = false;
    let nextTry = 0;
    let failures = 0;
    let editorContext = null;
    let conflictId = null;
    let readSequence = 0;
    let channel = null;

    let drag = null;
    let candidate = null;
    let holdTimer = null;
    let pointerId = null;
    let startX = 0;
    let startY = 0;
    let pointerX = 0;
    let pointerY = 0;
    let autoTimer = null;
    let autoDirection = 0;
    let suppressClickUntil = 0;
    let dragContext = null;

    function $(id) {
      return document.getElementById(id);
    }

    function uuid() {
      if (window.crypto && window.crypto.randomUUID) {
        return crypto.randomUUID();
      }

      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (character) {
        const number = Math.random() * 16 | 0;
        return (character === 'x' ? number : number & 3 | 8).toString(16);
      });
    }

    function emptyState() {
      return {
        snapshot: null,
        jobs: [],
        sequence: 0,
        transitions: [],
        savedAt: 0
      };
    }

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function make(tag, text, className) {
      const element = document.createElement(tag);

      if (text !== undefined && text !== null) {
        element.textContent = text;
      }

      if (className) {
        element.className = className;
      }

      return element;
    }

    function button(text, handler, className) {
      const element = make('button', text, className);
      element.type = 'button';
      element.addEventListener('click', handler);
      return element;
    }

    function notify(text, error) {
      $('message').textContent = text || '';
      $('message').className = 'notice' + (error ? ' error' : '');
      $('message').hidden = !text;
    }

    function japanDate() {
      return new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10);
    }

    function dateShift(value, days) {
      const date = new Date(value + 'T12:00:00Z');
      date.setUTCDate(date.getUTCDate() + days);
      return date.toISOString().slice(0, 10);
    }

    function hourLabel(hour) {
      return hour === null ? '時間未定' : hour + '時';
    }

    function compareTasks(a, b) {
      const first = a.hour === null ? 7 : a.hour;
      const second = b.hour === null ? 7 : b.hour;

      if (first !== second) {
        return first - second;
      }

      const orderA = a.order == null ? Infinity : a.order;
      const orderB = b.order == null ? Infinity : b.order;

      return orderA - orderB || a.row - b.row;
    }

    function dayVersion(snapshot, date) {
      return snapshot.days[date] || snapshot.emptyDay;
    }

    function taskById(snapshot, id) {
      return snapshot.tasks.find(function (task) {
        return task.taskId === id;
      }) || null;
    }

    /* ---------- 端末内への保存 ---------- */

    function openDatabase() {
      return new Promise(function (resolve, reject) {
        if (!window.indexedDB) {
          reject(new Error('この端末では保存を利用できません。'));
          return;
        }

        const request = indexedDB.open(DB_NAME, 1);

        request.onupgradeneeded = function () {
          request.result.createObjectStore('data');
        };

        request.onsuccess = function () {
          resolve(request.result);
        };

        request.onerror = function () {
          reject(request.error);
        };
      });
    }

    function readState() {
      return new Promise(function (resolve, reject) {
        const transaction = db.transaction('data', 'readonly');
        const request = transaction.objectStore('data').get('main');

        transaction.oncomplete = function () {
          resolve(request.result || emptyState());
        };

        transaction.onerror = function () {
          reject(transaction.error);
        };
      });
    }

    function updateState(change) {
      return new Promise(function (resolve, reject) {
        const transaction = db.transaction('data', 'readwrite');
        const store = transaction.objectStore('data');
        const request = store.get('main');
        let next;
        let output;
        let caught;

        request.onsuccess = function () {
          try {
            next = request.result || emptyState();
            output = change(next);
            next.savedAt = Date.now();
            store.put(next, 'main');
          } catch (error) {
            caught = error;
            transaction.abort();
          }
        };

        transaction.oncomplete = function () {
          state = next;
          render();

          if (channel) {
            channel.postMessage('changed');
          }

          resolve(output);
        };

        transaction.onerror = transaction.onabort = function () {
          reject(caught || transaction.error || new Error('端末に保存できませんでした。'));
        };
      });
    }

    function lease(action) {
      return new Promise(function (resolve, reject) {
        const transaction = db.transaction('data', 'readwrite');
        const store = transaction.objectStore('data');
        const request = store.get('sender');
        let accepted = false;

        request.onsuccess = function () {
          const saved = request.result;
          const now = Date.now();

          if (action === 'release') {
            if (saved && saved.owner === TAB_ID) {
              store.delete('sender');
            }

            accepted = true;
            return;
          }

          if (!saved || saved.owner === TAB_ID || saved.until < now) {
            store.put({
              owner: TAB_ID,
              until: now + 60000
            }, 'sender');

            accepted = true;
          }
        };

        transaction.oncomplete = function () {
          resolve(accepted);
        };

        transaction.onerror = function () {
          reject(transaction.error);
        };
      });
    }

    async function oldPendingCount() {
      let fallback = [];

      try {
        fallback = JSON.parse(localStorage.getItem('outbox_v1') || '[]');
      } catch (error) {
        throw new Error('以前の未送信記録を読み取れません。端末データは消さないでください。');
      }

      const old = await new Promise(function (resolve, reject) {
        const request = indexedDB.open('taskapp');
        let created = false;

        request.onupgradeneeded = function () {
          created = true;
          request.transaction.abort();
        };

        request.onerror = function () {
          if (created) {
            resolve([]);
          } else {
            reject(request.error);
          }
        };

        request.onsuccess = function () {
          const oldDb = request.result;

          if (!oldDb.objectStoreNames.contains('outbox')) {
            oldDb.close();
            resolve([]);
            return;
          }

          const transaction = oldDb.transaction('outbox', 'readonly');
          const get = transaction.objectStore('outbox').getAll();

          transaction.oncomplete = function () {
            oldDb.close();
            resolve(get.result || []);
          };

          transaction.onerror = function () {
            oldDb.close();
            reject(transaction.error);
          };
        };
      });

      return new Set(old.concat(fallback).map(function (job) {
        return job.id;
      })).size;
    }

    /* ---------- 通信 ---------- */

    function configured() {
      return !!localStorage.getItem(URL_KEY) &&
        !!localStorage.getItem(TOKEN_KEY);
    }

    async function api(payload) {
      if (!configured()) {
        throw new Error('設定から接続先と合い言葉を保存してください。');
      }

      const controller = new AbortController();
      const timer = setTimeout(function () {
        controller.abort();
      }, 30000);

      try {
        const response = await fetch(localStorage.getItem(URL_KEY), {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify(Object.assign({
            mode: 'web',
            token: localStorage.getItem(TOKEN_KEY)
          }, payload)),
          redirect: 'follow',
          signal: controller.signal
        });

        const text = await response.text();
        let result;

        try {
          result = JSON.parse(text);
        } catch (error) {
          throw new Error('接続先から一覧を受け取れませんでした。公開中の内容と接続先を確認してください。');
        }

        if (result.ok && result.app !== SERVER_VERSION) {
          throw new Error('保存先の版が' + SERVER_VERSION + 'ではありません。');
        }

        return result;
      } finally {
        clearTimeout(timer);
      }
    }

    async function acceptSnapshot(snapshot) {
      if (!snapshot) {
        return;
      }

      await updateState(function (saved) {
        saved.snapshot = snapshot;
      });
    }

    async function refresh() {
      if (
        !storageReady ||
        legacyBlocked ||
        refreshing ||
        drag ||
        pumping ||
        !navigator.onLine ||
        !configured()
      ) {
        renderStatus();
        return;
      }

      refreshing = true;
      const sequence = ++readSequence;

      try {
        const result = await api({
          action: 'load'
        });

        if (!result.ok) {
          throw new Error(result.message);
        }

        if (sequence === readSequence && !pumping) {
          await acceptSnapshot(result.snapshot);
        }
      } catch (error) {
        notify(
          String(error.message || error) +
          (state.snapshot ? '\n取得済みの内容は端末に残っています。' : ''),
          true
        );
      } finally {
        refreshing = false;
        renderStatus();
      }
    }

    /* ---------- 未送信の順序と食い違い ---------- */

    function resources(payload, snapshot) {
      const keys = [];

      if (payload.action === 'order') {
        keys.push('day:' + payload.date);
      }

      if (payload.taskId) {
        keys.push('task:' + payload.taskId);

        const task = taskById(snapshot, payload.taskId);

        if (task && task.date) {
          keys.push('day:' + task.date);
        }

        if (payload.action === 'edit' && payload.date) {
          keys.push('day:' + payload.date);
        }
      }

      if (
        payload.action.indexOf('periodic') === 0 ||
        payload.action === 'automatic'
      ) {
        keys.push('periodic');
      }

      if (payload.action === 'undo' || payload.action === 'done') {
        keys.push('undo');
      }

      return keys;
    }

    function contextFor(payload, snapshot) {
      const keys = resources(payload, snapshot);

      return {
        keys: keys,
        causes: state.jobs.filter(function (job) {
          return job.keys.some(function (key) {
            return keys.indexOf(key) >= 0;
          });
        }).map(function (job) {
          return job.id;
        })
      };
    }

    function advance(payload, transition) {
      if (!transition) {
        return;
      }

      (transition.days || []).forEach(function (entry) {
        if (
          payload.action === 'order' &&
          payload.date === entry.key &&
          payload.expectedDay === entry.before
        ) {
          payload.expectedDay = entry.after;
        }
      });

      (transition.tasks || []).forEach(function (entry) {
        if (
          payload.taskId === entry.key &&
          payload.expectedTask === entry.before
        ) {
          payload.expectedTask = entry.after;
        }
      });

      if (
        transition.periodic &&
        payload.expectedPeriodic === transition.periodic.before
      ) {
        payload.expectedPeriodic = transition.periodic.after;
      }

      if (
        transition.undo &&
        payload.expectedUndo === transition.undo.before
      ) {
        payload.expectedUndo = transition.undo.after;
      }
    }

    function mergePlan(items, tasks, date) {
      const available = tasks.filter(function (task) {
        return task.date === date;
      }).sort(compareTasks);

      const byId = new Map(available.map(function (task) {
        return [task.taskId, task];
      }));

      const used = new Set();
      const output = [];

      (items || []).forEach(function (item) {
        if (byId.has(item.id) && !used.has(item.id)) {
          used.add(item.id);

          output.push({
            id: item.id,
            hour: item.hour
          });
        }
      });

      available.forEach(function (task) {
        if (!used.has(task.taskId)) {
          output.push({
            id: task.taskId,
            hour: task.hour
          });
        }
      });

      return output.map(function (item, index) {
        return {
          item: item,
          index: index
        };
      }).sort(function (a, b) {
        const first = a.item.hour === null ? 7 : a.item.hour;
        const second = b.item.hour === null ? 7 : b.item.hour;

        return first - second || a.index - b.index;
      }).map(function (entry) {
        return entry.item;
      });
    }

    function effectiveTasks() {
      if (!state.snapshot) {
        return [];
      }

      let tasks = clone(state.snapshot.tasks);

      state.jobs.slice().sort(function (a, b) {
        return a.sequence - b.sequence;
      }).forEach(function (job) {
        const payload = job.payload;

        if (payload.action === 'done') {
          tasks = tasks.filter(function (task) {
            return task.taskId !== payload.taskId;
          });
        }

        if (payload.action === 'edit') {
          const task = tasks.find(function (entry) {
            return entry.taskId === payload.taskId;
          });

          if (task) {
            task.title = payload.title;
            task.due = payload.due;
            task.date = payload.date;
          }
        }

        if (payload.action === 'order') {
          const merged = mergePlan(payload.items, tasks, payload.date);

          merged.forEach(function (item, index) {
            const task = tasks.find(function (entry) {
              return entry.taskId === item.id;
            });

            task.hour = item.hour;
            task.order = index + 1;
          });
        }
      });

      return tasks;
    }

    async function enqueue(payload, label, captured) {
      if (!storageReady || legacyBlocked) {
        throw new Error('端末への保存が準備できていません。');
      }

      const context = captured || contextFor(payload, state.snapshot);
      const id = uuid();

      await updateState(function (saved) {
        const data = clone(payload);
        data.requestId = id;

        saved.transitions.forEach(function (entry) {
          if (context.causes.indexOf(entry.id) >= 0) {
            advance(data, entry.transition);
          }
        });

        saved.sequence++;

        saved.jobs.push({
          id: id,
          sequence: saved.sequence,
          payload: data,
          label: label,
          keys: context.keys,
          causes: context.causes,
          state: 'saved',
          frozen: false,
          note: ''
        });
      });

      pump(true);
    }

    function readyJob(saved) {
      const ids = new Set(saved.jobs.map(function (job) {
        return job.id;
      }));

      return saved.jobs.slice().sort(function (a, b) {
        return a.sequence - b.sequence;
      }).find(function (job) {
        return ['saved', 'unknown', 'sending'].indexOf(job.state) >= 0 &&
          !job.causes.some(function (id) {
            return ids.has(id);
          });
      });
    }

    async function pump(force) {
      if (
        pumping ||
        !storageReady ||
        legacyBlocked ||
        !navigator.onLine ||
        !configured() ||
        (!force && Date.now() < nextTry)
      ) {
        return;
      }

      pumping = true;
      readSequence++;
      let ownsLease = false;
      let renewal = null;
      let changed = false;

      try {
        ownsLease = await lease('claim');

        if (!ownsLease) {
          return;
        }

        renewal = setInterval(function () {
          lease('claim').catch(function () {
            // 次の送信前に再確認する。
          });
        }, 10000);

        while (navigator.onLine) {
          if (!await lease('claim')) {
            break;
          }

          state = await readState();
          const candidateJob = readyJob(state);

          if (!candidateJob) {
            break;
          }

          let job;

          await updateState(function (saved) {
            const current = saved.jobs.find(function (entry) {
              return entry.id === candidateJob.id;
            });

            if (!current) {
              return;
            }

            if (
              !current.frozen &&
              current.payload.action === 'order' &&
              saved.snapshot
            ) {
              current.payload.items = mergePlan(
                current.payload.items,
                saved.snapshot.tasks,
                current.payload.date
              );
            }

            current.frozen = true;
            current.state = 'sending';
            current.note = '送信結果を確認しています。';
            job = clone(current);
          });

          if (!job) {
            continue;
          }

          try {
            const result = await api(job.payload);

            if (result.ok) {
              await updateState(function (saved) {
                const exists = saved.jobs.some(function (entry) {
                  return entry.id === job.id;
                });

                if (!exists) {
                  return;
                }

                saved.jobs.forEach(function (entry) {
                  if (
                    entry.id !== job.id &&
                    !entry.frozen &&
                    entry.causes.indexOf(job.id) >= 0
                  ) {
                    advance(entry.payload, result.transition);
                  }
                });

                saved.jobs = saved.jobs.filter(function (entry) {
                  return entry.id !== job.id;
                });

                saved.transitions.push({
                  id: job.id,
                  transition: result.transition
                });

                saved.transitions = saved.transitions.slice(-100);
                saved.snapshot = result.snapshot;
              });

              changed = true;
              failures = 0;
              nextTry = 0;
              notify(result.message || '保存しました。');
              continue;
            }

            const conflict = result.status === 'conflict';
            const blocked = result.status === 'invalid' ||
              result.status === 'indeterminate';

            await updateState(function (saved) {
              const current = saved.jobs.find(function (entry) {
                return entry.id === job.id;
              });

              if (!current) {
                return;
              }

              current.state = conflict ? 'conflict' : blocked ? 'blocked' : 'unknown';
              current.note = result.message || '後で再試行します。';

              if (result.snapshot) {
                saved.snapshot = result.snapshot;
              }
            });

            if (conflict || blocked) {
              continue;
            }

            throw new Error(result.message || '送信を確認できませんでした。');
          } catch (error) {
            failures++;
            nextTry = Date.now() + Math.min(
              300000,
              5000 * Math.pow(2, Math.min(failures, 6))
            );

            await updateState(function (saved) {
              const current = saved.jobs.find(function (entry) {
                return entry.id === job.id;
              });

              if (
                current &&
                current.state !== 'conflict' &&
                current.state !== 'blocked'
              ) {
                current.state = 'unknown';
                current.note =
                  '通信を確認できません。未反映とは限りません。同じ受付番号で再確認します。';
              }
            });

            break;
          }
        }
      } catch (error) {
        notify('端末への保存を確認できません。データは消さずに、画面を開き直してください。', true);
      } finally {
        if (renewal) {
          clearInterval(renewal);
        }

        if (ownsLease) {
          await lease('release').catch(function () {
            return null;
          });
        }

        pumping = false;
        renderStatus();

        if (changed && page === 'history') {
          loadHistory(false);
        }
      }
    }

    /* ---------- 共通表示 ---------- */

    function renderStatus() {
      const pending = state.jobs.length;
      const conflict = state.jobs.some(function (job) {
        return job.state === 'conflict' || job.state === 'blocked';
      });

      let text = navigator.onLine ? '通信あり' : '通信なし';

      if (!storageReady) {
        text += '／端末保存を準備中';
      } else if (legacyBlocked) {
        text += '／旧画面の未送信を先に確認してください';
      } else if (conflict) {
        text += '／確認が必要／未送信 ' + pending + ' 件';
      } else if (pending) {
        text += '／未送信 ' + pending + ' 件';
      } else if (state.snapshot) {
        text += '／保存済み';
      } else {
        text += '／未取得';
      }

      if (refreshing) {
        text += '／読み込み中';
      }

      $('status').textContent = text;
      $('add').disabled = !storageReady || legacyBlocked;
      $('reload').disabled = !storageReady || legacyBlocked || refreshing;
    }

    function renderOutbox() {
      const container = $('outbox-items');
      container.replaceChildren();
      $('outbox').hidden = !state.jobs.length;
      $('outbox-summary').textContent = '未送信 ' + state.jobs.length + ' 件';

      state.jobs.forEach(function (job) {
        const row = make('div', null, 'job');
        row.appendChild(make('div', job.label, 'job-title'));
        row.appendChild(make('div', job.note || '端末に保存済みです。', 'sub'));

        if (job.state === 'conflict') {
          row.appendChild(button('確認する', function () {
            openConflict(job.id);
          }));
        } else if (job.state !== 'blocked') {
          row.appendChild(button('いま送る', function () {
            nextTry = 0;
            pump(true);
          }));
        } else {
          row.appendChild(make(
            'div',
            'この操作は自動反映を止めています。状態をコピーして確認してください。',
            'sub error'
          ));
        }

        container.appendChild(row);
      });

      if (state.jobs.some(function (job) {
        return job.state === 'conflict' || job.state === 'blocked';
      })) {
        $('outbox').open = true;
      }
    }

    function render() {
      renderStatus();
      renderOutbox();

      if (drag) {
        return;
      }

      document.querySelectorAll('nav [data-page]').forEach(function (element) {
        element.classList.toggle('active', element.dataset.page === page);
      });

      const content = $('content');
      content.replaceChildren();

      if (!state.snapshot) {
        content.appendChild(make('h2', '接続の準備'));
        content.appendChild(make(
          'p',
          configured()
            ? '通信できる状態で「最新を取得」を押してください。'
            : '「設定」で接続先と合い言葉を保存してください。'
        ));
        return;
      }

      if (page === 'plan') {
        renderPlan(content);
      } else if (page === 'tasks') {
        renderTasks(content);
      } else if (page === 'periodic') {
        renderPeriodic(content);
      } else {
        renderHistory(content);
      }
    }

    /* ---------- 1日の計画 ---------- */

    function renderPlan(content) {
      content.appendChild(make('h2', '1日の計画'));

      const tools = make('div', null, 'toolbar');
      const date = make('input');
      date.type = 'date';
      date.value = selectedDate;

      date.addEventListener('change', function () {
        if (date.value) {
          selectedDate = date.value;
          render();
        }
      });

      tools.append(
        button('前日', function () {
          selectedDate = dateShift(selectedDate, -1);
          render();
        }),
        date,
        button('今日', function () {
          selectedDate = japanDate();
          render();
        }),
        button('翌日', function () {
          selectedDate = dateShift(selectedDate, 1);
          render();
        })
      );

      content.appendChild(tools);
      content.appendChild(make(
        'p',
        '左の丸＝完了／右の≡を動かす＝配置して自動保存。時間帯は目安です。',
        'sub'
      ));

      if (!navigator.onLine) {
        content.appendChild(make(
          'p',
          '前回取得した内容と、この端末の未送信を表示しています。',
          'sub'
        ));
      }

      const tasks = effectiveTasks().filter(function (task) {
        return task.date === selectedDate;
      }).sort(compareTasks);

      content.appendChild(make(
        'div',
        tasks.length ? tasks.length + ' 件' : '取得済みの一覧に、この日のタスクはありません。',
        'sub'
      ));

      const timeline = make('div', null, 'timeline');
      timeline.id = 'timeline';

      [null].concat(Array.from({
        length: 15
      }, function (_, index) {
        return index + 8;
      })).forEach(function (hour) {
        const section = make('section', null, 'slot');
        section.dataset.hour = hour === null ? '' : String(hour);
        section.appendChild(make('div', hourLabel(hour), 'slot-label'));

        const list = make('ul', null, 'slot-list');

        tasks.filter(function (task) {
          return task.hour === hour;
        }).forEach(function (task) {
          const row = make('li', null, 'task');
          row.dataset.id = task.taskId;

          const complete = button('', function () {
            if (
              drag ||
              Date.now() < suppressClickUntil ||
              !confirm('「' + task.title + '」を完了にしますか。')
            ) {
              return;
            }

            const original = taskById(state.snapshot, task.taskId);

            if (!original) {
              return;
            }

            enqueue({
              action: 'done',
              taskId: task.taskId,
              expectedTask: original.version
            }, '完了：' + task.title).catch(function (error) {
              notify(error.message, true);
            });
          }, 'hit');

          complete.dataset.act = 'done';
          complete.setAttribute('aria-label', task.title + 'を完了');
          complete.appendChild(make('span', null, 'circle'));

          const grip = make('button', '≡', 'grip');
          grip.type = 'button';
          grip.dataset.act = 'grip';
          grip.setAttribute('aria-label', task.title + 'を移動');

          row.append(complete, make('span', task.title, 'ttl'), grip);
          list.appendChild(row);
        });

        section.appendChild(list);
        timeline.appendChild(section);
      });

      timeline.appendChild(make('div', '23:00', 'timeline-end'));

      const line = make('div', null, 'now-line');
      line.id = 'now-line';
      line.hidden = true;
      line.appendChild(make('span'));
      timeline.appendChild(line);

      content.appendChild(timeline);
      updateNow();
    }

    function visibleItems() {
      return Array.from(document.querySelectorAll('#timeline .task')).map(function (row) {
        const value = row.closest('.slot').dataset.hour;

        return {
          id: row.dataset.id,
          hour: value === '' ? null : Number(value)
        };
      });
    }

    function clearHold() {
      if (holdTimer) {
        clearTimeout(holdTimer);
      }

      holdTimer = null;
      candidate = null;
    }

    function startDrag(row, id) {
      if (!state.snapshot || drag || !document.contains(row)) {
        return;
      }

      clearHold();

      const payload = {
        action: 'order',
        date: selectedDate,
        expectedDay: dayVersion(state.snapshot, selectedDate)
      };

      dragContext = {
        payload: payload,
        context: contextFor(payload, state.snapshot)
      };

      drag = row;
      pointerId = id;
      row.classList.add('dragging');

      try {
        $('content').setPointerCapture(id);
      } catch (error) {
        // 終了は画面全体でも受け取る。
      }

      if (navigator.vibrate) {
        navigator.vibrate(15);
      }
    }

    function stopAuto() {
      if (autoTimer) {
        clearInterval(autoTimer);
      }

      autoTimer = null;
      autoDirection = 0;
    }

    function placeDrag(x, y) {
      const timeline = $('timeline');

      if (!drag || !timeline) {
        return;
      }

      const boundary = timeline.getBoundingClientRect();

      if (x < boundary.left || x > boundary.right) {
        return;
      }

      const slot = Array.from(timeline.querySelectorAll('.slot')).find(function (section) {
        const rect = section.getBoundingClientRect();
        return y >= rect.top && y < rect.bottom;
      });

      if (!slot) {
        return;
      }

      const list = slot.querySelector('.slot-list');
      const before = Array.from(list.querySelectorAll('.task')).find(function (row) {
        if (row === drag) {
          return false;
        }

        const rect = row.getBoundingClientRect();
        return y < rect.top + rect.height / 2;
      }) || null;

      if (
        drag.parentNode !== list ||
        (before && drag.nextElementSibling !== before) ||
        (!before && drag.nextElementSibling)
      ) {
        list.insertBefore(drag, before);
        updateNow();
      }
    }

    function autoScroll(y) {
      autoDirection = y < 85
        ? -10
        : y > window.innerHeight - 100
          ? 10
          : 0;

      if (!autoDirection) {
        stopAuto();
        return;
      }

      if (!autoTimer) {
        autoTimer = setInterval(function () {
          window.scrollBy(0, autoDirection);
          placeDrag(pointerX, pointerY);
        }, 16);
      }
    }

    async function endDrag(cancelled) {
      clearHold();

      if (!drag) {
        pointerId = null;
        return;
      }

      const items = visibleItems();
      const captured = dragContext;
      const id = pointerId;

      drag.classList.remove('dragging');
      drag = null;
      dragContext = null;
      pointerId = null;
      suppressClickUntil = Date.now() + 500;
      stopAuto();

      try {
        if ($('content').hasPointerCapture(id)) {
          $('content').releasePointerCapture(id);
        }
      } catch (error) {
        // 指が離れた後はそのまま終了する。
      }

      if (cancelled) {
        render();
        return;
      }

      try {
        const payload = Object.assign({}, captured.payload, {
          items: items
        });

        await enqueue(
          payload,
          payload.date + ' の時間帯・並び順',
          captured.context
        );
      } catch (error) {
        notify('保存できなかったため、移動前の表示に戻しました。', true);
        render();
      }
    }

    $('content').addEventListener('pointerdown', function (event) {
      if (
        page !== 'plan' ||
        event.isPrimary === false ||
        (event.pointerType === 'mouse' && event.button !== 0)
      ) {
        return;
      }

      const row = event.target.closest('.task');

      if (!row || event.target.closest('[data-act="done"]')) {
        return;
      }

      clearHold();
      pointerId = event.pointerId;
      startX = event.clientX;
      startY = event.clientY;
      pointerX = event.clientX;
      pointerY = event.clientY;

      if (event.target.closest('[data-act="grip"]')) {
        event.preventDefault();
        startDrag(row, event.pointerId);
        return;
      }

      candidate = row;
      const heldId = event.pointerId;

      holdTimer = setTimeout(function () {
        if (candidate === row) {
          startDrag(row, heldId);
        }
      }, 600);
    });

    document.addEventListener('pointermove', function (event) {
      if (pointerId !== null && event.pointerId !== pointerId) {
        return;
      }

      if (!drag) {
        if (
          holdTimer &&
          (
            Math.abs(event.clientX - startX) > 8 ||
            Math.abs(event.clientY - startY) > 8
          )
        ) {
          clearHold();
        }

        return;
      }

      if (event.cancelable) {
        event.preventDefault();
      }

      pointerX = event.clientX;
      pointerY = event.clientY;
      placeDrag(pointerX, pointerY);
      autoScroll(pointerY);
    }, {
      passive: false
    });

    document.addEventListener('touchmove', function (event) {
      if (drag && event.cancelable) {
        event.preventDefault();
      }
    }, {
      passive: false
    });

    document.addEventListener('pointerup', function (event) {
      if (pointerId === null || pointerId === event.pointerId) {
        endDrag(false);
      }
    });

    document.addEventListener('pointercancel', function (event) {
      if (pointerId === null || pointerId === event.pointerId) {
        endDrag(true);
      }
    });

    function updateNow() {
      const line = $('now-line');
      const timeline = $('timeline');

      if (!line || !timeline) {
        return;
      }

      const now = new Date(Date.now() + 9 * 3600000);
      const hour = now.getUTCHours();
      const minute = now.getUTCMinutes();

      const slot = timeline.querySelector(
        '.slot[data-hour="' + hour + '"]'
      );

      if (
        selectedDate !== now.toISOString().slice(0, 10) ||
        hour < 8 ||
        hour >= 23 ||
        !slot
      ) {
        line.hidden = true;
        return;
      }

      line.style.top =
        slot.offsetTop + slot.offsetHeight * minute / 60 + 'px';

      line.firstElementChild.textContent =
        String(hour).padStart(2, '0') + ':' +
        String(minute).padStart(2, '0');

      line.hidden = false;
    }

    /* ---------- タスク一覧・編集 ---------- */

    function filterTask(task) {
      const today = japanDate();
      const date = new Date(today + 'T12:00:00Z');
      const weekEnd = dateShift(today, (7 - date.getUTCDay()) % 7);

      switch (taskFilter) {
        case 'today':
          return task.date === today;
        case 'date':
          return task.date === filterDate;
        case 'week':
          return !!task.date && task.date >= today && task.date <= weekEnd;
        case 'hasdue':
          return !!task.due;
        case 'overdue':
          return !!task.due && task.due < today;
        case 'nodate':
          return !task.date;
        case 'noboth':
          return !task.date && !task.due;
        default:
          return true;
      }
    }

    function taskInfo(task) {
      return '期限：' + (task.due || '未設定') +
        ' ／ 実行日：' + (task.date || '未設定') +
        ' ／ ' + hourLabel(task.hour);
    }

    function renderTasks(content) {
      content.appendChild(make('h2', 'タスク一覧'));

      const tools = make('div', null, 'toolbar task-filters');
      const filterField = make('label', null, 'filter-field');

    /* ---------- 食い違いの確認 ---------- */

    function relatedJobs(rootId) {
      const ids = new Set([rootId]);
      let changed = true;

      while (changed) {
        changed = false;

        state.jobs.forEach(function (job) {
          if (
            !ids.has(job.id) &&
            job.causes.some(function (id) {
              return ids.has(id);
            })
          ) {
            ids.add(job.id);
            changed = true;
          }
        });
      }

      return state.jobs.filter(function (job) {
        return ids.has(job.id);
      }).sort(function (a, b) {
        return a.sequence - b.sequence;
      });
    }

    function describePayload(payload, local) {
      const snapshot = state.snapshot;

      if (payload.action === 'order') {
        const tasks = local
          ? effectiveTasks()
          : snapshot.tasks;

        return tasks.filter(function (task) {
          return task.date === payload.date;
        }).sort(compareTasks).map(function (task) {
          return hourLabel(task.hour) + '：' + task.title;
        }).join('\n') || 'この日のタスクはありません。';
      }

      if (payload.taskId) {
        const task = taskById(snapshot, payload.taskId);

        if (!local) {
          return task
            ? task.title + '\n' + taskInfo(task)
            : '現在のタスク一覧にはありません。';
        }

        if (payload.action === 'done') {
          return 'このタスクを完了にする';
        }

        return payload.title +
          '\n期限：' + (payload.due || '未設定') +
          '\n実行日：' + (payload.date || '未設定');
      }

      if (payload.action === 'periodicSave') {
        const item = snapshot.periodic.items.find(function (entry) {
          return entry.row === payload.row;
        });

        if (!local) {
          return item
            ? item.name + '\n' + item.freq + '\n次回：' + (item.next || '未設定')
            : '既存の対象はありません。';
        }

        return payload.name + '\n' + payload.freq +
          '\n次回：' + (payload.next || '未設定');
      }

      return local
        ? '確認した操作を実行する'
        : '最新の内容を確認してから、操作し直してください。';
    }

    async function openConflict(id) {
      await refresh();

      const job = state.jobs.find(function (entry) {
        return entry.id === id;
      });

      if (!job || job.state !== 'conflict') {
        return;
      }

      conflictId = id;
      const related = relatedJobs(id);

      $('conflict-note').textContent =
        job.note + '\n関連する未送信 ' + related.length +
        ' 件が対象です。保存済みを選ぶと、この端末の対象変更を取り消します。';

      $('conflict-server').replaceChildren(
        make('p', describePayload(job.payload, false))
      );

      $('conflict-local').replaceChildren(
        make('p', describePayload(job.payload, true)),
        make('p', related.map(function (entry) {
          return '・' + entry.label;
        }).join('\n'))
      );

      const canApply = ['order', 'edit', 'done', 'periodicSave']
        .indexOf(job.payload.action) >= 0;

      $('conflict-apply').hidden = !canApply;

      if (!canApply) {
        $('conflict-note').textContent +=
          '\nこの操作は、保存済みを使った後で下見・確認からやり直してください。';
      }

      $('conflict-dialog').showModal();
    }

    async function resolveConflict(useLocal) {
      const root = state.jobs.find(function (job) {
        return job.id === conflictId;
      });

      if (!root || root.state !== 'conflict') {
        $('conflict-dialog').close();
        return;
      }

      const related = relatedJobs(root.id);
      const ids = new Set(related.map(function (job) {
        return job.id;
      }));

      if (related.some(function (job) {
        return job.id !== root.id && job.frozen;
      })) {
        notify('関連する送信結果を先に確認しています。少し待って開き直してください。', true);
        return;
      }

      try {
        await updateState(function (saved) {
          if (!saved.jobs.some(function (job) {
            return job.id === root.id && job.state === 'conflict';
          })) {
            return;
          }

          if (!useLocal) {
            saved.jobs = saved.jobs.filter(function (job) {
              return !ids.has(job.id);
            });

            return;
          }

          const replacements = new Map();

          related.forEach(function (job) {
            replacements.set(job.id, uuid());
          });

          saved.jobs.forEach(function (job) {
            if (!ids.has(job.id)) {
              return;
            }

            const payload = job.payload;
            const newId = replacements.get(job.id);
            job.id = newId;
            payload.requestId = newId;
            job.frozen = false;
            job.state = 'saved';
            job.note = '';
            job.causes = job.causes.map(function (id) {
              return replacements.get(id) || id;
            });

            if (payload.action === 'order') {
              payload.expectedDay = dayVersion(saved.snapshot, payload.date);
              payload.items = mergePlan(
                payload.items,
                saved.snapshot.tasks,
                payload.date
              );
            }

            if (payload.taskId) {
              const task = taskById(saved.snapshot, payload.taskId);
              payload.expectedTask = task ? task.version : '';
            }

            if (payload.expectedPeriodic) {
              payload.expectedPeriodic = saved.snapshot.periodic.version;
            }

            if (payload.expectedUndo) {
              payload.expectedUndo = saved.snapshot.undo.version;
            }
          });
        });

        $('conflict-dialog').close();
        notify(useLocal
          ? '確認した変更を送信待ちに保存しました。'
          : '保存済みの内容を使います。');

        pump(true);
      } catch (error) {
        notify(error.message, true);
      }
    }

    function workerVersion() {
      return new Promise(function (resolve) {
        if (
          !navigator.serviceWorker ||
          !navigator.serviceWorker.controller ||
          !window.MessageChannel
        ) {
          resolve('確認できません');
          return;
        }

        const message = new MessageChannel();

        const timer = setTimeout(function () {
          message.port1.close();
          resolve('確認できません');
        }, 2000);

        message.port1.onmessage = function (event) {
          clearTimeout(timer);
          message.port1.close();
          resolve(event.data.cacheName || '確認できません');
        };

        navigator.serviceWorker.controller.postMessage({
          type: 'TASK_VERSION'
        }, [message.port2]);
      });
    }

    $('copy').addEventListener('click', async function () {
      const text = [
        '画面：' + VERSION,
        '保存先の版：' + (state.snapshot ? state.snapshot.app : '未取得'),
        'オフライン保存：' + await workerVersion(),
        '通信：' + (navigator.onLine ? 'あり' : 'なし'),
        '未送信：' + state.jobs.length + ' 件',
        '確認が必要：' + state.jobs.filter(function (job) {
          return job.state === 'conflict' || job.state === 'blocked';
        }).length + ' 件',
        'タスク：' + (state.snapshot ? state.snapshot.tasks.length : 0) + ' 件',
        '定期タスク：' + (state.snapshot ? state.snapshot.periodic.items.length : 0) + ' 件'
      ].join('\n');

      try {
        await navigator.clipboard.writeText(text);
        alert('コピーしました。');
      } catch (error) {
        prompt('この内容をコピーしてください。', text);
      }
    });

    /* ---------- 操作・起動 ---------- */

    document.querySelectorAll('nav [data-page]').forEach(function (element) {
      element.addEventListener('click', function () {
        if (drag) {
          return;
        }

        page = element.dataset.page;
        render();

        if (page === 'history') {
          loadHistory(false);
        }
      });
    });

    $('add').addEventListener('click', openAdd);
    $('settings').addEventListener('click', openSettings);

    $('reload').addEventListener('click', async function () {
      nextTry = 0;
      await pump(true);
      await refresh();

      if (page === 'history') {
        loadHistory(false);
      }
    });

    window.addEventListener('online', async function () {
      renderStatus();
      nextTry = 0;
      await pump(true);
      refresh();
    });

    window.addEventListener('offline', render);

    window.addEventListener('resize', updateNow);

    document.addEventListener('visibilitychange', async function () {
      if (document.hidden) {
        if (drag || holdTimer) {
          endDrag(true);
        }

        return;
      }

      if (storageReady) {
        state = await readState();
        render();
        await pump(true);
        refresh();
      }
    });

    window.addEventListener('blur', function () {
      if (drag || holdTimer) {
        endDrag(true);
      }
    });

    setInterval(function () {
      pump(false);
    }, 15000);

    setInterval(updateNow, 60000);

    async function start() {
      try {
        db = await openDatabase();
        state = await readState();
        storageReady = true;

        const oldCount = await oldPendingCount();

        if (oldCount) {
          legacyBlocked = true;

          notify(
            '以前の画面に未送信が ' + oldCount +
            ' 件残っています。記録は消していません。旧版で送信を完了してから切り替えてください。',
            true
          );
        }

        if ('BroadcastChannel' in window) {
          channel = new BroadcastChannel('task-unified-state');

          channel.onmessage = async function () {
            state = await readState();
            render();
          };
        }

        render();

        if (!legacyBlocked && configured()) {
          await pump(true);
          await refresh();
        } else if (!configured()) {
          notify('PCで初めて開いた場合は、「設定」に接続先と合い言葉を保存してください。');
        }
      } catch (error) {
        storageReady = false;
        notify(
          '端末への保存を準備できないため、変更操作を止めています。\n' +
          String(error.message || error),
          true
        );
        renderStatus();
      }
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', {
        updateViaCache: 'none'
      }).then(function (registration) {
        return registration.update();
      }).catch(function () {
        notify('オフライン用の画面を更新できませんでした。通信できる状態で開き直してください。', true);
      });
    }

    start();
  </script>
</body>
</html>
