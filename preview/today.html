<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a73e8">
  <title>今日の並べ替え</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./icon-check-32.png">
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      color: #202833;
      background: #f6f8fb;
      font-family: -apple-system, system-ui, sans-serif;
    }

    header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
    }

    .sub {
      color: #46576a;
      font-size: 14px;
    }

    .status {
      margin-bottom: 12px;
      color: #725619;
      font-size: 14px;
      line-height: 1.5;
    }

    .notice {
      margin: 10px 0 14px;
      padding: 10px 12px;
      border: 1px solid #cbdcec;
      border-radius: 8px;
      color: #234f77;
      background: #edf5ff;
      font-size: 14px;
      line-height: 1.6;
    }

    .notice.error {
      border-color: #e7bdba;
      color: #8f211c;
      background: #fff1ef;
    }

    .detail-text {
      margin-top: 6px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    button {
      min-height: 42px;
      padding: 9px 14px;
      border: 1px solid #ccd4de;
      border-radius: 8px;
      color: #263445;
      background: #fff;
      font: inherit;
      cursor: pointer;
    }

    button.primary {
      min-width: 96px;
      border-color: #1a73e8;
      color: #fff;
      background: #1a73e8;
    }

    button:disabled {
      opacity: .5;
      cursor: default;
    }

    .bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .bar .grow {
      flex: 1;
    }

    ol {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    li.row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
      padding: 10px 12px;
      border: 1px solid #d5dde7;
      border-radius: 9px;
      background: #fff;
    }

    li.row[draggable="true"] {
      cursor: grab;
    }

    li.row.selected {
      border-color: #1a73e8;
      outline: 2px solid #c5dcff;
    }

    li.row.dragging {
      opacity: .45;
    }

    li.row.drop-before {
      box-shadow: 0 -3px 0 #1a73e8;
    }

    li.row.drop-after {
      box-shadow: 0 3px 0 #1a73e8;
    }

    .hour {
      flex: none;
      min-width: 64px;
      padding: 2px 8px;
      border-radius: 6px;
      color: #234f77;
      background: #edf5ff;
      font-size: 13px;
      text-align: center;
    }

    .title {
      flex: 1;
      min-width: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .pending {
      color: #725619;
      font-size: 12px;
    }

    .move {
      display: flex;
      gap: 4px;
    }

    .move button {
      min-height: 34px;
      padding: 4px 10px;
    }

    .empty {
      padding: 24px 0;
      color: #46576a;
    }

    .hint {
      margin-top: 14px;
      color: #46576a;
      font-size: 13px;
      line-height: 1.7;
    }

    footer {
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid #d8dfe6;
      font-size: 14px;
    }

    a {
      color: #1559ad;
    }
  </style>
</head>
<body>
  <header>
    <h1>今日の並べ替え</h1>
    <span id="date-label" class="sub"></span>
    <span id="count" class="sub"></span>
  </header>

  <div id="status" class="status" aria-live="polite">準備中</div>

  <div id="notice" class="notice" hidden aria-live="polite">
    <span id="notice-text"></span>
    <div id="notice-detail" class="detail-text" hidden></div>
  </div>

  <div class="bar">
    <button id="save" type="button" class="primary" disabled>保存</button>
    <button id="discard" type="button" disabled>変更を戻す</button>
    <button id="reload" type="button">最新にする</button>
    <span class="grow"></span>
    <span id="pending" class="sub"></span>
  </div>

  <ol id="list" aria-label="今日のタスク"></ol>

  <p class="hint">
    マウスでドラッグするか、「上へ」「下へ」で動かします。キーでは ↓ / J・↑ / K で選び、Alt + ↑ / Alt + ↓ で動かし、Enter で保存、Esc で変更を戻します。
    時間が前後と食い違う位置へ動かすと、隣のタスクの時間に合わせます。
  </p>

  <footer>
    <a href="./index.html" target="_blank" rel="noopener">一覧を開く</a>
  </footer>

  <div id="announce" class="sub" aria-live="polite" style="position:absolute;left:-9999px"></div>

  <script src="./task-core.js?v=4.17.0"></script>
  <script>
    (function () {
      'use strict';

      function $(id) {
        return document.getElementById(id);
      }

      if (!window.TaskCore || TaskCore.VERSION !== 'v4.8') {
        $('status').textContent =
          '画面の準備ができません。task-core.js を置いてから開き直してください。';
        return;
      }

      let client = null;
      let today = japanDate();
      let work = null;       // 並べ替え中の順（{id, hour}）。変更がなければ null
      let selectedId = '';
      let dragId = '';
      let busy = false;
      let reading = false;

      function japanDate() {
        return new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10);
      }

      function hourLabel(hour) {
        return hour == null ? '時間未定' : hour + '時';
      }

      function make(tag, text, className) {
        const node = document.createElement(tag);

        if (text != null) {
          node.textContent = text;
        }

        if (className) {
          node.className = className;
        }

        return node;
      }

      function notify(text, error, detail) {
        $('notice').hidden = !text;
        $('notice').className = 'notice' + (error ? ' error' : '');
        $('notice-text').textContent = text || '';
        $('notice-detail').hidden = !detail;
        $('notice-detail').textContent = detail || '';
      }

      function features() {
        return client.state.snapshot && client.state.snapshot.features || {};
      }

      function supported() {
        return client.latestSupported() &&
          features().planMove === true &&
          features().planMoveProtocol === TaskCore.PLAN_PROTOCOL;
      }

      // 今日の並べ替えに出すタスク（保存待ちの追加分は除く）を計画の順で返す
      function todayTasks() {
        return client.effectiveTasks().filter(function (task) {
          return task.date === today && !task.localOnly;
        }).sort(TaskCore.compareTasks);
      }

      function baseItems(tasks) {
        return tasks.map(function (task) {
          return { id: task.taskId, hour: task.hour };
        });
      }

      // 並べ替え中でなければ保存先の順を使う。並べ替え中は、消えたタスクを除き、増えたタスクを末尾に足す
      function currentItems(tasks) {
        if (!work) {
          return baseItems(tasks);
        }

        const ids = new Set(tasks.map(function (task) {
          return task.taskId;
        }));

        const kept = work.filter(function (item) {
          return ids.has(item.id);
        });

        const known = new Set(kept.map(function (item) {
          return item.id;
        }));

        tasks.forEach(function (task) {
          if (!known.has(task.taskId)) {
            kept.push({ id: task.taskId, hour: task.hour });
          }
        });

        work = kept;
        return kept;
      }

      function sameOrder(a, b) {
        return JSON.stringify(a) === JSON.stringify(b);
      }

      function render() {
        if (!client.ready) {
          return;
        }

        const tasks = todayTasks();
        const items = currentItems(tasks);
        const byId = new Map(tasks.map(function (task) {
          return [task.taskId, task];
        }));

        if (work && sameOrder(work, baseItems(tasks))) {
          work = null;
        }

        const dirty = !!work;
        const list = $('list');
        list.textContent = '';

        $('date-label').textContent = today.replace(/^(\d+)-0?(\d+)-0?(\d+)$/, '$1年$2月$3日');
        $('count').textContent = tasks.length + '件';

        if (!tasks.length) {
          list.appendChild(make('li', '今日のタスクはありません。', 'empty'));
        }

        items.forEach(function (item, index) {
          const task = byId.get(item.id);
          const row = make('li', null, 'row' + (item.id === selectedId ? ' selected' : ''));
          row.dataset.id = item.id;
          row.draggable = !busy;

          row.appendChild(make('span', hourLabel(item.hour), 'hour'));

          const title = make('div', null, 'title');
          title.appendChild(make('div', task.title));

          if (task.pendingText) {
            title.appendChild(make('div', task.pendingText, 'pending'));
          }

          row.appendChild(title);

          const move = make('div', null, 'move');
          const up = make('button', '上へ');
          up.type = 'button';
          up.disabled = busy || index === 0;
          up.addEventListener('click', function () {
            moveBy(item.id, -1);
          });

          const down = make('button', '下へ');
          down.type = 'button';
          down.disabled = busy || index === items.length - 1;
          down.addEventListener('click', function () {
            moveBy(item.id, 1);
          });

          move.append(up, down);
          row.appendChild(move);

          row.addEventListener('click', function () {
            selectedId = item.id;
            render();
          });

          row.addEventListener('dragstart', function (event) {
            dragId = item.id;
            selectedId = item.id;
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('text/plain', item.id);
            row.classList.add('dragging');
          });

          row.addEventListener('dragend', function () {
            dragId = '';
            clearDrop();
            render();
          });

          row.addEventListener('dragover', function (event) {
            if (!dragId || dragId === item.id) {
              return;
            }

            event.preventDefault();
            clearDrop();
            const box = row.getBoundingClientRect();
            row.classList.add(
              event.clientY < box.top + box.height / 2 ? 'drop-before' : 'drop-after'
            );
          });

          row.addEventListener('drop', function (event) {
            if (!dragId || dragId === item.id) {
              return;
            }

            event.preventDefault();
            const box = row.getBoundingClientRect();
            const after = event.clientY >= box.top + box.height / 2;
            moveTo(dragId, item.id, after);
            dragId = '';
          });

          list.appendChild(row);
        });

        $('save').disabled = busy || !dirty || !supported();
        $('discard').disabled = busy || !dirty;
        $('reload').disabled = reading || dirty;

        const jobs = client.state.jobs.length;
        $('pending').textContent = jobs ? '送信待ち ' + jobs + '件' : '';

        let status = '';

        if (!client.configured()) {
          status = '接続先が未設定です。「一覧を開く」から「設定」を開いて入力してください。';
        } else if (!client.state.snapshot) {
          status = reading ? '読み込み中' : 'まだ読み込めていません。「最新にする」を押してください。';
        } else if (!supported()) {
          status = '並べ替えを使うには、保存先の更新が必要です。';
        } else if (dirty) {
          status = '並べ替え中です。「保存」で計画に反映します。';
        }

        $('status').textContent = status;
        $('status').hidden = !status;
      }

      function clearDrop() {
        document.querySelectorAll('.drop-before, .drop-after, .dragging').forEach(function (node) {
          node.classList.remove('drop-before', 'drop-after', 'dragging');
        });
      }

      function indexOf(items, id) {
        return items.findIndex(function (item) {
          return item.id === id;
        });
      }

      function apply(next) {
        work = next;
        render();
      }

      function moveBy(id, step) {
        if (busy) {
          return;
        }

        const items = currentItems(todayTasks());
        const from = indexOf(items, id);
        const to = from + step;

        if (from < 0 || to < 0 || to >= items.length) {
          return;
        }

        selectedId = id;
        apply(TaskCore.reorderDay(items, from, to));
        $('announce').textContent = (to + 1) + '番目へ動かしました';
        focusRow(id);
      }

      function moveTo(id, targetId, after) {
        if (busy) {
          return;
        }

        const items = currentItems(todayTasks());
        const from = indexOf(items, id);
        let to = indexOf(items, targetId);

        if (from < 0 || to < 0) {
          return;
        }

        // 取り除いたあとの位置に直す
        if (from < to) {
          to -= 1;
        }

        if (after) {
          to += 1;
        }

        to = Math.max(0, Math.min(items.length - 1, to));

        if (to !== from) {
          apply(TaskCore.reorderDay(items, from, to));
        } else {
          render();
        }
      }

      function focusRow(id) {
        const row = Array.from(document.querySelectorAll('#list .row')).find(function (node) {
          return node.dataset.id === id;
        });

        if (row) {
          row.scrollIntoView({ block: 'nearest' });
        }
      }

      function select(step) {
        const items = currentItems(todayTasks());

        if (!items.length) {
          return;
        }

        const at = indexOf(items, selectedId);
        const next = at < 0 ? (step > 0 ? 0 : items.length - 1)
          : Math.max(0, Math.min(items.length - 1, at + step));

        selectedId = items[next].id;
        render();
        focusRow(selectedId);
      }

      async function save() {
        if (busy || !work || !supported() || !client.state.snapshot) {
          return;
        }

        const snapshot = TaskCore.clone(client.state.snapshot);

        const payload = {
          action: 'order',
          date: today,
          expectedDay: TaskCore.dayVersion(snapshot, today),
          items: work.map(function (item) {
            return { id: item.id, hour: item.hour };
          })
        };

        const context = client.context({
          action: 'order',
          date: today
        }, snapshot);

        busy = true;
        render();

        try {
          await client.enqueue(payload, today + ' の時間帯・並び順', context);
          work = null;
          notify('並び順を送信待ちに入れました。');
          client.pump(true);
        } catch (error) {
          notify('並び順を端末に保存できませんでした', true, String(error.message || error));
        } finally {
          busy = false;
          render();
        }
      }

      function discard() {
        work = null;
        notify('');
        render();
      }

      async function load(forceFull) {
        if (reading || !client.configured()) {
          render();
          return;
        }

        reading = true;
        render();

        try {
          await client.read({
            action: 'load'
          }, {
            forceFull: forceFull || !client.received
          });

          await client.pump(false);
        } catch (error) {
          notify('読み込めませんでした', true, String(error.message || error));
        } finally {
          reading = false;
          render();
        }
      }

      client = TaskCore.create({
        onChange: render,
        onIssue: function (text, detail) {
          notify(text, true, detail);
        }
      });

      $('save').onclick = save;
      $('discard').onclick = discard;
      $('reload').onclick = function () {
        load(true);
      };

      document.addEventListener('keydown', function (event) {
        if (event.defaultPrevented) {
          return;
        }

        const key = String(event.key || '').normalize('NFKC').toLowerCase();

        if (event.isComposing || event.keyCode === 229 || event.metaKey || event.ctrlKey) {
          return;
        }

        if (event.altKey && (key === 'arrowup' || key === 'arrowdown')) {
          if (selectedId) {
            event.preventDefault();
            moveBy(selectedId, key === 'arrowup' ? -1 : 1);
          }

          return;
        }

        if (event.altKey || event.shiftKey) {
          return;
        }

        const target = event.target;

        if (target && /^(INPUT|TEXTAREA|SELECT|BUTTON|A)$/.test(String(target.tagName).toUpperCase())) {
          return;
        }

        if (key === 'arrowdown' || key === 'j') {
          event.preventDefault();
          select(1);
        } else if (key === 'arrowup' || key === 'k') {
          event.preventDefault();
          select(-1);
        } else if (key === 'enter' && work) {
          event.preventDefault();
          save();
        } else if (key === 'escape' && work) {
          event.preventDefault();
          discard();
        }
      });

      document.addEventListener('visibilitychange', function () {
        if (!document.hidden && client.ready) {
          const now = japanDate();

          if (now !== today && !work) {
            today = now;
          }

          client.reloadLocal().then(function () {
            return load(false);
          }).catch(function (error) {
            notify('端末の記録を読み取れません', true, String(error.message || error));
          });
        }
      });

      window.addEventListener('beforeunload', function (event) {
        if (busy || work) {
          event.preventDefault();
          event.returnValue = '';
        }
      });

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js', {
          updateViaCache: 'none'
        }).then(function (registration) {
          return registration.update();
        }).catch(function (error) {
          notify('画面の更新を確認できません', true, String(error.message || error));
        });
      }

      (async function () {
        try {
          await client.start();
          render();
          await load(false);
        } catch (error) {
          notify('端末への保存を準備できません', true, String(error.message || error));
        }
      })();
    })();
  </script>
</body>
</html>
