<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a73e8">
  <title>今日の順番</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./icon-check-32.png">
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      color: #202833;
      background: #f6f8fb;
      font-family: -apple-system, system-ui, sans-serif;
    }

    header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
    }

    .sub {
      color: #46576a;
      font-size: 14px;
    }

    .status {
      margin-bottom: 12px;
      color: #725619;
      font-size: 14px;
      line-height: 1.5;
    }

    .notice {
      margin: 10px 0 14px;
      padding: 10px 12px;
      border: 1px solid #cbdcec;
      border-radius: 8px;
      color: #234f77;
      background: #edf5ff;
      font-size: 14px;
      line-height: 1.6;
    }

    .notice.error {
      border-color: #e7bdba;
      color: #8f211c;
      background: #fff1ef;
    }

    .detail-text {
      margin-top: 6px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    button {
      min-height: 42px;
      padding: 9px 14px;
      border: 1px solid #ccd4de;
      border-radius: 8px;
      color: #263445;
      background: #fff;
      font: inherit;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: default;
    }

    .bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .bar .grow {
      flex: 1;
    }

    .row-title {
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .pending {
      color: #725619;
      font-size: 14px;
    }

    footer {
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid #d8dfe6;
      font-size: 14px;
    }

    a {
      color: #1559ad;
    }
  </style>
</head>
<body>
  <header>
    <h1>今日の順番</h1>
    <span id="date-label" class="sub"></span>
  </header>

  <div id="status" class="status" aria-live="polite">準備中</div>

  <div id="notice" class="notice" hidden aria-live="polite">
    <span id="notice-text"></span>
    <div id="notice-detail" class="detail-text" hidden></div>
  </div>

  <div class="bar">
    <button id="reload" type="button">最新にする</button>
    <span class="grow"></span>
    <span id="pending" class="sub"></span>
  </div>

  <div id="list" aria-label="今日のタスク"></div>

  <footer>
    <a href="./index.html" target="_blank" rel="noopener">一覧を開く</a>
  </footer>

  <script src="./task-core.js?v=4.18.0"></script>
  <script src="./order-list.js?v=4.18.0"></script>
  <script>
    (function () {
      'use strict';

      function $(id) {
        return document.getElementById(id);
      }

      if (!window.TaskCore || TaskCore.VERSION !== 'v4.8' || !window.OrderList) {
        $('status').textContent =
          '画面の準備ができません。task-core.js と order-list.js を置いてから開き直してください。';
        return;
      }

      let client = null;
      let list = null;
      let today = japanDate();
      let reading = false;

      function japanDate() {
        return new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10);
      }

      function make(tag, text, className) {
        const node = document.createElement(tag);

        if (text != null) {
          node.textContent = text;
        }

        if (className) {
          node.className = className;
        }

        return node;
      }

      function notify(text, error, detail) {
        $('notice').hidden = !text;
        $('notice').className = 'notice' + (error ? ' error' : '');
        $('notice-text').textContent = text || '';
        $('notice-detail').hidden = !detail;
        $('notice-detail').textContent = detail || '';
      }

      function features() {
        return client.state.snapshot && client.state.snapshot.features || {};
      }

      function supported() {
        return client.latestSupported() &&
          features().dayOrder === TaskCore.DAY_ORDER_PROTOCOL;
      }

      // 今日のタスク（保存待ちの追加分は除く）を、今日の順番で返す
      function todayTasks() {
        return client.effectiveTasks().filter(function (task) {
          return task.date === today && !task.localOnly;
        }).sort(TaskCore.compareTasks);
      }

      function renderRow(item) {
        const body = make('div', null, 'row-body');
        body.appendChild(make('div', item.task.title, 'row-title'));

        if (item.task.pendingText) {
          body.appendChild(make('div', item.task.pendingText, 'pending'));
        }

        return body;
      }

      function render() {
        if (!client.ready) {
          return;
        }

        $('date-label').textContent = today.replace(/^(\d+)-0?(\d+)-0?(\d+)$/, '$1年$2月$3日');

        list.setItems(todayTasks().map(function (task) {
          return {
            id: task.taskId,
            group: '',
            time: task.hour == null ? '' : task.hour + '時',
            task: task
          };
        }));

        $('reload').disabled = reading || list.isDirty();

        const jobs = client.state.jobs.length;
        $('pending').textContent = jobs ? '送信待ち ' + jobs + '件' : '';

        let status = '';

        if (!client.configured()) {
          status = '接続先が未設定です。「一覧を開く」から「設定」を開いて入力してください。';
        } else if (!client.state.snapshot) {
          status = reading ? '読み込み中' : 'まだ読み込めていません。「最新にする」を押してください。';
        } else if (!supported()) {
          status = '保存先の更新が必要です。';
        }

        $('status').textContent = status;
        $('status').hidden = !status;
      }

      async function save(ids) {
        if (!supported() || !client.state.snapshot) {
          throw new Error('保存先の更新が必要です。');
        }

        const snapshot = TaskCore.clone(client.state.snapshot);

        const payload = {
          action: 'order',
          date: today,
          expectedDay: TaskCore.dayVersion(snapshot, today),
          ids: ids
        };

        const context = client.context({
          action: 'order',
          date: today
        }, snapshot);

        try {
          await client.enqueue(payload, today + ' の順番', context);
          notify('順番を送信待ちに入れました。');
          client.pump(true);
        } catch (error) {
          notify('順番を端末に保存できませんでした', true, String(error.message || error));
          throw error;
        }
      }

      async function load(forceFull) {
        if (reading || !client.configured()) {
          render();
          return;
        }

        reading = true;
        render();

        try {
          await client.read({
            action: 'load'
          }, {
            forceFull: forceFull || !client.received
          });

          await client.pump(false);
        } catch (error) {
          notify('読み込めませんでした', true, String(error.message || error));
        } finally {
          reading = false;
          render();
        }
      }

      /* ---------- Esc で窓を閉じる（拡張機能の小窓のときだけ） ---------- */

      // 拡張機能（bridge.js）へ窓を閉じてもらう。拡張機能の窓でなければ返事が来ないので、何もしない
      function closeWindow() {
        const requestId = 'close-' + Date.now();

        window.postMessage({
          channel: 'task-quick-page-v1',
          type: 'close',
          requestId: requestId
        }, window.location.origin);
      }

      async function escapeClose(event) {
        if (
          event.key !== 'Escape' ||
          event.isComposing ||
          event.keyCode === 229 ||
          event.ctrlKey ||
          event.altKey ||
          event.metaKey ||
          document.querySelector('dialog[open]')
        ) {
          return;
        }

        event.preventDefault();

        if (list.isDirty()) {
          const answer = await list.confirmLeave({
            save: '保存して閉じる',
            discard: '捨てて閉じる',
            stay: '続ける'
          });

          if (answer === 'stay') {
            return;
          }
        }

        closeWindow();
      }

      client = TaskCore.create({
        onChange: render,
        onIssue: function (text, detail) {
          notify(text, true, detail);
        }
      });

      list = OrderList.create({
        renderRow: renderRow,
        onSave: save,
        canEdit: function () {
          return client.ready && supported();
        },
        empty: 'タスクなし'
      });

      list.mount($('list'));

      $('reload').onclick = function () {
        load(true);
      };

      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') {
          escapeClose(event);
          return;
        }

        list.handleKey(event);
      });

      // 戻ってきたとき（拡張機能のキーで前へ出されたときを含む）に最新にする
      function refreshOnReturn() {
        if (!document.hidden && client.ready) {
          const now = japanDate();

          if (now !== today && !list.isDirty()) {
            today = now;
          }

          client.reloadLocal().then(function () {
            return load(false);
          }).catch(function (error) {
            notify('端末の記録を読み取れません', true, String(error.message || error));
          });
        }
      }

      document.addEventListener('visibilitychange', refreshOnReturn);
      window.addEventListener('focus', refreshOnReturn);

      window.addEventListener('beforeunload', function (event) {
        if (list.isDirty()) {
          event.preventDefault();
          event.returnValue = '';
        }
      });

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js', {
          updateViaCache: 'none'
        }).then(function (registration) {
          return registration.update();
        }).catch(function (error) {
          notify('画面の更新を確認できません', true, String(error.message || error));
        });
      }

      (async function () {
        try {
          await client.start();
          render();
          await load(false);
        } catch (error) {
          notify('端末への保存を準備できません', true, String(error.message || error));
        }
      })();
    })();
  </script>
</body>
</html>
