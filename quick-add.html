<!DOCTYPE html>

  <link rel="icon" type="image/png" sizes="32x32" href="./icon-check-32.png">
  <style>
    :root {
      color-scheme: light;
      --accent: #1a73e8;
      --line: #d8dfe6;
    }

<body>
  <header>
    <h1>タスクを追加</h1>
    <span class="version">v4.7</span>
  </header>

  <div id="status" class="status" aria-live="polite">準備中</div>

  <div id="notice" class="notice" hidden aria-live="polite">
    <div class="notice-row">
      <span id="notice-text"></span>
      <button
        id="notice-close"
        class="notice-close"
        type="button"
        aria-label="お知らせを閉じる">×</button>
    </div>
    <details id="notice-details" hidden>
      <summary>詳細</summary>
      <div id="notice-detail-body" class="detail-text"></div>
    </details>
  </div>

  <form id="add-form">
    <fieldset id="fields" disabled>
      <label>
        件名＊
        <input
          id="title"
          name="title"
          type="text"
          maxlength="200"
          required
          autocomplete="off"
          enterkeyhint="done">
      </label>

      <div class="dates">
        <label>
          期限
          <input
            id="due"
            name="due"
            type="date"
            min="0001-01-01"
            max="9999-12-31">
        </label>

        <label>
          実行日
          <input
            id="date"
            name="date"
            type="date"
            min="0001-01-01"
            max="9999-12-31">
        </label>
      </div>

      <div class="actions">
        <button id="submit" type="submit" class="primary">追加</button>
      </div>
    </fieldset>
  </form>

  <details id="outbox" hidden>
    <summary id="outbox-summary">送信待ち</summary>
    <button id="send" type="button">いま送る</button>
    <div id="outbox-items"></div>
  </details>

  <footer>
    <a href="./index.html" target="_blank" rel="noopener">一覧を開く</a>
  </footer>

  <script>
    'use strict';

    const SERVER_VERSION = 'v4.3';
    const DB_NAME = 'taskapp-unified';
    const URL_KEY = 'gasUrl_v1';
    const TOKEN_KEY = 'gasTok_v1';
    const REQUEST_TIMEOUT_MS = 60000;
    const TAB_ID = uuid();
    const EXTENSION_CHANNEL = 'task-quick-extension-v1';

    let db = null;
    let state = emptyState();
    let storageReady = false;
    let legacyBlocked = false;
    let busy = false;
    let channel = null;

    let pumpPromise = null;
    let nextTry = 0;
    let failures = 0;
    let verifiedConnection = '';

    let composing = false;
    let imeGuardUntil = 0;
    let noticeTimer = null;

    function $(id) {
      return document.getElementById(id);
    }

    function uuid() {
      if (window.crypto && window.crypto.randomUUID) {
        return window.crypto.randomUUID();
      }

      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(
        /[xy]/g,
        function (character) {
          const number = Math.random() * 16 | 0;

          return (
            character === 'x'
              ? number
              : number & 3 | 8
          ).toString(16);
        }
      );
    }

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function emptyState() {
      return {
        snapshot: null,
        jobs: [],
        sequence: 0,
        transitions: [],
        savedAt: 0
      };
    }

    function checkedState(value) {
      if (value === undefined || value === null) {
        return emptyState();
      }

      if (
        !Array.isArray(value.jobs) ||
        !Array.isArray(value.transitions) ||
        !Number.isSafeInteger(value.sequence)
      ) {
        throw new Error(
          '端末の記録を読み取れません。データを消さず、通常画面で確認してください。'
        );
      }

      return value;
    }

    function configuration() {
      return {
        url: localStorage.getItem(URL_KEY) || '',
        token: localStorage.getItem(TOKEN_KEY) || ''
      };
    }

    function configured() {
      try {
        const value = configuration();
        return !!value.url && !!value.token;
      } catch (error) {
        return false;
      }
    }

    function notify(text, error, detail) {
      if (noticeTimer) {
        clearTimeout(noticeTimer);
        noticeTimer = null;
      }

      $('notice-text').textContent = text || '';
      $('notice').className = 'notice' + (error ? ' error' : '');
      $('notice').hidden = !text;
      $('notice-detail-body').textContent = detail || '';
      $('notice-details').hidden = !detail;
      $('notice-details').open = false;

      if (text && !error) {
        noticeTimer = setTimeout(function () {
          $('notice').hidden = true;
          noticeTimer = null;
        }, 3500);
      }
    }

    $('notice-close').addEventListener('click', function () {
      notify('');
    });

    function jobStateLabel(job) {
      switch (job.state) {
        case 'sending':
          return '送信中';
        case 'unknown':
          return '再確認待ち';
        case 'conflict':
        case 'blocked':
          return '確認が必要';
        default:
          return '送信待ち';
      }
    }

    function render() {
      let status = '';

      if (!storageReady) {
        status = '準備中';
      } else if (legacyBlocked) {
        status = '旧画面の未送信があります';
      } else if (!configured()) {
        status = '接続先未設定';
      } else if (!navigator.onLine) {
        status = '通信なし';
      }

      $('status').textContent = status;
      $('status').hidden = !status;

      $('fields').disabled =
        !storageReady ||
        legacyBlocked ||
        !configured() ||
        busy;

      $('submit').textContent = busy ? '保存中' : '追加';

      $('send').disabled =
        !storageReady ||
        legacyBlocked ||
        !navigator.onLine ||
        !configured() ||
        !!pumpPromise;

      const needsCheck = state.jobs.filter(function (job) {
        return job.state === 'conflict' || job.state === 'blocked';
      }).length;

      $('outbox').hidden = !state.jobs.length;

      $('outbox-summary').textContent =
        '送信待ち ' + state.jobs.length + '件' +
        (needsCheck ? '・確認が必要 ' + needsCheck + '件' : '');

      const container = $('outbox-items');
      container.replaceChildren();

      state.jobs.forEach(function (job) {
        const row = document.createElement('div');
        row.className = 'job';

        const heading = document.createElement('div');
        heading.className = 'job-heading';

        const title = document.createElement('div');
        title.className = 'job-title';
        title.textContent = job.label || '未送信の操作';

        const badge = document.createElement('span');
        badge.className = 'job-state';

        if (job.state === 'conflict' || job.state === 'blocked') {
          badge.classList.add('needs-check');
        }

        badge.textContent = jobStateLabel(job);
        heading.append(title, badge);
        row.appendChild(heading);

        if (job.state === 'conflict' || job.state === 'blocked') {
          const link = document.createElement('a');
          link.href = './index.html';
          link.target = '_blank';
          link.rel = 'noopener';
          link.textContent = '一覧で確認する';
          row.appendChild(link);
        }

        if (job.note && job.state !== 'sending') {
          const details = document.createElement('details');
          const summary = document.createElement('summary');
          summary.textContent = '詳細';

          const note = document.createElement('div');
          note.className = 'detail-text';
          note.textContent = job.note;

          details.append(summary, note);
          row.appendChild(details);
        }

        container.appendChild(row);
      });

      if (needsCheck) {
        $('outbox').open = true;
      }
    }

    function stateChanged() {
      try {
        render();
      } catch (error) {
        console.error(error);
      }

      try {
        if (channel) {
          channel.postMessage('changed');
        }
      } catch (error) {
        console.error(error);
      }
    }

    /* ---------- 端末への保存 ---------- */

    function openDatabase() {
      return new Promise(function (resolve, reject) {
        if (!window.indexedDB) {
          reject(new Error('この端末では保存を利用できません。'));
          return;
        }

        const request = indexedDB.open(DB_NAME, 1);

        request.onupgradeneeded = function () {
          if (!request.result.objectStoreNames.contains('data')) {
            request.result.createObjectStore('data');
          }
        };

        request.onsuccess = function () {
          resolve(request.result);
        };

        request.onerror = function () {
          reject(request.error);
        };
      });
    }

    function readState() {
      return new Promise(function (resolve, reject) {
        const transaction = db.transaction('data', 'readonly');
        const request = transaction.objectStore('data').get('main');

        transaction.oncomplete = function () {
          try {
            resolve(checkedState(request.result));
          } catch (error) {
            reject(error);
          }
        };

        transaction.onerror = transaction.onabort = function () {
          reject(
            transaction.error ||
            new Error('端末の記録を読み取れませんでした。')
          );
        };
      });
    }

    function updateState(change) {
      return new Promise(function (resolve, reject) {
        const transaction = db.transaction('data', 'readwrite');
        const store = transaction.objectStore('data');
        const request = store.get('main');

        let next;
        let output;
        let caught;

        request.onsuccess = function () {
          try {
            next = checkedState(request.result);
            output = change(next);
            next.savedAt = Date.now();
            store.put(next, 'main');
          } catch (error) {
            caught = error;
            transaction.abort();
          }
        };

        transaction.oncomplete = function () {
          state = next;
          resolve(output);
          stateChanged();
        };

        transaction.onerror = transaction.onabort = function () {
          reject(
            caught ||
            transaction.error ||
            new Error('端末に保存できませんでした。')
          );
        };
      });
    }

    function lease(action) {
      return new Promise(function (resolve, reject) {
        const transaction = db.transaction('data', 'readwrite');
        const store = transaction.objectStore('data');
        const request = store.get('sender');
        let accepted = false;

        request.onsuccess = function () {
          const saved = request.result;
          const now = Date.now();

          if (action === 'release') {
            if (saved && saved.owner === TAB_ID) {
              store.delete('sender');
            }

            accepted = true;
            return;
          }

          if (!saved || saved.owner === TAB_ID || saved.until < now) {
            store.put({
              owner: TAB_ID,
              until: now + 180000
            }, 'sender');

            accepted = true;
          }
        };

        transaction.oncomplete = function () {
          resolve(accepted);
        };

        transaction.onerror = transaction.onabort = function () {
          reject(
            transaction.error ||
            new Error('送信の準備を確認できませんでした。')
          );
        };
      });
    }

    async function oldPendingCount() {
      let fallback;

      try {
        fallback = JSON.parse(localStorage.getItem('outbox_v1') || '[]');

        if (!Array.isArray(fallback)) {
          throw new Error('記録の形式が異なります。');
        }
      } catch (error) {
        throw new Error(
          '以前の未送信記録を読み取れません。端末データは消さないでください。'
        );
      }

      const old = await new Promise(function (resolve, reject) {
        const request = indexedDB.open('taskapp');
        let created = false;

        request.onupgradeneeded = function () {
          created = true;
          request.transaction.abort();
        };

        request.onerror = function () {
          if (created) {
            resolve([]);
          } else {
            reject(request.error);
          }
        };

        request.onsuccess = function () {
          const oldDb = request.result;

          if (!oldDb.objectStoreNames.contains('outbox')) {
            oldDb.close();
            resolve([]);
            return;
          }

          const transaction = oldDb.transaction('outbox', 'readonly');
          const get = transaction.objectStore('outbox').getAll();

          transaction.oncomplete = function () {
            oldDb.close();
            resolve(get.result || []);
          };

          transaction.onerror = transaction.onabort = function () {
            oldDb.close();
            reject(transaction.error);
          };
        };
      });

      return new Set(
        old.concat(fallback).map(function (job) {
          return job.id;
        })
      ).size;
    }

    async function enqueueAdd(title, due, date) {
      const id = uuid();

      await updateState(function (saved) {
        const keys = date ? ['day:' + date] : [];

        const causes = saved.jobs.filter(function (job) {
          return (job.keys || []).some(function (key) {
            return keys.indexOf(key) >= 0;
          });
        }).map(function (job) {
          return job.id;
        });

        saved.sequence++;

        saved.jobs.push({
          id: id,
          sequence: saved.sequence,
          payload: {
            action: 'add',
            requestId: id,
            title: title,
            due: due,
            date: date
          },
          label: '追加：' + title +
            ' ／ ' + (date ? '実行日：' + date : '実行日未定') +
            (due ? ' ／ 期限：' + due : ''),
          keys: keys,
          causes: causes,
          state: 'saved',
          frozen: false,
          note: ''
        });
      });

      return id;
    }

    /* ---------- 通信 ---------- */

    async function api(payload) {
      if (!configured()) {
        throw new Error(
          '通常画面の「設定」で、接続先と合い言葉を保存してください。'
        );
      }

      const settings = configuration();
      const connection = settings.url + '\n' + settings.token;

      const readOnly = [
        'load',
        'history',
        'preview',
        'check'
      ].indexOf(payload.action) >= 0;

      if (!readOnly && verifiedConnection !== connection) {
        const checked = await api({
          action: 'load'
        });

        if (!checked.ok) {
          return checked;
        }
      }

      const controller = new AbortController();
      let timedOut = false;

      const timer = setTimeout(function () {
        timedOut = true;
        controller.abort();
      }, REQUEST_TIMEOUT_MS);

      try {
        const response = await fetch(settings.url, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify(Object.assign({
            mode: 'web',
            token: settings.token
          }, payload)),
          redirect: 'follow',
          signal: controller.signal
        });

        if (!response.ok) {
          throw new Error(
            '保存先から正常な返答を受け取れませんでした' +
            '（応答番号：' + response.status + '）。'
          );
        }

        const text = await response.text();
        let result;

        try {
          result = JSON.parse(text);
        } catch (error) {
          throw new Error(
            '保存先から、タスクデータとして読めない返答が届きました。'
          );
        }

        if (
          !result ||
          typeof result !== 'object' ||
          typeof result.ok !== 'boolean'
        ) {
          throw new Error('保存先の返答を読み取れませんでした。');
        }

        if (result.ok && result.app !== SERVER_VERSION) {
          verifiedConnection = '';

          throw new Error(
            '保存先の版が' + SERVER_VERSION + 'ではありません。' +
            '通常画面の「設定」から「動作の点検」を実行してください。'
          );
        }

        if (result.ok) {
          verifiedConnection = connection;
        }

        return result;
      } catch (error) {
        if (timedOut) {
          throw new Error(
            '保存先の応答を60秒以内に受け取れなかったため、通信を終了しました。'
          );
        }

        if (error && error.name === 'AbortError') {
          throw new Error('通信が途中で中断されました。');
        }

        if (error && error.name === 'TypeError') {
          throw new Error(
            '保存先に接続できませんでした。通信が戻ってから再確認します。'
          );
        }

        throw error;
      } finally {
        clearTimeout(timer);
      }
    }

    function requireSnapshot(snapshot) {
      if (
        !snapshot ||
        !Array.isArray(snapshot.tasks) ||
        !snapshot.days ||
        !snapshot.periodic ||
        !Array.isArray(snapshot.periodic.items) ||
        !snapshot.undo
      ) {
        throw new Error(
          '保存先の返答に、必要なタスク一覧が含まれていません。'
        );
      }
    }

    function applyAddLinks(saved, links) {
      if (!links) {
        return;
      }

      saved.jobs.forEach(function (job) {
        const link = links[job.id];

        if (
          job.payload.action === 'add' &&
          link &&
          typeof link.taskId === 'string'
        ) {
          job.remoteTaskId = link.taskId;
          job.remoteConfirmed = link.confirmed === true;
        }
      });
    }

    function storeSnapshot(saved, snapshot) {
      applyAddLinks(saved, snapshot.addLinks);

      const previousTime = saved.snapshot
        ? Date.parse(saved.snapshot.fetchedAt || '')
        : NaN;

      const incomingTime = Date.parse(snapshot.fetchedAt || '');

      if (
        Number.isFinite(previousTime) &&
        Number.isFinite(incomingTime) &&
        incomingTime < previousTime
      ) {
        return;
      }

      saved.snapshot = snapshot;
    }

    function compareTasks(a, b) {
      const first = a.hour === null ? 7 : a.hour;
      const second = b.hour === null ? 7 : b.hour;

      if (first !== second) {
        return first - second;
      }

      const orderA = a.order == null ? Infinity : a.order;
      const orderB = b.order == null ? Infinity : b.order;

      return orderA - orderB || a.row - b.row;
    }

    function mergePlan(items, tasks, date) {
      const available = tasks.filter(function (task) {
        return task.date === date;
      }).sort(compareTasks);

      const byId = new Map(
        available.map(function (task) {
          return [task.taskId, task];
        })
      );

      const used = new Set();
      const output = [];

      (items || []).forEach(function (item) {
        if (byId.has(item.id) && !used.has(item.id)) {
          used.add(item.id);

          output.push({
            id: item.id,
            hour: item.hour
          });
        }
      });

      available.forEach(function (task) {
        if (!used.has(task.taskId)) {
          output.push({
            id: task.taskId,
            hour: task.hour
          });
        }
      });

      return output.map(function (item, index) {
        return {
          item: item,
          index: index
        };
      }).sort(function (a, b) {
        const first = a.item.hour === null ? 7 : a.item.hour;
        const second = b.item.hour === null ? 7 : b.item.hour;

        return first - second || a.index - b.index;
      }).map(function (entry) {
        return entry.item;
      });
    }

    function advance(payload, transition) {
      if (!transition) {
        return;
      }

      (transition.days || []).forEach(function (entry) {
        if (
          payload.action === 'order' &&
          payload.date === entry.key &&
          payload.expectedDay === entry.before
        ) {
          payload.expectedDay = entry.after;
        }
      });

      (transition.tasks || []).forEach(function (entry) {
        if (
          payload.taskId === entry.key &&
          payload.expectedTask === entry.before
        ) {
          payload.expectedTask = entry.after;
        }
      });

      if (
        transition.periodic &&
        payload.expectedPeriodic === transition.periodic.before
      ) {
        payload.expectedPeriodic = transition.periodic.after;
      }

      if (
        transition.undo &&
        payload.expectedUndo === transition.undo.before
      ) {
        payload.expectedUndo = transition.undo.after;
      }
    }

    function readyJob(saved) {
      const ids = new Set(
        saved.jobs.map(function (job) {
          return job.id;
        })
      );

      return saved.jobs.slice().sort(function (a, b) {
        return a.sequence - b.sequence;
      }).find(function (job) {
        return ['saved', 'unknown', 'sending'].indexOf(job.state) >= 0 &&
          !job.causes.some(function (id) {
            return ids.has(id);
          });
      });
    }

    function pump(force) {
      if (pumpPromise) {
        return pumpPromise;
      }

      if (
        !storageReady ||
        legacyBlocked ||
        !navigator.onLine ||
        !configured() ||
        (!force && Date.now() < nextTry)
      ) {
        return Promise.resolve();
      }

      pumpPromise = drainOutbox().catch(function (error) {
        notify(
          '端末の記録を確認できません',
          true,
          String(error.message || error) +
          '\nデータを消さずに、通常画面で確認してください。'
        );
      }).finally(function () {
        pumpPromise = null;
        render();
      });

      render();
      return pumpPromise;
    }

    async function drainOutbox() {
      let ownsLease = false;
      let renewal = null;

      state = await readState();

      if (!readyJob(state)) {
        return;
      }

      try {
        ownsLease = await lease('claim');

        if (!ownsLease) {
          return;
        }

        renewal = setInterval(function () {
          lease('claim').catch(function () {
            // 次の送信前にも所有状態を確認する。
          });
        }, 10000);

        while (navigator.onLine && configured()) {
          if (!(await lease('claim'))) {
            break;
          }

          state = await readState();

          if (!readyJob(state)) {
            break;
          }

          let job = null;

          await updateState(function (saved) {
            const current = readyJob(saved);

            if (!current) {
              return;
            }

            if (
              !current.frozen &&
              current.payload.action === 'order' &&
              saved.snapshot
            ) {
              current.payload.items = mergePlan(
                current.payload.items,
                saved.snapshot.tasks,
                current.payload.date
              );
            }

            current.frozen = true;
            current.state = 'sending';
            current.note = '送信結果を確認しています。';
            job = clone(current);
          });

          if (!job) {
            break;
          }

          try {
            const result = await api(job.payload);

            if (result.ok) {
              requireSnapshot(result.snapshot);

              await updateState(function (saved) {
                const exists = saved.jobs.some(function (entry) {
                  return entry.id === job.id;
                });

                if (!exists) {
                  return;
                }

                saved.jobs.forEach(function (entry) {
                  if (
                    entry.id !== job.id &&
                    !entry.frozen &&
                    entry.causes.indexOf(job.id) >= 0
                  ) {
                    advance(entry.payload, result.transition);
                  }
                });

                saved.jobs = saved.jobs.filter(function (entry) {
                  return entry.id !== job.id;
                });

                saved.transitions.push({
                  id: job.id,
                  transition: result.transition
                });

                saved.transitions = saved.transitions.slice(-100);
                storeSnapshot(saved, result.snapshot);
              });

              failures = 0;
              nextTry = 0;
              continue;
            }

            const conflict = result.status === 'conflict';
            const blocked =
              result.status === 'invalid' ||
              result.status === 'indeterminate';

            if (result.snapshot) {
              requireSnapshot(result.snapshot);
            }

            await updateState(function (saved) {
              const current = saved.jobs.find(function (entry) {
                return entry.id === job.id;
              });

              if (!current) {
                return;
              }

              current.state = conflict
                ? 'conflict'
                : blocked
                  ? 'blocked'
                  : 'unknown';

              current.note = result.message || '後で再試行します。';

              if (result.snapshot) {
                storeSnapshot(saved, result.snapshot);
              }
            });

            if (conflict || blocked) {
              continue;
            }

            throw new Error(
              result.message || '送信を確認できませんでした。'
            );
          } catch (error) {
            failures++;

            nextTry = Date.now() + Math.min(
              300000,
              5000 * Math.pow(2, Math.min(failures, 6))
            );

            await updateState(function (saved) {
              const current = saved.jobs.find(function (entry) {
                return entry.id === job.id;
              });

              if (
                current &&
                current.state !== 'conflict' &&
                current.state !== 'blocked'
              ) {
                current.state = 'unknown';

                current.note =
                  String(error.message || error) +
                  '\n未反映とは限りません。同じ受付番号で再確認します。';
              }
            });

            break;
          }
        }
      } finally {
        if (renewal) {
          clearInterval(renewal);
        }

        if (ownsLease) {
          await lease('release').catch(function () {
            return null;
          });
        }
      }
    }

    /* ---------- 専用キーからの呼び出し ---------- */

    function focusTitle() {
      if (
        storageReady &&
        !legacyBlocked &&
        !busy &&
        configured()
      ) {
        const input = $('title');

        input.focus({
          preventScroll: true
        });

        input.setSelectionRange(
          input.value.length,
          input.value.length
        );
      }
    }

    window.addEventListener('message', function (event) {
      if (
        event.source !== window ||
        event.origin !== window.location.origin ||
        !event.data ||
        event.data.channel !== EXTENSION_CHANNEL ||
        event.data.type !== 'focus'
      ) {
        return;
      }

      focusTitle();
    });

    /* ---------- 入力 ---------- */

    function validDate(value) {
      if (!value) {
        return true;
      }

      if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) {
        return false;
      }

      const parsed = new Date(value + 'T12:00:00Z');

      return !isNaN(parsed.getTime()) &&
        parsed.toISOString().slice(0, 10) === value;
    }

    async function saveForm() {
      if (
        busy ||
        !storageReady ||
        legacyBlocked ||
        !configured()
      ) {
        return;
      }

      const form = $('add-form');

      if (!form.reportValidity()) {
        return;
      }

      const title = $('title').value.trim();
      const due = $('due').value;
      const date = $('date').value;

      if (!title || title.length > 200) {
        notify('件名は1～200文字で入力してください', true);
        $('title').focus();
        return;
      }

      if (!validDate(due) || !validDate(date)) {
        notify('日付を確認してください', true);
        return;
      }

      busy = true;
      render();
      notify('');

      try {
        await enqueueAdd(title, due, date);
      } catch (error) {
        busy = false;
        render();

        notify(
          '端末に保存できませんでした',
          true,
          '入力は消していません。\n' + String(error.message || error)
        );

        focusTitle();
        return;
      }

      // 端末への保存が確定した後にだけ、入力欄を空にする。
      $('title').value = '';
      $('due').value = '';
      $('date').value = '';

      busy = false;
      render();
      notify('端末に保存しました');
      focusTitle();

      // ウィンドウを閉じたり最小化したりせず、送信を続ける。
      pump(true);
    }

    $('add-form').addEventListener('compositionstart', function () {
      composing = true;
    });

    $('add-form').addEventListener('compositionend', function () {
      composing = false;
      imeGuardUntil = performance.now() + 100;
    });

    $('add-form').addEventListener('keydown', function (event) {
      const usingIme =
        composing ||
        event.isComposing ||
        event.keyCode === 229;

      if (usingIme) {
        imeGuardUntil = performance.now() + 100;
        return;
      }

      if (
        event.key !== 'Enter' ||
        !(event.target instanceof HTMLInputElement)
      ) {
        return;
      }

      event.preventDefault();

      if (
        event.repeat ||
        busy ||
        performance.now() < imeGuardUntil
      ) {
        return;
      }

      $('add-form').requestSubmit();
    });

    $('add-form').addEventListener('submit', function (event) {
      event.preventDefault();

      if (
        composing ||
        busy ||
        performance.now() < imeGuardUntil
      ) {
        return;
      }

      saveForm();
    });

    $('send').addEventListener('click', function () {
      nextTry = 0;
      pump(true);
    });

    /* ---------- 起動・再開 ---------- */

    async function reread(sendNow) {
      if (!storageReady) {
        return;
      }

      try {
        state = await readState();
        render();

        if (sendNow) {
          nextTry = 0;
          pump(true);
        } else {
          pump(false);
        }
      } catch (error) {
        notify(
          '端末の記録を読み取れません',
          true,
          'データは消さずに開き直してください。\n' +
          String(error.message || error)
        );
      }
    }

    window.addEventListener('online', function () {
      reread(true);
    });

    window.addEventListener('offline', render);

    window.addEventListener('storage', function (event) {
      if (
        event.key === URL_KEY ||
        event.key === TOKEN_KEY ||
        event.key === null
      ) {
        verifiedConnection = '';
        render();
        reread(true);
      }
    });

    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) {
        reread(true);
      }
    });

    window.addEventListener('beforeunload', function (event) {
      if (
        busy ||
        $('title').value ||
        $('due').value ||
        $('date').value
      ) {
        event.preventDefault();
        event.returnValue = '';
      }
    });

    setInterval(function () {
      reread(false);
    }, 15000);

    async function start() {
      try {
        db = await openDatabase();

        db.onversionchange = function () {
          db.close();
          storageReady = false;
          render();

          notify(
            '小窓を開き直してください',
            true,
            '端末の保存先が変更されました。入力途中の内容を控えてから開き直してください。'
          );
        };

        state = await readState();
        const oldCount = await oldPendingCount();

        legacyBlocked = oldCount > 0;
        storageReady = true;

        if (legacyBlocked) {
          notify(
            '旧画面の未送信があります',
            true,
            '以前の画面に未送信が ' + oldCount +
            '件残っています。記録は消していません。通常画面で確認してください。'
          );
        } else if (!configured()) {
          notify(
            '接続先を設定してください',
            true,
            '「一覧を開く」から通常画面の「設定」を開き、接続先と合い言葉を保存してください。'
          );
        }

        if ('BroadcastChannel' in window) {
          channel = new BroadcastChannel('task-unified-state');

          channel.onmessage = function () {
            reread(false);
          };
        }

        render();
        focusTitle();

        if (!legacyBlocked) {
          pump(true);
        }
      } catch (error) {
        storageReady = false;
        render();

        notify(
          '端末への保存を準備できません',
          true,
          '追加を止めています。\n' + String(error.message || error)
        );
      }
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', {
        updateViaCache: 'none'
      }).then(function (registration) {
        return registration.update();
      }).catch(function () {
        notify(
          '画面の更新を確認できません',
          true,
          '通信できる状態で小窓を開き直してください。端末の記録は消していません。'
        );
      });
    }

    start();
  </script>
</body>
</html>
