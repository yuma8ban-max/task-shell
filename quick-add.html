<!-- Output: html -->
<!-- File: quick-add.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a73e8">
  <title>タスクを追加</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./icon-check-32.png">
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      color: #202833;
      background: #f6f8fb;
      font-family: -apple-system, system-ui, sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
    }

    .version {
      margin-left: auto;
      color: #46576a;
      font-size: 12px;
    }

    .status {
      margin-bottom: 12px;
      color: #725619;
      font-size: 14px;
      line-height: 1.5;
    }

    .notice {
      margin: 10px 0 16px;
      padding: 10px 12px;
      border: 1px solid #cbdcec;
      border-radius: 8px;
      color: #234f77;
      background: #edf5ff;
      font-size: 14px;
      line-height: 1.6;
    }

    .notice.error {
      border-color: #e7bdba;
      color: #8f211c;
      background: #fff1ef;
    }

    .notice-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .notice-row span {
      flex: 1;
      min-width: 0;
    }

    .notice-close {
      min-height: 30px;
      width: 30px;
      padding: 0;
      border: 0;
      color: inherit;
      background: transparent;
      font-size: 20px;
    }

    .detail-text {
      margin-top: 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.6;
    }

    fieldset {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    label {
      display: grid;
      gap: 7px;
      margin-bottom: 16px;
      font-size: 14px;
    }

    input,
    button {
      font: inherit;
    }

    input {
      width: 100%;
      min-width: 0;
      min-height: 44px;
      padding: 11px;
      border: 1px solid #bcc7d4;
      border-radius: 8px;
      color: #202833;
      background: #fff;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid #c5dcff;
      border-color: #1a73e8;
    }

    .dates {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      min-height: 42px;
      padding: 9px 14px;
      border: 1px solid #ccd4de;
      border-radius: 8px;
      color: #263445;
      background: #fff;
      cursor: pointer;
    }

    button.primary {
      min-width: 96px;
      border-color: #1a73e8;
      color: #fff;
      background: #1a73e8;
    }

    button:disabled {
      opacity: .5;
      cursor: default;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid #d8dfe6;
      font-size: 14px;
    }

    a {
      color: #1559ad;
    }

    details {
      font-size: 14px;
    }

    summary {
      cursor: pointer;
    }

    #outbox {
      margin-top: 16px;
      padding: 12px;
      border: 1px solid #ddcfab;
      border-radius: 9px;
      background: #fffaf0;
    }

    #send {
      margin-top: 10px;
    }

    .job {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #e7dfcd;
      overflow-wrap: anywhere;
    }

    .job-heading {
      display: flex;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 7px;
    }

    .job-title {
      flex: 1;
      min-width: 160px;
      line-height: 1.5;
    }

    .job-state {
      padding: 2px 7px;
      border-radius: 5px;
      color: #725619;
      background: #f6e9c7;
      font-size: 13px;
      white-space: nowrap;
    }

    .job-state.needs-check {
      color: #8f211c;
      background: #f9dcd8;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 380px) {
      .dates {
        grid-template-columns: 1fr;
        gap: 0;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>タスクを追加</h1>
    <span class="version">v4.8</span>
  </header>

  <div id="status" class="status" aria-live="polite">準備中</div>

  <div id="notice" class="notice" hidden aria-live="polite">
    <div class="notice-row">
      <span id="notice-text"></span>
      <button
        id="notice-close"
        class="notice-close"
        type="button"
        aria-label="お知らせを閉じる">×</button>
    </div>
    <details id="notice-details" hidden>
      <summary>詳細</summary>
      <div id="notice-detail-body" class="detail-text"></div>
    </details>
  </div>

  <form id="add-form">
    <fieldset id="fields" disabled>
      <label>
        件名＊
        <input
          id="title"
          type="text"
          maxlength="200"
          required
          autocomplete="off"
          enterkeyhint="done">
      </label>

      <div class="dates">
        <label>
          期限
          <input
            id="due"
            type="date"
            min="0001-01-01"
            max="9999-12-31">
        </label>

        <label>
          実行日
          <input
            id="date"
            type="date"
            min="0001-01-01"
            max="9999-12-31">
        </label>
      </div>

      <div class="actions">
        <button id="submit" type="submit" class="primary">追加</button>
      </div>
    </fieldset>
  </form>

  <details id="outbox" hidden>
    <summary id="outbox-summary">送信待ち</summary>
    <button id="send" type="button">いま送る</button>
    <div id="outbox-items"></div>
  </details>

  <footer>
    <a href="./index.html" target="_blank" rel="noopener">一覧を開く</a>
    <details>
      <summary>状態</summary>
      <div id="diagnostics" class="detail-text"></div>
    </details>
  </footer>

  <script src="./task-core.js?v=4.8"></script>
  <script>
    (function () {
      'use strict';

      function $(id) {
        return document.getElementById(id);
      }

      if (!window.TaskCore || TaskCore.VERSION !== 'v4.8') {
        $('status').textContent =
          '画面の準備ができません。task-core.js を置いてから開き直してください。';
        return;
      }

      let client = null;
      let busy = false;
      let composing = false;
      let imeUntil = 0;
      let noticeTimer = null;

      function notify(text, error, detail) {
        if (noticeTimer) {
          clearTimeout(noticeTimer);
          noticeTimer = null;
        }

        $('notice-text').textContent = text || '';
        $('notice').className = 'notice' + (error ? ' error' : '');
        $('notice').hidden = !text;
        $('notice-detail-body').textContent = detail || '';
        $('notice-details').hidden = !detail;
        $('notice-details').open = false;

        if (text && !error) {
          noticeTimer = setTimeout(function () {
            $('notice').hidden = true;
          }, 3500);
        }
      }

      function make(tag, text, className) {
        const element = document.createElement(tag);

        if (text != null) {
          element.textContent = text;
        }

        if (className) {
          element.className = className;
        }

        return element;
      }

      function seconds(value) {
        return Number.isFinite(value)
          ? (value / 1000).toFixed(2) + '秒'
          : '未取得';
      }

      function render() {
        const state = client.state;
        let status = '';

        if (!client.ready) {
          status = '準備中';
        } else if (client.legacyCount) {
          status = '旧画面の未送信があります';
        } else if (!client.configured()) {
          status = '接続先未設定';
        } else if (!navigator.onLine) {
          status = '通信なし';
        }

        $('status').textContent = status;
        $('status').hidden = !status;

        $('fields').disabled =
          !client.ready ||
          !!client.legacyCount ||
          !client.configured() ||
          busy;

        $('submit').textContent = busy ? '保存中' : '追加';
        $('send').disabled =
          !client.ready ||
          !navigator.onLine ||
          !client.configured();

        const attention = state.jobs.filter(function (job) {
          return job.state === 'conflict' || job.state === 'blocked';
        }).length;

        $('outbox').hidden = !state.jobs.length;
        $('outbox-summary').textContent =
          '送信待ち ' + state.jobs.length + '件' +
          (attention ? '・確認が必要 ' + attention + '件' : '');

        const container = $('outbox-items');
        container.replaceChildren();

        state.jobs.forEach(function (job) {
          const row = make('div', null, 'job');
          const heading = make('div', null, 'job-heading');
          const needsCheck =
            job.state === 'conflict' || job.state === 'blocked';

          const label = needsCheck
            ? '確認が必要'
            : job.state === 'sending'
              ? '送信結果を確認中'
              : job.state === 'unknown'
                ? '再確認待ち'
                : '送信待ち';

          heading.append(
            make('div', job.label || '未送信の操作', 'job-title'),
            make(
              'span',
              label,
              'job-state' + (needsCheck ? ' needs-check' : '')
            )
          );

          row.appendChild(heading);

          if (needsCheck) {
            const link = make('a', '一覧で確認する');
            link.href = './index.html';
            link.target = '_blank';
            link.rel = 'noopener';
            row.appendChild(link);
          }

          if (job.note) {
            const details = make('details');
            details.append(
              make('summary', '詳細'),
              make('div', job.note, 'detail-text')
            );
            row.appendChild(details);
          }

          container.appendChild(row);
        });

        if (attention) {
          $('outbox').open = true;
        }

        const last = state.lastSend;

        $('diagnostics').textContent = [
          '送信の引き継ぎ：' + (client.fastHandoff ? '自動' : '従来方式'),
          '未送信：' + state.jobs.length + '件',
          '旧画面の送信記録：' +
            (client.legacyWaitUntil > Date.now() ? '終了確認待ち' : '待ちなし'),
          last ? '直近の送信' : '送信時間：未取得',
          last ? '開始まで：' + seconds(last.waitMs) : '',
          last ? '返答まで：' + seconds(last.roundTripMs) : '',
          last ? '保存先処理：' + seconds(last.serverMs) : ''
        ].filter(Boolean).join('\n');
      }

      client = TaskCore.create({
        onChange: render,
        onIssue: function (text, detail) {
          notify(text, true, detail);
        }
      });

      function focusTitle() {
        if (
          client.ready &&
          !client.legacyCount &&
          client.configured() &&
          !busy
        ) {
          const input = $('title');

          input.focus({
            preventScroll: true
          });

          input.setSelectionRange(input.value.length, input.value.length);
        }
      }

      function validDate(value) {
        if (!value) {
          return true;
        }

        if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) {
          return false;
        }

        const date = new Date(value + 'T12:00:00Z');

        return !isNaN(date.getTime()) &&
          date.toISOString().slice(0, 10) === value;
      }

      async function saveForm() {
        if (
          busy ||
          !client.ready ||
          client.legacyCount ||
          !client.configured()
        ) {
          return;
        }

        if (!$('add-form').reportValidity()) {
          return;
        }

        const title = $('title').value.trim();
        const due = $('due').value;
        const date = $('date').value;

        if (!title || title.length > 200) {
          notify('件名は1～200文字で入力してください', true);
          focusTitle();
          return;
        }

        if (!validDate(due) || !validDate(date)) {
          notify('日付を確認してください', true);
          return;
        }

        busy = true;
        render();
        notify('');

        try {
          await client.enqueue({
            action: 'add',
            title: title,
            due: due,
            date: date
          }, '追加：' + title +
            ' ／ ' + (date ? '実行日：' + date : '実行日未定') +
            (due ? ' ／ 期限：' + due : '')
          );
        } catch (error) {
          busy = false;
          render();

          notify(
            '端末に保存できませんでした',
            true,
            '入力は消していません。\n' + String(error.message || error)
          );

          focusTitle();
          return;
        }

        // 端末保存の確定後にだけ入力欄を空にする。
        $('title').value = '';
        $('due').value = '';
        $('date').value = '';

        busy = false;
        render();
        notify('端末に保存しました');
        focusTitle();
      }

      $('add-form').addEventListener('compositionstart', function () {
        composing = true;
      });

      $('add-form').addEventListener('compositionend', function () {
        composing = false;
        imeUntil = performance.now() + 100;
      });

      $('add-form').addEventListener('keydown', function (event) {
        if (
          composing ||
          event.isComposing ||
          event.keyCode === 229
        ) {
          imeUntil = performance.now() + 100;
          return;
        }

        if (
          event.key !== 'Enter' ||
          !(event.target instanceof HTMLInputElement)
        ) {
          return;
        }

        event.preventDefault();

        if (
          event.repeat ||
          busy ||
          performance.now() < imeUntil
        ) {
          return;
        }

        $('add-form').requestSubmit();
      });

      $('add-form').addEventListener('submit', function (event) {
        event.preventDefault();

        if (
          composing ||
          busy ||
          performance.now() < imeUntil
        ) {
          return;
        }

        saveForm();
      });

      $('send').onclick = function () {
        client.pump(true);
      };

      $('notice-close').onclick = function () {
        notify('');
      };

      window.addEventListener('message', function (event) {
        if (
          event.source === window &&
          event.origin === window.location.origin &&
          event.data &&
          event.data.channel === 'task-quick-extension-v1' &&
          event.data.type === 'focus'
        ) {
          focusTitle();
        }
      });

      document.addEventListener('visibilitychange', function () {
        if (!document.hidden && client.ready) {
          client.reloadLocal().then(function () {
            client.pump(false);
          }).catch(function (error) {
            notify(
              '端末の記録を読み取れません',
              true,
              String(error.message || error)
            );
          });
        }
      });

      window.addEventListener('beforeunload', function (event) {
        if (
          busy ||
          $('title').value ||
          $('due').value ||
          $('date').value
        ) {
          event.preventDefault();
          event.returnValue = '';
        }
      });

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js', {
          updateViaCache: 'none'
        }).then(function (registration) {
          return registration.update();
        }).catch(function (error) {
          notify(
            '画面の更新を確認できません',
            true,
            String(error.message || error)
          );
        });
      }

      (async function () {
        try {
          await client.start();
          render();
          focusTitle();

          if (!client.configured()) {
            notify(
              '接続先を設定してください',
              true,
              '「一覧を開く」から通常画面の「設定」を開いてください。'
            );
          } else {
            client.pump(false);
          }
        } catch (error) {
          notify(
            '端末への保存を準備できません',
            true,
            String(error.message || error)
          );
        }
      })();
    })();
  </script>
</body>
</html>
